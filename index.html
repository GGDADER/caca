function saveCard(){
  var id=$('c_id').value;
  var name=$('c_name').value.trim();
  if(!name){ toast('請填卡片名稱'); return; }
  var c = id ? byId(S.cards,id) : null;
  if(!c){ c={id:uid(), log:[]}; S.cards.push(c); }
  c.name  = name;
  c.code  = normCode($('c_code').value);
  c.last4 = padz($('c_last4').value, 4);
  c.limit = Math.round(numVal('c_limit', 0) * 10000);
  c.close = Math.min(31, Math.max(1, numVal('c_close', 5)||5));
  c.due   = Math.min(31, Math.max(1, numVal('c_due', 23)||23));
  c.dueNext = $('c_dnext').value === '1';
  c.base  = numVal('c_base', 0);
  c.baseDate = $('c_bdate').value || ds(today());
  c.acct  = $('c_acct').value.trim();
  c.adjDate = $('c_adjd') ? $('c_adjd').value : (c.adjDate||'');
  c.adjNext = c.adjDate ? calcAdjNext(c.adjDate) : (c.adjNext||'');
  c.nbId   = $('c_nbid') ? $('c_nbid').value.trim() : (c.nbId||'');
  c.nbHint = $('c_nbhint') ? $('c_nbhint').value.trim() : (c.nbHint||'');
  c.color = $('c_color').value;
  c.note  = $('c_note').value.trim();
  c.off   = $('c_off').checked;
  c.net   = $('c_net') ? $('c_net').value : (c.net||'');
  c.tier  = $('c_tier') ? $('c_tier').value : (c.tier||'一般卡');
  c.tra   = $('c_tra') ? $('c_tra').value : (c.tra||'無');
  c.site  = $('c_site') ? $('c_site').value.trim() : (c.site||'');
  c.auto  = $('c_auto') ? $('c_auto').checked : false;
  c.nb    = $('c_nb') ? $('c_nb').checked : false;
  c.dep   = $('c_dep') ? $('c_dep').checked : false;
  c.sec   = $('c_sec') ? $('c_sec').checked : false;
  c.traOn = $('c_traon') ? ($('c_traon').value === '已啟用') : !!c.traOn;
  c.deb   = $('c_debit') ? $('c_debit').checked : !!c.deb;
  c.exp   = $('c_exp') ? expParse($('c_exp').value) : (c.exp||'');
  c.shr   = !!c.code;                 /* 同行一律共用額度，不再逐張設定 */
  /* 與銀行的關係（網銀 / 存款戶 / 證券戶）屬於銀行層級，同行自動同步 */
  var syncN = 0, SW = {};
  if(c.code){
    for(var q=0;q<S.cards.length;q++){
      var x=S.cards[q];
      if(x===c || normCode(x.code)!==normCode(c.code)) continue;
      x.shr = true;
      var ch=false;
      /* 同行＝一張合併帳單：結帳日、繳款截止日、額度、可調額日全行共通 */
      if(x.close!==c.close || x.due!==c.due || x.dueNext!==c.dueNext){
        x.close=c.close; x.due=c.due; x.dueNext=c.dueNext; ch=true; SW.cyc=1;
      }
      if(x.limit!==c.limit){ x.limit=c.limit; ch=true; SW.lim=1; }
      if(x.adjNext!==c.adjNext || x.adjDate!==c.adjDate){
        x.adjNext=c.adjNext; x.adjDate=c.adjDate; ch=true; SW.adj=1;
      }
      if(x.nbId!==c.nbId || x.nbHint!==c.nbHint){
        x.nbId=c.nbId; x.nbHint=c.nbHint; ch=true; SW.nb=1;
      }
      if(x.nb!==c.nb || x.dep!==c.dep || x.sec!==c.sec || x.auto!==c.auto){
        x.nb=c.nb; x.dep=c.dep; x.sec=c.sec; x.auto=c.auto; ch=true; SW.rel=1;
      }
      if(ch) syncN++;
    }
  }
  if(!c.log) c.log=[];
  save(); closeSheet(); render();
  var what=[];
  if(SW.cyc) what.push('結帳/繳款日');
  if(SW.lim) what.push('額度');
  if(SW.adj) what.push('調額日');
  if(SW.nb)  what.push('網銀資料');
  if(SW.rel) what.push('帳戶關係');
  toast(c.limit<=0 ? '已儲存，但額度是 0，不會計入總額度'
      : (syncN ? (what.join('、')+' 已同步到 '+(bankName(c.code)||'同行')+' 其他 '+syncN+' 張')
               : ('已儲存 · '+c.name+' 額度 '+wan(c.limit))));
}
function delCard(id){
  var c=byId(S.cards,id); if(!c) return;
  var n=0, i;
  for(i=0;i<S.txns.length;i++){ if(S.txns[i].cid===id) n++; }
  if(!confirm('刪除「'+c.name+'」？\n這張卡的 '+n+' 筆消費紀錄也會一起刪除，無法復原。')) return;
  var nt=[], np=[];
  for(i=0;i<S.txns.length;i++){ if(S.txns[i].cid!==id) nt.push(S.txns[i]); else tomb(S.txns[i].id); }
  for(i=0;i<S.pays.length;i++){ if(S.pays[i].cid!==id) np.push(S.pays[i]); else tomb(S.pays[i].id); }
  S.txns=nt; S.pays=np;
  var nc=[]; for(i=0;i<S.cards.length;i++){ if(S.cards[i].id!==id) nc.push(S.cards[i]); }
  S.cards=nc;
  save(); closeSheet(); render(); toast('已刪除');
}

function pasteSheet(){
  openSheet('<h3>貼上銀行通知</h3>'

    + '<textarea id="pz" placeholder="【玉山銀行】您的信用卡末四碼1234 於 01/15 12:30 消費 NT$1,250 商店：全家便利商店"></textarea>'
    + '<button class="btn" onclick="doParse()">解析並填入</button>'
    + '<button class="btn ghost sm" onclick="closeSheet()">取消</button>');
  setTimeout(function(){ if($('pz')) $('pz').focus(); }, 320);
}
function parseNotify(s){
  s = String(s||'').replace(/\u3000/g,' ');
  var r = {a:0, l4:'', d:'', m:''}, mm;

  mm = s.match(/(?:NT\$|NTD|TWD|新臺幣|新台幣|金額|消費|授權)[^\d\-]{0,6}([\d,]+(?:\.\d{1,2})?)/);
  if(!mm) mm = s.match(/([\d,]{2,})\s*元/);
  if(mm) r.a = Number(String(mm[1]).replace(/,/g,'')) || 0;

  mm = s.match(/(?:末\s*[四4]\s*碼|後\s*[四4]\s*碼|尾號|末碼|卡號)[^\d]{0,8}(\d{4})(?!\d)/);
  if(!mm) mm = s.match(/[*x\u2022]{2,}\s*(\d{4})(?!\d)/i);
  if(mm) r.l4 = mm[1];

  var y = today().getFullYear();
  mm = s.match(/(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
  if(mm){ r.d = mm[1]+'-'+p2(+mm[2])+'-'+p2(+mm[3]); }
  else{
    mm = s.match(/(?:^|[^\d])(\d{1,2})[\/\-](\d{1,2})(?![\d\/\-])/);
    if(mm){
      var mo=+mm[1], dy=+mm[2];
      if(mo>=1 && mo<=12 && dy>=1 && dy<=31){
        var cand = new Date(y, mo-1, dy);
        if(cand - today() > 86400000*45) cand = new Date(y-1, mo-1, dy);
        r.d = ds(cand);
      }
    }
  }
  if(!r.d) r.d = ds(today());

  mm = s.match(/(?:商店|特店|店名|消費地點|商店名稱|特約商店)\s*[：:]\s*([^\n\r，,。；;]{1,28})/);
  if(!mm) mm = s.match(/(?:於|在)\s*([A-Za-z0-9\u4e00-\u9fa5][^\n\r，,。；;]{1,24}?)\s*(?:消費|刷卡|授權|使用)/);
  if(mm) r.m = String(mm[1]).replace(/\s+$/,'').replace(/^\s+/,'');

  return r;
}
function doParse(){
  var r = parseNotify($('pz').value);
  if(!r.a){ toast('抓不到金額，請手動填'); }
  DRAFT.a = r.a || '';
  DRAFT.d = r.d;
  DRAFT.m = r.m || '';
  if(r.l4){
    for(var i=0;i<S.cards.length;i++){
      if(S.cards[i].last4 === r.l4){ DRAFT.cid = S.cards[i].id; break; }
    }
  }
  closeSheet(); go('add');
  toast(r.a ? ('抓到 NT$'+fmt(r.a)+(r.l4?' · 末四碼 '+r.l4:'')) : '請確認欄位');
}

function unpayG(gkey, per){

  var n=[], i, j, hit;
  for(i=0;i<S.pays.length;i++){

    if(hit) tomb(p.id); else n.push(p);
  }
  S.pays=n; save(); render(); toast('已取消');
}
/* 這一期的消費明細。帳單群組可能是同一家的好幾張卡合併。
   ref 給哪一天，就算哪一期；不給就是現在這一期。
   帳單匯入的明細跟著「印著它的那份帳單」走（v3.21，見 perMap），不看消費日；
   同一組的卡結帳日一定相同（群組鍵含結帳日），所以用主卡算期別。 */
function billTxns(g, ref){
  var out = [], M = perMap(), ids = {}, ym = ymOf(lastClose(g.primary, ref)), i, t;
  for(i=0;i<g.cards.length;i++) ids[g.cards[i].id] = 1;
  for(i=0;i<S.txns.length;i++){
    t = S.txns[i];
    if(ids[t.cid] && M[t.id] === ym) out.push(t);
  }
  out.sort(function(x, y){ return x.d < y.d ? 1 : (x.d > y.d ? -1 : 0); });
  return out;
}
/* 從「期別」找出那一期的參考日。
   不能直接用 pd(cyc)：cyc 記的是當時的結帳日，卡片的結帳日後來被帳單更新過
   （v3.14 起會自動寫回），新的結帳日只要比記下來的那天晚，lastClose 就會
   整個退到上一期，明細就變成上個月的。用「那個月的月底」當參考日就不會 ——
   不管結帳日是幾號，那一期的結帳日一定落在這個月裡面。
   順便也擋掉 cyc 是年月字串、或被試算表轉成 ISO 字串的情況。 */
function cycRef(cyc){
  var m = String(cyc||'').slice(0,7).split('-');
  if(m.length < 2 || !+m[0]) return null;
  return mk(+m[0], (+m[1]||1) - 1, 31);      // mk 會夾到該月最後一天
}

/* 點繳款紀錄：看那一期繳了多少、那一期刷了什麼 */
function paySheet(pid){
  var p = null, i;
  for(i=0;i<S.pays.length;i++) if(S.pays[i].id===pid) p = S.pays[i];
  if(!p) return;
  var c = byId(S.cards, p.cid), g = c ? groupOfCard(c.id) : null;
  var ref = cycRef(p.cyc);
  var ts = g ? billTxns(g, ref) : [], tot = 0;
  for(i=0;i<ts.length;i++) tot += Number(ts[i].a) || 0;
  var who = c ? (bankLabel(c.code) || c.name) : '（已刪卡）';
  var h = '<h3>'+esc(who)+'　<span class="mut2" style="font-size:13px;font-weight:500">'
        + esc(cycLabel(p.cyc))+' 期</span></h3>'
    + '<div class="card" style="margin-top:12px"><div class="ln">'
    + '<span>已繳</span><span class="num" style="font-size:18px;font-weight:800;color:var(--mint)">-'
    + money(p.a)+'</span></div>'
    + '<div class="ln" style="margin-top:6px"><span class="mut2">繳款日</span>'
    + '<span class="num mut2">'+esc(p.d)+'</span></div>'
    + (p.n ? '<div class="ln" style="margin-top:6px"><span class="mut2">備註</span>'
             + '<span class="mut2">'+esc(p.n)+'</span></div>' : '')
    + (ts.length ? '<div class="ln" style="margin-top:6px"><span class="mut2">那一期明細 '
        + ts.length+' 筆合計</span><span class="num mut2">'+money(tot)+'</span></div>' : '')
    + (ts.length && Math.abs(tot - p.a) > 1
        ? '<div class="mut2" style="margin-top:8px;color:var(--amber)">差 '+money(p.a - tot)
          + '。可能是繳了分期或最低應繳，也可能這筆繳款是在結帳日改變之前記的 —— '
          + '真的不對就刪掉重記。</div>' : '')
    + '</div>';
  if(!g){
    h += '<div class="empty" style="margin-top:12px"><p>這張卡已經刪掉了，<br>找不到對應的帳單。</p></div>';

function fixCodes(){
  var fixed=0, guessed=0, still=[], i;
  for(i=0;i<S.cards.length;i++){
    var c=S.cards[i], before=String(c.code==null?'':c.code);
    var nc=normCode(c.code);
    if(!nc || !bankName(nc)){
      var g=guessBank(c.name);
      if(g){ c.code=g; guessed++; }
      else { c.code=nc; if(!nc) still.push(c.name); }
    }else{
      c.code=nc;
    }
    c.last4 = padz(c.last4, 4);
    if(String(c.code)!==before) fixed++;
    if(c.code) c.shr=true;
  }
  save(); render();
  var msg = fixed ? (fixed+' 張已修復'+(guessed?'（'+guessed+' 張依卡名判斷）':'')) : '沒有需要修復的代碼';
  if(still.length) msg += '，'+still.length+' 張仍需手動選機構';
  toast(msg);
}

function redetectAll(){
  var n=0, i, hits=[];
  for(i=0;i<S.cards.length;i++){
    var c=S.cards[i], d=detectCard(c.name), ch=[];
    if(d.net && c.net!==d.net){ c.net=d.net; ch.push(d.net); }
    if(d.tier!=='一般卡' && c.tier!==d.tier){ c.tier=d.tier; ch.push(d.tier); }
    if(d.tra!=='無' && c.tra!==d.tra){ c.tra=d.tra; ch.push(d.tra); }
    if(d.deb && !c.deb){ c.deb=true; ch.push('簽帳金融卡'); }
    if(ch.length){ n++; if(hits.length<3) hits.push(c.name+'→'+ch.join('/')); }

/* Apps Script 忙碌時會回 HTML 錯誤頁、逾時，或在轉址時弄丟 POST 內容，自動重試 */
function gasFetch(opt, cb, label, n){
  n = n || 1;
  var url = opt.url, init = opt.init || {}, tries = opt.tries || 5;
  fetch(url, init)
    .then(function(r){ return r.text(); })
    .then(function(txt){
      var t = String(txt||'').replace(/^\s+/,'');
      if(t.charAt(0)==='{'){
        var j;
        try{ j = JSON.parse(t); }catch(e){ j = null; }
        if(j && !(j.ok===false && j.err==='POST_LOST')){ cb(j); return; }
        if(j) throw new Error('請求內容在轉址時遺失');
      }
      throw new Error(t.charAt(0)==='<' ? 'Google 回了錯誤頁' : '非預期回應');
    })
    .catch(function(e){
      if(n < tries){
        if(!opt.quiet) toast(label+'重試中…（'+(n+1)+'/'+tries+'）');
        setTimeout(function(){ gasFetch(opt, cb, label, n+1); }, 2500*n*n);

/* POST 一律把密鑰也掛在網址上：轉址後 POST 內容會消失，網址上的密鑰還在 */
function gasPost(body, cb, label, quiet){
  var api = S.cfg.api;
  body.key = S.cfg.key;
  gasFetch({url: api + (api.indexOf('?')<0?'?':'&') + 'key=' + encodeURIComponent(S.cfg.key), init:{
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)

}
function gasGetUrl(action){
  return S.cfg.api + (S.cfg.api.indexOf('?')<0?'?':'&') + 'action=' + action + '&key=' + encodeURIComponent(S.cfg.key);
}
function pullCloud(){
  if(!S.cfg.api){ toast('請先填 Apps Script 網址'); return; }
  if(!confirm('從雲端下載會覆蓋這台裝置的資料，確定？')) return;
  toast('下載中…');
  gasFetch({url:S.cfg.api + (S.cfg.api.indexOf('?')<0?'?':'&') + 'action=pull&key=' + encodeURIComponent(S.cfg.key)},
   function(j){
      if(!j.ok){ toast('下載失敗：'+(j.err||'?')); return; }
      var keep={}, keepNB={}, i;
      for(i=0;i<S.cards.length;i++){
        if(S.cards[i].acct) keep[S.cards[i].id]=S.cards[i].acct;
        if(S.cards[i].nbId || S.cards[i].nbHint)
          keepNB[S.cards[i].id]={id:S.cards[i].nbId, hint:S.cards[i].nbHint};
      }
      S.cards=j.data.cards||[]; S.txns=j.data.txns||[]; S.pays=j.data.pays||[]; S.del=[];
      if(j.data.ovr) S.ovr=j.data.ovr;
      /* 分類規則：雲端為準，本機還沒同步的修改保留下來再送一次 */
      if(j.data.catRules) mergeRules(j.data.catRules);
      S.points = j.data.points || [];
      S.runs = j.data.runs || [];
      rulesChanged();
      for(i=0;i<S.cards.length;i++){
        if(!S.cards[i].acct && keep[S.cards[i].id]) S.cards[i].acct=keep[S.cards[i].id];
        var kn=keepNB[S.cards[i].id];
        if(kn){ if(!S.cards[i].nbId) S.cards[i].nbId=kn.id; if(!S.cards[i].nbHint) S.cards[i].nbHint=kn.hint; }
      }
      /* 雲端可能是舊格式、且試算表會吃掉前導零，下載後一定要重跑正規化 */
      migrate20();
      var gm=stripGmail();
      /* 以雲端為準重新開始同步（舊版後端沒有資料版本，就只下載） */
      S.sync = (j.rev === undefined) ? {rev:null, base:null, at:0} : {rev:j.rev, base:snapBase(), at:Date.now()};
      SYNC.mute = true; save(); SYNC.mute = false;
      go('ov');
      toast('已下載 '+S.cards.length+' 張卡 / '+S.txns.length+' 筆'+(gm?'（略過 '+gm+' 筆 Gmail 通知記帳）':''));
      flushRules();
   }, '下載');
}

/* ============ 自動同步（v3.19）============
   電腦與手機共用同一份雲端資料：
   · 有改動 → 2.5 秒後自動上傳，只送跟上次同步時不一樣的那幾筆（卡片只送改了的欄位）
   · 打開、切回畫面、每 5 分鐘 → 先問雲端的資料版本（很便宜），有變才下載
   · 上傳途中又改了東西 → 那些改動留著，下一輪再送
   · 第一次同步 → 以雲端為準，這台多出來的（新卡、手動記帳、繳款紀錄）補上傳
   刪除靠「上次同步時有、現在沒有」判斷，後端會留墓碑，別台送回舊資料也不會復活。 */
var SYNC = {busy:false, timer:null, again:false, mute:false, checked:-1e9, state:'', err:'', fails:0, warned:false};
var SENS_KEYS = ['acct', 'nbId', 'nbHint'];

function syncable(){ return !!(S.cfg.api && S.cfg.key); }
function syncOn(){ return syncable() && S.cfg.autoSync !== false; }
function nowMs(){ return (window.performance && performance.now) ? performance.now() : 0; }
/* 固定順序的 JSON：同樣的資料一定得到同樣的字串 */
function stableStr(v){
  if(v === null || v === undefined) return 'null';
  if(Object.prototype.toString.call(v) === '[object Array]'){
    var a = [], i;
    for(i=0;i<v.length;i++) a.push(stableStr(v[i]));

  if(typeof v === 'object'){
    var ks = [], k, o = [], j;
    for(k in v){ if(v.hasOwnProperty(k) && v[k] !== undefined) ks.push(k); }
    ks.sort();
    for(j=0;j<ks.length;j++) o.push(JSON.stringify(ks[j]) + ':' + stableStr(v[ks[j]]));
    return '{' + o.join(',') + '}';

}
function hstr(s){                        /* FNV-1a 32 位元雜湊 */
  var h = 0x811c9dc5, i;
  for(i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = (h + ((h<<1) + (h<<4) + (h<<7) + (h<<8) + (h<<24))) >>> 0; }

/* 「敏感欄位只留本機」時，這三欄不上傳，改了也不算改動 */
function cardForSync(c){
  var o = {}, k, i;
  for(k in c){ if(c.hasOwnProperty(k)) o[k] = c[k]; }
  if(S.cfg.acctLocal){ for(i=0;i<SENS_KEYS.length;i++) delete o[SENS_KEYS[i]]; }
  return o;
}
function snapBase(){
  var b = {c:{}, t:{}, p:{}, o:{}}, i, k, ov = S.ovr || {};
  for(i=0;i<S.cards.length;i++) b.c[S.cards[i].id] = stableStr(cardForSync(S.cards[i]));
  for(i=0;i<S.txns.length;i++) b.t[S.txns[i].id] = hstr(stableStr(S.txns[i]));
  for(i=0;i<S.pays.length;i++) b.p[S.pays[i].id] = hstr(stableStr(S.pays[i]));
  for(k in ov){ if(ov.hasOwnProperty(k)) b.o[k] = Number(ov[k]) || 0; }
  return b;
}
function diffList(list, base, outUp, outDel){
  var n = 0, seen = {}, i, k, r;
  for(i=0;i<list.length;i++){
    r = list[i]; seen[r.id] = 1;
    if(base[r.id] !== hstr(stableStr(r))){ outUp.push(r); n++; }
  }
  for(k in base){ if(base.hasOwnProperty(k) && !seen[k]){ outDel.push(k); n++; } }
  return n;
}
/* 跟上次同步時比，這台改了什麼 */
function syncDiff(){
  var B = S.sync.base, up = {cards:[], cardPatch:[], txns:[], pays:[], ovrSet:{}, ovrDel:[], del:[], n:0};
  var seen = {}, i, k, c, cs, bs, ov = S.ovr || {};
  for(i=0;i<S.cards.length;i++){
    c = cardForSync(S.cards[i]); cs = stableStr(c); seen[c.id] = 1; bs = B.c[c.id];
    if(bs === undefined){ up.cards.push(c); up.n++; continue; }
    if(bs === cs) continue;
    var old = JSON.parse(bs), set = {}, any = false;
    for(k in c){ if(c.hasOwnProperty(k) && stableStr(c[k]) !== stableStr(old[k])){ set[k] = c[k]; any = true; } }
    for(k in old){ if(old.hasOwnProperty(k) && !c.hasOwnProperty(k)){ set[k] = null; any = true; } }
    if(any){ up.cardPatch.push({id:c.id, set:set}); up.n++; }
  }
  for(k in B.c){ if(B.c.hasOwnProperty(k) && !seen[k]){ up.del.push(k); up.n++; } }
  up.n += diffList(S.txns, B.t, up.txns, up.del);
  up.n += diffList(S.pays, B.p, up.pays, up.del);
  for(k in ov){ if(ov.hasOwnProperty(k) && B.o[k] !== (Number(ov[k]) || 0)){ up.ovrSet[k] = Number(ov[k]) || 0; up.n++; } }
  for(k in B.o){ if(B.o.hasOwnProperty(k) && !ov.hasOwnProperty(k)){ up.ovrDel.push(k); up.n++; } }

function syncSoon(ms){
  if(!syncOn() || SYNC.state === 'old') return;       /* 後端太舊：只在按「立即同步」時再試 */
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(function(){ syncRun(false); }, ms == null ? 2500 : ms);
}
function syncRun(manual){
  if(!syncable()){ if(manual) toast('請先填 Apps Script 網址與密鑰'); return; }
  if(SYNC.busy){ SYNC.again = true; if(manual) toast('同步中…'); return; }
  if(!S.sync || !S.sync.base){ syncFirst(manual); return; }
  var up = syncDiff();
  if(!up.n && !manual){ syncCheck(); return; }
  syncSend(up, manual);
}
/* 沒有本機改動：只問雲端版本有沒有變（GET，不排隊、不讀試算表） */
function syncCheck(){
  SYNC.busy = true; SYNC.checked = nowMs();
  gasFetch({url:gasGetUrl('rev'), quiet:true, tries:2}, function(j){
    SYNC.busy = false;
    if(!j.ok){ syncFail(j.err, false); return; }
    if(j.rev === undefined){ syncOld(); return; }
    if(String(j.rev) === String(S.sync.rev)){ syncDone(false, 0, true); return; }
    syncSend(syncDiff(), false);
  }, '同步');
}
function syncSend(up, manual){
  SYNC.busy = true; SYNC.checked = nowMs(); syncMark('busy');
  var sent = snapBase();
  if(manual) toast('同步中…');
  gasPost({action:'sync', rev:S.sync.rev, up:{cards:up.cards, cardPatch:up.cardPatch, txns:up.txns,
           pays:up.pays, ovrSet:up.ovrSet, ovrDel:up.ovrDel, del:up.del}}, function(j){
    SYNC.busy = false;
    if(!j.ok){ syncFail(j.err, manual); return; }
    if(j.rev === undefined){ syncOld(); return; }
    if(j.data) syncAdopt(j.data, sent);
    else S.sync.base = sent;                    /* 雲端本來就跟這台一樣，送的也都照收 */
    S.sync.rev = j.rev; S.sync.at = Date.now();
    syncSave();
    syncDone(manual, up.n, false);
    if(j.data) syncRender();
    if(SYNC.again || syncDiff().n){ SYNC.again = false; syncSoon(600); }
  }, '同步', !manual);
}
/* 第一次同步：以雲端為準，這台多出來的補上傳 */
function syncFirst(manual){
  SYNC.busy = true; SYNC.checked = nowMs(); syncMark('busy');
  gasFetch({url:gasGetUrl('pull'), quiet:!manual, tries:(manual ? 5 : 3)}, function(j){
    SYNC.busy = false;
    if(!j.ok){ syncFail(j.err, manual); return; }
    if(j.rev === undefined){ syncOld(); return; }
    var D = j.data || {}, keep = sensKeep(), ex = firstExtras(D), k, i, o = {}, so = D.ovr || {};
    S.cards = (D.cards || []).concat(ex.cards);
    S.txns = (D.txns || []).concat(ex.txns);
    S.pays = (D.pays || []).concat(ex.pays);
    for(k in so){ if(so.hasOwnProperty(k)) o[k] = so[k]; }
    for(k in ex.ovr){ if(ex.ovr.hasOwnProperty(k)) o[k] = ex.ovr[k]; }
    S.ovr = o;
    if(D.catRules) mergeRules(D.catRules);
    S.points = D.points || []; S.runs = D.runs || [];
    sensRestore(keep); migrate20(); stripGmail();
    var b = snapBase();
    for(i=0;i<ex.cards.length;i++) delete b.c[ex.cards[i].id];
    for(i=0;i<ex.txns.length;i++) delete b.t[ex.txns[i].id];
    for(i=0;i<ex.pays.length;i++) delete b.p[ex.pays[i].id];
    for(k in ex.ovr){ if(ex.ovr.hasOwnProperty(k)) delete b.o[k]; }
    S.sync = {rev:j.rev, base:b, at:Date.now()};
    syncSave();
    syncDone(false, 0, false);
    syncRender();
    if(ex.n){ toast('已開始自動同步，這台多出的 '+ex.n+' 筆會補上傳'); syncSoon(400); }

    flushRules();
  }, '同步');
}
function idSet(list){ var m = {}, i; for(i=0;i<(list||[]).length;i++) m[list[i].id] = 1; return m; }
/* 雲端沒有、這台有的：新卡、手動記帳、繳款紀錄。
   帳單匯入的明細與帳單金額以雲端為準（重灌過的話，這台的舊資料送回去反而會錯）。 */
function firstExtras(D){
  var ex = {cards:[], txns:[], pays:[], ovr:{}, n:0}, ids, i;
  ids = idSet(D.cards); for(i=0;i<S.cards.length;i++) if(!ids[S.cards[i].id]){ ex.cards.push(S.cards[i]); ex.n++; }
  ids = idSet(D.txns);  for(i=0;i<S.txns.length;i++) if(!ids[S.txns[i].id] && !S.txns[i].src){ ex.txns.push(S.txns[i]); ex.n++; }
  ids = idSet(D.pays);  for(i=0;i<S.pays.length;i++) if(!ids[S.pays[i].id]){ ex.pays.push(S.pays[i]); ex.n++; }
  return ex;
}
function sensKeep(){
  var m = {}, i, c;
  for(i=0;i<S.cards.length;i++){ c = S.cards[i]; m[c.id] = {acct:c.acct, nbId:c.nbId, nbHint:c.nbHint}; }
  return m;
}
function sensRestore(m){
  if(!S.cfg.acctLocal) return;
  var i, j, c, k, f;
  for(i=0;i<S.cards.length;i++){
    c = S.cards[i]; k = m[c.id];
    if(!k) continue;
    for(j=0;j<SENS_KEYS.length;j++){ f = SENS_KEYS[j]; if(!c[f] && k[f]) c[f] = k[f]; }
  }
}
/* 雲端有新資料：換成雲端的，但送出之後才在這台改的、刪的、新增的留著 */
function adoptList(local, server, curMap, sentMap){
  var out = [], seen = {}, byId = {}, i, r, id;
  for(i=0;i<local.length;i++) byId[local[i].id] = local[i];
  for(i=0;i<server.length;i++){
    r = server[i]; id = r.id; seen[id] = 1;
    if(curMap[id] === undefined && sentMap[id] !== undefined) continue;                 /* 送出後刪了 */
    if(curMap[id] !== undefined && curMap[id] !== sentMap[id] && byId[id]){ out.push(byId[id]); continue; }  /* 送出後又改了 */
    out.push(r);
  }
  for(i=0;i<local.length;i++){
    r = local[i];
    if(!seen[r.id] && curMap[r.id] !== undefined && sentMap[r.id] === undefined) out.push(r);   /* 送出後才新增 */
  }
  return out;
}
/* 卡片：送出後又改了的，以雲端那張為底、只疊上送出後改的欄位（別台改的其他欄位不會被蓋回去）。
   inflight 記下每張卡送出後改了哪些欄位、雲端那時的值，用來算下一輪的基準。 */
function adoptCards(local, server, curMap, sentMap, inflight){
  var out = [], seen = {}, byId = {}, i, r, id, k, lc, sc, m, ch;
  for(i=0;i<local.length;i++) byId[local[i].id] = local[i];
  for(i=0;i<server.length;i++){
    r = server[i]; id = r.id; seen[id] = 1;
    if(curMap[id] === undefined && sentMap[id] !== undefined) continue;                 /* 送出後刪了 */
    if(curMap[id] !== undefined && sentMap[id] !== undefined && curMap[id] !== sentMap[id] && byId[id]){
      lc = byId[id]; sc = JSON.parse(sentMap[id]); m = {}; ch = {};
      for(k in r){ if(r.hasOwnProperty(k)) m[k] = r[k]; }
      for(k in lc){
        if(!lc.hasOwnProperty(k) || (S.cfg.acctLocal && SENS_KEYS.indexOf(k) >= 0)) continue;
        if(stableStr(lc[k]) !== stableStr(sc[k])){ ch[k] = r.hasOwnProperty(k) ? r[k] : undefined; m[k] = lc[k]; }
      }
      for(k in sc){ if(sc.hasOwnProperty(k) && !lc.hasOwnProperty(k)){ ch[k] = r[k]; delete m[k]; } }
      inflight[id] = ch;
      out.push(m);
      continue;
    }
    out.push(r);
  }
  for(i=0;i<local.length;i++){
    r = local[i];
    if(!seen[r.id] && curMap[r.id] !== undefined && sentMap[r.id] === undefined) out.push(r);   /* 送出後才新增 */

function markDirty(base, curMap, sentMap, mark){
  var k;

    if(sentMap[k] === undefined) delete base[k];               /* 送出後才新增：下一輪當新的送 */
    else if(curMap[k] !== sentMap[k]) base[k] = mark;           /* 送出後又改了：下一輪一定會送 */
  }
  for(k in sentMap){ if(sentMap.hasOwnProperty(k) && curMap[k] === undefined) base[k] = mark; }   /* 送出後刪了 */

function syncAdopt(D, sent){
  var cur = snapBase(), keep = sensKeep(), k, o = {}, so = D.ovr || {}, lo = S.ovr || {}, inflight = {}, id, bo, ch;
  S.cards = adoptCards(S.cards, D.cards || [], cur.c, sent.c, inflight);
  S.txns  = adoptList(S.txns,  D.txns  || [], cur.t, sent.t);
  S.pays  = adoptList(S.pays,  D.pays  || [], cur.p, sent.p);
  for(k in so){ if(so.hasOwnProperty(k)) o[k] = so[k]; }
  for(k in cur.o){ if(cur.o.hasOwnProperty(k) && cur.o[k] !== sent.o[k]) o[k] = lo[k]; }
  for(k in sent.o){ if(sent.o.hasOwnProperty(k) && cur.o[k] === undefined) delete o[k]; }
  S.ovr = o;
  if(D.catRules) mergeRules(D.catRules);
  S.points = D.points || []; S.runs = D.runs || [];
  sensRestore(keep); migrate20(); stripGmail();
  var b = snapBase();
  for(k in cur.c){ if(cur.c.hasOwnProperty(k) && sent.c[k] === undefined) delete b.c[k]; }      /* 送出後才新增的卡 */
  for(k in sent.c){ if(sent.c.hasOwnProperty(k) && cur.c[k] === undefined) b.c[k] = '{}'; }     /* 送出後刪的卡 */
  for(id in inflight){                                          /* 送出後改的欄位：基準放雲端的值，下一輪只送這幾欄 */
    if(!inflight.hasOwnProperty(id) || b.c[id] === undefined) continue;
    bo = JSON.parse(b.c[id]); ch = inflight[id];
    for(k in ch){ if(ch.hasOwnProperty(k)){ if(ch[k] === undefined) delete bo[k]; else bo[k] = ch[k]; } }
    b.c[id] = stableStr(bo);
  }
  markDirty(b.t, cur.t, sent.t, '!');
  markDirty(b.p, cur.p, sent.p, '!');
  for(k in cur.o){ if(cur.o.hasOwnProperty(k) && cur.o[k] !== sent.o[k]){ if(sent.o[k] === undefined) delete b.o[k]; else b.o[k] = '!'; } }
  for(k in sent.o){ if(sent.o.hasOwnProperty(k) && cur.o[k] === undefined) b.o[k] = '!'; }
  S.sync.base = b;
}
function syncSave(){ SYNC.mute = true; save(); SYNC.mute = false; }
/* 雲端資料換進來之後重畫；正在輸入的時候先不重畫，免得打斷 */
function syncRender(){

function syncFail(err, manual){

function syncOld(){

}
function syncDone(manual, n, quietCheck){

function syncMark(state, err){

function syncBadge(){

}
function agoText(t){

function syncStatusHTML(){

  if(S.cfg.autoSync === false) return '自動同步已關閉，要同步請按「立即同步」。';
  if(SYNC.state === 'old') return '<span style="color:var(--rose)">後端是舊版：把新的 Code.gs 貼上並「部署 → 管理部署 → 新版本」，才會自動同步。</span>';
  if(SYNC.state === 'busy') return '同步中…';
  if(SYNC.state === 'err') return '<span style="color:var(--brass)">還沒同步成功：' + esc(SYNC.err) + '（會自動重試）</span>';
  return (S.sync && S.sync.at) ? ('已同步 · ' + agoText(S.sync.at)) : '等待第一次同步…';
}
function syncInit(){
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){ if(nowMs() - SYNC.checked > 15000) syncSoon(200); }
    else if(syncOn() && S.sync && S.sync.base && syncDiff().n) syncRun(false);    /* 切走前把改動送出去 */
  });
  window.addEventListener('online', function(){ syncSoon(300); });
  window.addEventListener('pageshow', function(e){ if(e && e.persisted) syncSoon(200); });
  setInterval(function(){ if(document.visibilityState !== 'hidden') syncSoon(0); }, 300000);
  syncSoon(700);
}

/* ============ 啟動 ============ */
load();
go('ov');
watchBreakpoint();
syncInit();
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script>
