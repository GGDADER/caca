<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0f1319; --slab:#161c26; --slab2:#1d2531; --line:#2a3444; --line2:#222b38;
  --brass:#d4a24c; --brassd:#7d6030; --mint:#4fd1a5; --rose:#f2607a; --amber:#f0b429;
  --txt:#e8eef7; --dim:#8c9bb1; --dim2:#67758b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei UI","Microsoft JhengHei",sans-serif;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --hdh:52px; --side:220px; --wmax:1320px;
}
html,body{margin:0;padding:0;background:var(--ink);color:var(--txt);font-family:var(--sans);
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{font-size:14px;line-height:1.4;padding-top:calc(var(--hdh) + var(--st));padding-bottom:calc(66px + var(--sb))}
/* 中文不加字距；數字用等寬數字對齊，不換字型 */
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--txt);line-height:1.3}
button{border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
a{color:var(--brass)}

/* ---- 頁首 ---- */
#hd{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(15,19,25,.92);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding-top:var(--st)}
#hd .row{height:var(--hdh);display:flex;align-items:center;gap:10px;padding:0 14px}
#hd .brand{display:flex;align-items:baseline;gap:9px;min-width:0}
#hd .ttl{font-size:18px;font-weight:800}
#hd .sub{font-size:12px;color:var(--dim2);white-space:nowrap}
#hd .hin{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#hd .pg{display:none;font-size:19px;font-weight:700}
#hd .sp{flex:1}
.ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--slab);border:1px solid var(--line);font-size:15px;color:var(--dim);flex:none}
.ico.on{color:var(--brass);border-color:var(--brassd)}
.ico.big{width:44px;height:44px;font-size:19px}

/* ---- 分頁列（手機在底部，電腦在左側） ---- */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:rgba(15,19,25,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--sb)}
#tabs button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim2);font-size:11px}
#tabs button .g{font-size:19px;line-height:1}
#tabs button.on{color:var(--brass)}

/* ---- 版面 ---- */
main{padding:14px}
.sec+.sec{margin-top:22px}
.sec>.eyebrow:first-child{margin-top:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--dim);margin:22px 0 9px;display:flex;align-items:center;gap:10px}
.eyebrow:first-child{margin-top:2px}
.eyebrow:after{content:"";flex:1;height:1px;background:var(--line2)}
.eyebrow .ct{font-weight:400;color:var(--dim2);font-size:12px;margin-left:-2px}
.card{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:14px}
.card+.card{margin-top:10px}
.card.tcard{padding:4px 13px 8px}
.card.txl{padding:2px 13px}
.mut{color:var(--dim);font-size:13px}
.mut2{color:var(--dim2);font-size:12px}
.mut2.note{margin-top:10px;line-height:1.7}

/* ---- hero ---- */
.hero{background:var(--slab);border:1px solid var(--line);border-radius:16px;padding:16px 15px 14px}
.hero .lab{font-size:13px;color:var(--dim)}
.hero .big{font-size:40px;font-weight:800;line-height:1.05;margin:6px 0 2px;color:var(--mint)}
.hero .big small{font-size:15px;color:var(--dim);font-weight:600;margin-right:5px}
.band{display:flex;height:16px;border-radius:5px;overflow:hidden;background:#111722;margin:14px 0 8px;
  border:1px solid var(--line)}
.band i{display:block;height:100%;border-right:1px solid rgba(15,19,25,.85)}

  for(i=0;i<ur.length;i++){ if(u.indexOf(ur[i].u)>=0){ res=[ur[i].cat,'u',ur[i].kw]; break; } }
  if(!res[1]){
    for(i=0;i<CAT_RULES.length;i++){ if(CAT_RULES[i][1].test(u)){ res=[CAT_RULES[i][0],'a','']; break; } }
  }
  _catMemo[key]=res;
  return res;
}
/* 這筆的分類是不是自動判斷的（帳單匯入等自動來源、且沒有指定明確分類） */
function isAutoCat(t){
  var c=t.c||'';
  if(!t.src && c && catValid(c)) return false;          /* 手動記的帳：尊重當時選的分類 */
  if(c && c!=='他' && catValid(c)) return false;        /* 來源已給明確分類 */
  return true;
}
function txCat(t){
  return isAutoCat(t) ? catInfo(t.m, t.kind)[0] : t.c;
}
/* 從商店名取出「品牌」部分，當作規則關鍵字的預設值 */
function baseMerchant(m){
  var s=String(m==null?'':m).replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');
  s=s.split(/\s*[－—–]\s*|\s+-\s+/)[0];                 /* 全形破折號後面是分店名（要在轉半形之前切） */
  s=halfw(s).replace(/^[A-Z]{1,3}-\s+/,'');              /* 永豐的 MA- / A- 前綴 */
  s=s.replace(/\s*[（(][^）)]*[）)]\s*$/,'');
  s=s.replace(/[\s\d#*\-]+$/,'');                          /* 結尾的店號 */
  return cleanKw(s).slice(0,20);
}
function ruleHits(kw){
  var u=normMer(cleanKw(kw)), n=0, i;
  if(!u) return 0;
  for(i=0;i<S.txns.length;i++){
    var t=S.txns[i];
    if(!isAutoCat(t) || isNoShop(t.m) || t.kind==='回饋') continue;
    if(normMer(t.m).indexOf(u)>=0) n++;
  }
  return n;
}
/* 新增／修改／刪除（cat 空字串）一條規則。p=1 代表還沒同步到雲端。 */
function setRule(kw, cat){
  kw=cleanKw(kw);
  if(!kw) return false;
  if(!S.catRules) S.catRules=[];
  var rs=S.catRules, i, hit=false;
  for(i=0;i<rs.length;i++){
    if(rs[i].kw===kw){ rs[i].cat=cat; rs[i].p=1; hit=true; break; }
  }
  if(!hit) rs.push({kw:kw, cat:cat, p:1});
  rulesChanged();
  save();
  flushRules();
  return true;
}
/* 雲端清單為準，再疊上本機還沒同步的修改 */
function mergeRules(cloud){
  var out=[], idx={}, i, r, kw, cat;
  for(i=0;i<(cloud||[]).length;i++){
    r=cloud[i]||{}; kw=cleanKw(r.kw); cat=String(r.cat==null?'':r.cat);
    if(!kw || !catValid(cat) || idx.hasOwnProperty(kw)) continue;
    idx[kw]=out.length; out.push({kw:kw, cat:cat, p:0});
  }
  var loc=S.catRules||[];
  for(i=0;i<loc.length;i++){
    r=loc[i];
    if(!r || !r.p || !r.kw) continue;
    if(idx.hasOwnProperty(r.kw)) out[idx[r.kw]]={kw:r.kw, cat:r.cat||'', p:1};
    else { idx[r.kw]=out.length; out.push({kw:r.kw, cat:r.cat||'', p:1}); }
  }
  S.catRules=out;
  rulesChanged();
}
var _flushing = false;
function flushRules(manual){
  if(!S.cfg.api){ if(manual) toast('請先填 Apps Script 網址'); return; }
  if(_flushing) return;
  var rs=S.catRules||[], ops=[], i;
  for(i=0;i<rs.length;i++) if(rs[i].p) ops.push({kw:rs[i].kw, cat:rs[i].cat||''});
  if(!ops.length){ if(manual) toast('分類規則都已同步'); return; }
  _flushing = true;
  gasPost({action:'catRules', ops:ops}, function(j){
    _flushing = false;
    if(!j.ok){
      toast('分類規則還沒同步到雲端：'
        + (j.err==='不認得的 action' ? 'Code.gs 要更新並部署新版本' : (j.err||'?')));
      return;
    }
    var sent={}, k, loc=S.catRules||[];
    for(k=0;k<ops.length;k++) sent[ops[k].kw]=ops[k].cat;
    for(k=0;k<loc.length;k++){
      if(loc[k].p && sent.hasOwnProperty(loc[k].kw) && sent[loc[k].kw]===(loc[k].cat||'')) loc[k].p=0;
    }
    mergeRules(j.rules||[]);
    save();
    refreshCats();
    if(manual) toast('分類規則已同步');
  }, '同步規則');
}

/* 試算表會把 013 存成數字 13、0406 存成 406。回填前導零才對得回來。 */
function padz(v, len){
  var d=String(v==null?'':v).replace(/\D/g,'');
  if(!d) return '';
  while(d.length<len) d='0'+d;
  return d.length>len ? d.slice(-len) : d;
}
function normCode(v){

/* ============ 週期計算 ============ */
function lastClose(c, ref){
  ref = ref || today();
  var x = mk(ref.getFullYear(), ref.getMonth(), c.close);
  if(x > ref) x = mk(ref.getFullYear(), ref.getMonth()-1, c.close);
  return x;
}
function nextClose(c, ref){
  var l = lastClose(c, ref);
  return mk(l.getFullYear(), l.getMonth()+1, c.close);
}
function prevClose(c, ref){
  var l = lastClose(c, ref);
  return mk(l.getFullYear(), l.getMonth()-1, c.close);
}
function dueOf(c, closeDate){
  var off = c.dueNext ? 1 : 0;
  return mk(closeDate.getFullYear(), closeDate.getMonth()+off, c.due);
}
/* 交易區間 (from, to] */
function sumRange(cid, from, to){
  var s=0;
  for(var i=0;i<S.txns.length;i++){
    var t=S.txns[i];
    if(t.cid!==cid) continue;
    var d=pd(t.d);
    if(d>from && d<=to) s += Number(t.a)||0;
  }
  return s;
}
/* 本期已結帳待繳（上上次結帳 → 上次結帳）。有帳單實際金額時以帳單為準。 */
function ovrKey(c){ return c.id+'|'+cycKey(c); }
function stmtAmount(c){
  if(S.ovr && S.ovr[ovrKey(c)] !== undefined) return Number(S.ovr[ovrKey(c)])||0;
  return sumRange(c.id, prevClose(c), lastClose(c));
}
function stmtEst(c){ return sumRange(c.id, prevClose(c), lastClose(c)); }
function hasOvr(c){ return !!(S.ovr && S.ovr[ovrKey(c)] !== undefined); }
/* 未出帳（上次結帳 → 今天） */
function unbilled(c){ return sumRange(c.id, lastClose(c), today()); }

function cycKey(c){ return ds(lastClose(c)); }
function isPaid(c){
  var k = cycKey(c);
  for(var i=0;i<S.pays.length;i++){ if(S.pays[i].cid===c.id && S.pays[i].cyc===k) return S.pays[i]; }
  return null;
}

/* ============ 額度 ============ */
function usedOf(c){
  var base = Number(c.base)||0;
  var bd = c.baseDate ? pd(c.baseDate) : null;
  var u = base, i, t;
  for(i=0;i<S.txns.length;i++){
    t=S.txns[i];
    if(t.cid!==c.id) continue;
    if(!bd || pd(t.d) > bd) u += Number(t.a)||0;
  }
  for(i=0;i<S.pays.length;i++){
    t=S.pays[i];
    if(t.cid!==c.id) continue;
    if(!bd || pd(t.d) > bd) u -= Number(t.a)||0;
  }
  return u;
}
function activeCards(){
  var a=[]; for(var i=0;i<S.cards.length;i++){ if(!S.cards[i].off) a.push(S.cards[i]); } return a;
}
function totals(){
  var bk=byBank(), L=0, U=0, i;
  for(i=0;i<bk.length;i++){ L+=bk[i].limit; U+=bk[i].used; }
  return {limit:L, used:U, avail:L-U, pct: L>0 ? U/L*100 : 0};
}
/* 額度光譜的分段：共用池算一段，獨立卡各自一段 */
function pools(){
  var cs=activeCards(), out=[], seen={}, i;
  for(i=0;i<cs.length;i++){
    var c=cs[i];
    if(c.code){
      var k='s:'+c.code; if(seen[k]) continue; seen[k]=1;
      var P=poolOf(c);
      out.push({limit:P.limit, used:P.used, name:(bankName(c.code)||c.code), color:c.color});
    }else{
      out.push({limit:Number(c.limit)||0, used:usedOf(c), name:c.name, color:c.color});
    }
  }
  return out;
}
function pctColor(p){
  if(p>=90) return 'var(--rose)';
  if(p>=Number(S.cfg.warnPct||80)) return 'var(--amber)';
  return 'var(--mint)';
}

/* ============ 繳費群組 ============ */
/**
 * 同一家銀行是一張合併帳單：一個應繳金額、一個截止日、繳一次。
 * 群組鍵包含結帳/繳款日，萬一同行真的有兩種週期才會拆開。
 * 沒有機構代碼的卡各自獨立成一組。
 */
function billGroups(){
  var cs=activeCards(), map={}, order=[], i, j;
  for(i=0;i<cs.length;i++){
    var c=cs[i], code=normCode(c.code);
    var k = code ? ('B'+code+'|'+c.close+'|'+c.due+'|'+(c.dueNext?1:0)) : ('C'+c.id);
    if(!map[k]){
      map[k]={key:k, code:code, label: code ? bankLabel(code) : (c.name||'未命名'),
              cards:[], primary:c};
      order.push(k);
    }
    map[k].cards.push(c);
  }
  var out=[], t=today();
  for(i=0;i<order.length;i++){
    var g=map[order[i]], p=g.primary;
    g.lc  = lastClose(p);
    g.nc  = nextClose(p);
    g.dueDate = dueOf(p, g.lc);
    g.cyc = ds(g.lc);
    g.dd  = dayDiff(t, g.dueDate);
    g.est = 0; g.unbilled = 0;
    for(j=0;j<g.cards.length;j++){
      g.est      += stmtAmount(g.cards[j]);
      g.unbilled += unbilled(g.cards[j]);
    }
    g.amt  = hasOvrG(g) ? Number(S.ovr[ovrKeyG(g)])||0 : g.est;
    g.paid = paidOfG(g);
    g.auto = true;
    for(j=0;j<g.cards.length;j++) if(!g.cards[j].auto) g.auto=false;
    /* 銷帳編號取該行第一張有填的卡 */
    g.acct = ''; g.acctCard = p;
    for(j=0;j<g.cards.length;j++){ if(g.cards[j].acct){ g.acct=g.cards[j].acct; g.acctCard=g.cards[j]; break; } }
    out.push(g);
  }
  out.sort(function(a,b){ if(a.paid&&!b.paid) return 1; if(!a.paid&&b.paid) return -1; return a.dd-b.dd; });
  return out;
}
function gByKey(k){
  var gs=billGroups(), i;
  for(i=0;i<gs.length;i++) if(gs[i].key===k) return gs[i];
  return null;
}
function ovrKeyG(g){ return g.key+'@'+g.cyc; }
function hasOvrG(g){ return !!(S.ovr && S.ovr[ovrKeyG(g)] !== undefined); }
function paidOfG(g){
  var i,j;
  for(i=0;i<S.pays.length;i++){
    var p=S.pays[i];
    if(String(p.cyc)!==g.cyc) continue;
    for(j=0;j<g.cards.length;j++) if(g.cards[j].id===p.cid) return p;
  }
  return null;
}

/* B：各區塊 HTML；mob：手機的排列順序；cols：電腦各欄的區塊；top：電腦版放在分欄上方、佔滿寬度的區塊 */
function lay(B, mob, cols, cls, top){
  var h='', i, j;
  if(!isWide()){
    for(i=0;i<mob.length;i++) h += B[mob[i]]||'';
    return h;
  }
  top = top || [];
  for(i=0;i<top.length;i++) h += B[top[i]]||'';
  var used=[];
  for(i=0;i<cols.length;i++){
    var part='';
    for(j=0;j<cols[i].length;j++) part += B[cols[i][j]]||'';
    if(part) used.push(part);
  }
  if(used.length<2) return h + (used[0] ? '<div class="cols c1"><div class="col">'+used[0]+'</div></div>' : '');
  h += '<div class="cols '+(cls||'c66')+'">';
  for(i=0;i<used.length;i++) h += '<div class="col">'+used[i]+'</div>';
  return h + '</div>';
}

  /* 依銀行彙總 */

  if(bk.length){
    h = '<div class="card tcard"><table class="tbl"><tr><th>機構</th><th class="r">卡</th>'

  }

  /* 即將到期 */

  }else{
    h = '<div class="bgrid">';
    for(i=0;i<ups.length && i<6;i++) h += billCard(ups[i], true);
    h += '</div>';
  }
  B.up = sec('即將到期<span class="ct">同一家銀行合併成一張</span>', h);

  /* 本月分類 */
  var cat = monthByCat();
  if(cat.length){
    h = '<div class="card">';
    var top = cat[0].v || 1;
    for(i=0;i<cat.length && i<6;i++){
      var it = cat[i], co = catOf(it.k);

        +  '<span class="cb"><span class="gauge"><i style="width:'+Math.max(0,Math.min(100,it.v/top*100)).toFixed(1)+'%;background:var(--brassd)"></i></span></span>'
        +  '<span class="cv num">'+money(it.v)+'</span></div>';
    }
    B.cat = sec('本月分類', h + '</div>');
  }

  /* 調額提醒 */
  var adj = adjSoon();
  if(adj.length){
    h = '';
    for(i=0;i<adj.length;i++){
      var a=adj[i], dd=dayDiff(today(), pd(a.adjNext));
      h += '<div class="card" style="display:flex;align-items:center;gap:10px">'
        + '<div><div style="font-size:14px;font-weight:700">'+esc(a.name)+'</div>'
        + '<div class="mut2">目前額度 '+wan(a.limit)+(a.adjDate?' · 上次申請 '+esc(a.adjDate):'')+'</div></div><div style="flex:1"></div>'
        + '<span class="pill '+(dd<=0?'c':'d')+'">'+(dd<=0?'現在可申請':dd+' 天後')+'</span></div>';
    }
    B.adj = sec('可申請調額', h);
  }
  return lay(B, ['hero','bank','up','cat','adj'], [['hero','up','cat'],['bank','adj']], 'c75');
}

  return '<div class="empty"><div class="g">▤</div>'

    + '<button class="btn" style="max-width:240px;margin:22px auto 0" onclick="editCard(\'\')">新增第一張卡</button></div>';
}
function monthSpend(off){
  var t=today(), y=t.getFullYear(), m=t.getMonth()+off, s=0;
  var a=new Date(y,m,1), b=new Date(y,m+1,0,23,59,59);
  for(var i=0;i<S.txns.length;i++){ var d=pd(S.txns[i].d); if(d>=a && d<=b) s += Number(S.txns[i].a)||0; }
  return s;
}
function monthByCat(){
  var t=today(), a=new Date(t.getFullYear(),t.getMonth(),1), b=new Date(t.getFullYear(),t.getMonth()+1,0,23,59,59);
  var map={}, i;
  for(i=0;i<S.txns.length;i++){
    var x=S.txns[i], d=pd(x.d);
    if(d<a||d>b) continue;
    var k=txCat(x); map[k]=(map[k]||0)+(Number(x.a)||0);
  }
  var arr=[]; for(var k2 in map){ if(map.hasOwnProperty(k2)) arr.push({k:k2, v:map[k2]}); }
  arr.sort(function(p,q){ return q.v-p.v; });
  return arr;
}
function upcoming(days){
  var gs=billGroups(), out=[], i;
  for(i=0;i<gs.length;i++){
    var g=gs[i];
    if(g.dd > days) continue;
    /* 帳單已經出來、金額是 0（這期沒消費或已全額折抵）就沒東西要繳，不必提醒 */
    if(!g.amt && hasOvrG(g)) continue;
    if(g.paid && g.dd < 0) continue;
    if(!g.amt && !g.paid && g.dd < 0) continue;
    out.push(g);
  }
  return out;
}
function adjSoon(){
  var cs=activeCards(), out=[], t=today();
  for(var i=0;i<cs.length;i++){
    var c=cs[i];
    if(!c.adjNext) continue;
    var dd=dayDiff(t, pd(c.adjNext));
    if(dd<=30) out.push(c);
  }
  return out;
}

      /* 與總覽同一套規則：同行取最大值，未設機構的卡各自獨立 */

/* 一次算好篩選要用的資料，三個區塊共用 */
function recsData(){
  var all = S.txns.slice(0).sort(function(a,b){ return a.d<b.d?1:(a.d>b.d?-1:(a.id<b.id?1:-1)); });
  var D = {all:all, bAll:{}, order:[], mset:{}, months:[], allMonths:[], list:[], bank:{}, txt:{}};
  if(!all.length) return D;
  var CM={}, i, t, mk, bk, c, mall={};
  for(i=0;i<S.cards.length;i++){
    c=S.cards[i]; CM[c.id]=c;
    bk=normCode(c.code)||'—';
    if(!D.txt.hasOwnProperty(bk)) D.txt[bk]=((bk==='—'?'未設定機構':bankLabel(bk))+' '+bk).toUpperCase();
    D.txt[bk] += ' ' + String(c.name||'').toUpperCase() + ' ' + String(c.last4||'');
  }
  for(i=0;i<all.length;i++){
    t=all[i]; c=CM[t.cid];
    bk = c ? (normCode(c.code)||'—') : '—';
    D.bank[t.id]=bk;
    if(!D.bAll.hasOwnProperty(bk)){
      D.bAll[bk]=0; D.order.push(bk);
      if(!D.txt.hasOwnProperty(bk)) D.txt[bk]=((bk==='—'?'未設定機構':bankLabel(bk))+' '+bk).toUpperCase();
    }
    D.bAll[bk]++;
    mk = txMonth(t);
    if(mk) mall[mk]=1;
  }
  if(LOG.b && !D.bAll.hasOwnProperty(LOG.b)) LOG.b='';
  D.order.sort(function(a,b){ return D.bAll[b]-D.bAll[a]; });
  /* 搜尋字串：比對銀行名稱、代碼與該行卡片名稱 */
  var q = String(LOG.q||'').toUpperCase().replace(/^\s+|\s+$/g,''), hit={}, any=false;
  for(bk in D.bAll){
    if(!D.bAll.hasOwnProperty(bk)) continue;
    hit[bk] = !q || String(D.txt[bk]||'').indexOf(q)>=0;
    if(hit[bk]) any=true;
  }
  if(!any){ for(bk in hit){ if(hit.hasOwnProperty(bk)) hit[bk]=true; } D.noHit=true; }
  D.hit = hit;
  var inBank = function(b){ return LOG.b ? (b===LOG.b) : hit[b]; };
  var mlist=[];
  for(var k in mall){ if(mall.hasOwnProperty(k)) mlist.push(k); }
  mlist.sort(); mlist.reverse();
  D.allMonths = mlist;
  if(LOG.m==='*'){
    if(!LOG.f || !LOG.t){
      LOG.t = mlist[0]||''; LOG.f = mlist[Math.min(2, mlist.length-1)]||LOG.t;
    }
    if(LOG.f > LOG.t){ var sw=LOG.f; LOG.f=LOG.t; LOG.t=sw; }
  }
  D.bCnt={};
  for(i=0;i<all.length;i++){
    t=all[i]; bk=D.bank[t.id]; mk=txMonth(t);
    if(mk && inBank(bk)) D.mset[mk]=(D.mset[mk]||0)+1;
    if(inPeriod(mk)) D.bCnt[bk]=(D.bCnt[bk]||0)+1;
    if(inBank(bk) && inPeriod(mk)) D.list.push(t);
  }
  if(LOG.m && LOG.m!=='*' && !D.mset.hasOwnProperty(LOG.m)) D.mset[LOG.m]=0;
  for(var k2 in D.mset){ if(D.mset.hasOwnProperty(k2)) D.months.push(k2); }
  D.months.sort(); D.months.reverse();
  return D;
}
function inPeriod(mk){
  if(!LOG.m) return true;
  if(LOG.m==='*') return !!mk && mk>=LOG.f && mk<=LOG.t;
  return mk===LOG.m;
}
function perHTML(D){
  var h='<div class="chips scroll">'
    + '<button class="chip'+(LOG.m===''?' on':'')+'" onclick="setLog(\'m\',\'\')">最近</button>'
    + '<button class="chip'+(LOG.m==='*'?' on':'')+'" onclick="setLog(\'m\',\'*\')">自訂期間</button>', i;
  for(i=0;i<D.months.length;i++){
    h += '<button class="chip'+(LOG.m===D.months[i]?' on':'')+(D.mset[D.months[i]]?'':' zero')+'" onclick="setLog(\'m\',\''+D.months[i]+'\')">'
      +  D.months[i].replace('-','/')+'<span class="n">'+D.mset[D.months[i]]+'</span></button>';
  }
  h += '</div>';
  if(LOG.m==='*'){

/* ============ 視圖：分析 ============ */
var ANV = {y:0, m:-1, byCyc:false};   /* 分析頁：m=-1 看整年；byCyc=依帳單期 */
/* 記帳頁的紀錄篩選：m=月份（空＝最近、'*'＝自訂期間 f～t）、b=銀行代碼（空＝全部）、
   by=d 依消費日／cyc 依帳單期、q=銀行搜尋字串 */
var LOG = {m:'', b:'', by:'d', f:'', t:'', q:''};

/* 這筆屬於哪一期：依帳單期（銀行結帳週期）或依消費日 */
function txKey(t){
  /* 依帳單期時只認「從電子帳單匯入」的資料。手動記的帳沒有帳單期，
     以前會退回用消費日，結果混進帳單期的桶子裡，金額就比帳單多。 */
  if(ANV.byCyc) return String(t.cyc||'').slice(0,7);
  return String(t.d||'').slice(0,7);
}
function txAgg(ym1, ym2){
  var out={total:0, n:0, spend:0, refund:0, rebate:0, cat:{}, card:{}}, i;
  for(i=0;i<S.txns.length;i++){
    var t=S.txns[i], k=txKey(t);
    if(!k || k<ym1 || k>ym2) continue;
    var a=Number(t.a)||0, ck=txCat(t);
    out.total+=a; out.n++;
    if(a>=0) out.spend+=a;
    else if(t.kind==='回饋') out.rebate+=a;
    else out.refund+=a;
    out.cat[ck]=(out.cat[ck]||0)+a;
    out.card[t.cid]=(out.card[t.cid]||0)+a;
  }
  return out;
}
function ym(y,m){ return y+'-'+p2(m+1); }
function rank(obj){
  var arr=[], k;
  for(k in obj){ if(obj.hasOwnProperty(k)) arr.push({k:k, v:obj[k]}); }
  arr.sort(function(a,b){ return b.v-a.v; });
  return arr;
}
function vAnalysis(){
  if(!S.txns.length && !S.cards.length) return emptyState();
  var t=today(), i, B={}, h;
  if(!ANV.y) ANV.y=t.getFullYear();
  var y=ANV.y, m=ANV.m;

  /* 年度區間 vs 單月區間 */
  var from = (m<0) ? ym(y,0)  : ym(y,m);
  var to   = (m<0) ? ym(y,11) : ym(y,m);
  var A = txAgg(from, to);

  /* 年份切換：沒有帳單期的紀錄（手動記帳）不產生空白的年份按鈕 */
  var years={}, yl=[];
  for(i=0;i<S.txns.length;i++){
    var yy=txKey(S.txns[i]).slice(0,4);
    if(/^\d{4}$/.test(yy)) years[yy]=1;
  }
  years[String(t.getFullYear())]=1;
  for(var k in years){ if(years.hasOwnProperty(k)) yl.push(k); }
  yl.sort(function(a,b){ return b-a; });

  h = '<div class="afilt"><div class="chips">';
  for(i=0;i<yl.length;i++)
    h += '<button class="chip'+(String(y)===yl[i]?' on':'')+'" onclick="ANV.y='+yl[i]+';render()">'+yl[i]+'</button>';
  h += '</div><div class="seg">'
    +  '<button class="'+(ANV.byCyc?'':'on')+'" onclick="ANV.byCyc=false;render()">依消費日</button>'
    +  '<button class="'+(ANV.byCyc?'on':'')+'" onclick="ANV.byCyc=true;render()">依帳單期</button>'
    +  '</div><div class="chips scroll">'
    +  '<button class="chip'+(m<0?' on':'')+'" onclick="ANV.m=-1;render()">整年</button>';
  for(i=0;i<12;i++)
    h += '<button class="chip'+(m===i?' on':'')+'" onclick="ANV.m='+i+';render()">'+(i+1)+'月</button>';
  h += '</div></div><div class="mut2 anote">'
    +  (ANV.byCyc ? '每筆掛在它所屬的那期帳單，金額應與電子帳單的本期應繳一致。'
                  : '用實際消費日分月。同一期帳單常跨兩個月，所以跟帳單金額不會一樣。')
    +  '</div>';
  B.filt = '<section class="sec">'+h+'</section>';

  /* 主數字 */
  var lastA = (m<0) ? txAgg(ym(y-1,0), ym(y-1,11))
                    : (m===0 ? txAgg(ym(y-1,11), ym(y-1,11)) : txAgg(ym(y,m-1), ym(y,m-1)));
  var diff = A.total - lastA.total;
  B.hero = sec('', '<div class="hero"><div class="lab">'+(m<0? y+' 年度累積刷卡' : y+' 年 '+(m+1)+' 月刷卡')+'</div>'
    +  '<div class="big num" style="color:var(--brass)"><small>NT$</small>'+money(A.total)+'</div>'
    +  '<div class="legend" style="margin-top:8px"><span>'+A.n+' 筆</span>'
    +  '<span style="color:'+(diff>0?'var(--rose)':'var(--mint)')+'">'
    +  (lastA.total? (diff>=0?'▲ ':'▼ ')+money(Math.abs(diff))+'（'+(m<0?'較去年':'較上月')+'）' : '—')+'</span>'
    +  '<span>平均 '+money(A.n?A.total/A.n:0)+' /筆</span></div>'
    +  ((A.refund || A.rebate) ? '<div class="stat3" style="margin-top:10px">'
        + '<div><div class="k">消費</div><div class="v num">'+money(A.spend)+'</div></div>'
        + (A.rebate ? '<div><div class="k">回饋/折抵</div><div class="v num" style="color:var(--mint)">'+money(A.rebate)+'</div></div>' : '')
        + (A.refund ? '<div><div class="k">退款</div><div class="v num" style="color:var(--mint)">'+money(A.refund)+'</div></div>' : '')
        + '<div><div class="k">淨額</div><div class="v num" style="color:var(--brass)">'+money(A.total)+'</div></div></div>' : '')
    +  '</div>');

  /* 月趨勢 */
  var mv=[], mx=0;
  for(i=0;i<12;i++){
    var v=txAgg(ym(y,i), ym(y,i)).total;
    mv.push(v); if(v>mx) mx=v;
  }
  h = '<div class="card"><div class="bars">';
  for(i=0;i<12;i++){
    var hp = mx>0 ? Math.max(2, mv[i]/mx*100) : 2;
    h += '<div class="bar'+(m===i?' on':'')+'" onclick="ANV.m='+i+';render()">'
      +  '<span class="bv">'+(mv[i]? (mv[i]>=10000? (mv[i]/10000).toFixed(1)+'萬' : fmt(mv[i])) : '')+'</span>'
      +  '<i style="height:'+hp.toFixed(1)+'%"></i><span class="bl">'+(i+1)+'</span></div>';
  }
  B.bars = sec(y+' 年月支出', h + '</div></div>');

  /* 分類佔比 */
  var cr = rank(A.cat);
  if(cr.length > 1){        /* 只有一類就不必顯示 */
    h = '<div class="card">';
    var other = 0;
    for(i=0;i<cr.length;i++){
      var co=catOf(cr[i].k), pc = A.total>0 ? cr[i].v/A.total*100 : 0;
      if(cr[i].k==='他') other = pc;
      h += '<div class="crank"><span class="cg">'+co.g+'</span><span class="cn">'+co.n+'</span>'
        +  '<span class="cb"><span class="gauge"><i style="width:'+Math.max(0,Math.min(100,pc)).toFixed(1)+'%;background:var(--brassd)"></i></span></span>'
        +  '<span class="cp num">'+pc.toFixed(0)+'%</span>'
        +  '<span class="cv num">'+money(cr[i].v)+'</span></div>';
    }
    if(other >= 15) h += '<div class="mut2" style="margin-top:4px">「其他」佔 '+other.toFixed(0)+'%。到記帳頁點一筆改分類，會存成規則，同名商店以後都照這個分。</div>';
    B.cat = sec('分類佔比', h + '</div>');
  }

  /* 各銀行帳單對帳 */
  if(ANV.byCyc){
    var bsum={}, bcnt={}, i2;
    for(i2=0;i2<S.txns.length;i2++){
      var t2=S.txns[i2], k3=txKey(t2);
      if(!k3 || k3<from || k3>to) continue;
      var cd3=byId(S.cards,t2.cid);
      var bc3=cd3 ? (normCode(cd3.code) || ('?'+(cd3.name||'').slice(0,3))) : '?';
      bsum[bc3]=(bsum[bc3]||0)+(Number(t2.a)||0);
      bcnt[bc3]=(bcnt[bc3]||0)+1;
    }
    var br=rank(bsum);
    if(br.length){
      h = '<div class="mut2" style="margin:-2px 0 8px">這裡的金額應該等於該銀行同一期電子帳單的本期應繳。</div>'
        + '<div class="card tcard"><table class="tbl">'
        + '<tr><th>銀行</th><th class="r">筆數</th><th class="r">明細加總</th></tr>';
      for(i2=0;i2<br.length;i2++){
        h += '<tr><td>'+esc(bankLabel(br[i2].k))+'</td>'
          +  '<td class="num r" style="color:var(--dim)">'+(bcnt[br[i2].k]||0)+'</td>'
          +  '<td class="num r">'+money(br[i2].v)+'</td></tr>';
      }
      B.recon = sec('各銀行帳單對帳', h + '</table></div>');
    }
  }

  /* 卡片使用排行 */
  var kr = rank(A.card);
  if(kr.length){
    h = '<div class="card tcard"><table class="tbl">'
      + '<tr><th>卡片</th><th class="r">筆數</th><th class="r">金額</th></tr>';
    for(i=0;i<kr.length && i<12;i++){
      var cd=byId(S.cards,kr[i].k);
      var cn=0, j;
      for(j=0;j<S.txns.length;j++){
        var tt=S.txns[j], k2=txKey(tt);
        if(tt.cid===kr[i].k && k2>=from && k2<=to) cn++;
      }
      h += '<tr><td>'+esc(cd?cd.name:'（已刪卡）')+'</td>'
        +  '<td class="num r" style="color:var(--dim)">'+cn+'</td>'
        +  '<td class="num r">'+money(kr[i].v)+'</td></tr>';
    }
    B.rank = sec('卡片使用排行', h + '</table></div>');
  }

  /* 卡片組成 */
  var cs=activeCards();
  if(cs.length){
    var byNet={}, byTier={}, nTra=0, nExp=0;
    var bankSet={}, bankAuto={}, bkey;
    for(i=0;i<cs.length;i++){
      var c=cs[i];
      byNet[c.net||'未設定']=(byNet[c.net||'未設定']||0)+1;
      byTier[c.tier||'一般卡']=(byTier[c.tier||'一般卡']||0)+1;
      /* 自動扣款是整家銀行一起扣，所以用銀行家數統計才有意義 */
      bkey=normCode(c.code) || ('?'+(c.name||'').slice(0,3));
      bankSet[bkey]=1;
      if(c.auto) bankAuto[bkey]=1;
      if(c.tra && c.tra!=='無') nTra++;
      if(expSoon(c)) nExp++;
    }
    var nBank=0, nBankAuto=0;
    for(bkey in bankSet){ if(bankSet.hasOwnProperty(bkey)) nBank++; }

function rulesBlock(){
  var rs=S.catRules||[], act=[], pend=0, i;
  for(i=0;i<rs.length;i++){
    if(rs[i].p) pend++;
    if(rs[i].kw && rs[i].cat && catValid(rs[i].cat)) act.push(rs[i]);
  }
  act.sort(function(a,b){ return a.kw<b.kw?-1:(a.kw>b.kw?1:0); });
  var h = '<div class="card"><div class="mut2" style="line-height:1.75">帳單明細依商店名稱自動分類。分錯的，到記帳頁點那一筆改分類，'
    + '會記成「商店名稱包含…」的規則，同名商店與之後匯入的帳單都照這條分。</div>';
  if(act.length){
    h += '<table class="tbl" style="margin-top:8px"><tr><th>商店名稱包含</th><th>分類</th><th class="r">筆數</th><th></th></tr>';
    for(i=0;i<act.length;i++){
      var co=catOf(act[i].cat);
      h += '<tr><td>'+esc(act[i].kw)+(act[i].p?' <span class="mut2">未同步</span>':'')+'</td>'
        +  '<td style="white-space:nowrap">'+co.g+' '+co.n+'</td>'
        +  '<td class="num r" style="color:var(--dim)">'+ruleHits(act[i].kw)+'</td>'
        +  '<td class="r" style="width:52px"><button class="cpb" onclick="delRule(\''+jsq(act[i].kw)+'\')">刪除</button></td></tr>';
    }
    h += '</table>';
  }else{
    h += '<div class="mut2" style="margin-top:8px">還沒有自訂規則，目前全部依內建判斷。</div>';
  }
  if(pend && S.cfg.api) h += '<button class="btn sm ghost" onclick="flushRules(1)">同步 '+pend+' 條未同步的規則</button>';
  return sec('分類規則<span class="ct">'+act.length+' 條</span>', h + '</div>');

function delRule(kw){
  if(!confirm('刪除規則「'+kw+'」？\n符合的明細會改回內建判斷。')) return;
  setRule(kw, '');
  render();
  toast('已刪除規則');

/* ============ Sheet ============ */
/* 彈出層開啟時鎖住背景捲動：iOS 上不鎖的話手指會捲到後面的頁面 */
var _sy = 0;
function openSheet(html){
  var wasOpen = $('sh').className === 'on';
  if(!wasOpen){
    _sy = window.pageYOffset || document.documentElement.scrollTop || 0;
    document.body.className = 'lock';
    document.body.style.top = (-_sy) + 'px';
  }
  $('shc').innerHTML = html;
  $('sh').scrollTop = 0;
  $('bd').className = 'on';
  $('sh').className = 'on';
}
function closeSheet(){
  if($('sh').className === 'on'){
    document.body.className = '';
    document.body.style.top = '';
    window.scrollTo(0, _sy);
  }
  $('bd').className = '';
  $('sh').className = '';
}

function onBankPick(){

function saveCard(){
  var id=$('c_id').value;
  var name=$('c_name').value.trim();
  if(!name){ toast('請填卡片名稱'); return; }
  var c = id ? byId(S.cards,id) : null;
  if(!c){ c={id:uid(), log:[]}; S.cards.push(c); }
  c.name  = name;
  c.code  = normCode($('c_code').value);
  c.last4 = padz($('c_last4').value, 4);
  c.limit = Math.round(numVal('c_limit', 0) * 10000);
  c.close = Math.min(31, Math.max(1, numVal('c_close', 5)||5));
  c.due   = Math.min(31, Math.max(1, numVal('c_due', 23)||23));
  c.dueNext = $('c_dnext').value === '1';
  c.base  = numVal('c_base', 0);
  c.baseDate = $('c_bdate').value || ds(today());
  c.acct  = $('c_acct').value.trim();
  c.adjDate = $('c_adjd') ? $('c_adjd').value : (c.adjDate||'');
  c.adjNext = c.adjDate ? calcAdjNext(c.adjDate) : (c.adjNext||'');
  c.nbId   = $('c_nbid') ? $('c_nbid').value.trim() : (c.nbId||'');
  c.nbHint = $('c_nbhint') ? $('c_nbhint').value.trim() : (c.nbHint||'');
  c.color = $('c_color').value;
  c.note  = $('c_note').value.trim();
  c.off   = $('c_off').checked;
  c.net   = $('c_net') ? $('c_net').value : (c.net||'');
  c.tier  = $('c_tier') ? $('c_tier').value : (c.tier||'一般卡');
  c.tra   = $('c_tra') ? $('c_tra').value : (c.tra||'無');
  c.site  = $('c_site') ? $('c_site').value.trim() : (c.site||'');
  c.auto  = $('c_auto') ? $('c_auto').checked : false;
  c.nb    = $('c_nb') ? $('c_nb').checked : false;
  c.dep   = $('c_dep') ? $('c_dep').checked : false;
  c.sec   = $('c_sec') ? $('c_sec').checked : false;
  c.traOn = $('c_traon') ? ($('c_traon').value === '已啟用') : !!c.traOn;
  c.exp   = $('c_exp') ? expParse($('c_exp').value) : (c.exp||'');
  c.shr   = !!c.code;                 /* 同行一律共用額度，不再逐張設定 */
  /* 與銀行的關係（網銀 / 存款戶 / 證券戶）屬於銀行層級，同行自動同步 */
  var syncN = 0, SW = {};
  if(c.code){
    for(var q=0;q<S.cards.length;q++){
      var x=S.cards[q];
      if(x===c || normCode(x.code)!==normCode(c.code)) continue;
      x.shr = true;
      var ch=false;
      /* 同行＝一張合併帳單：結帳日、繳款截止日、額度、可調額日全行共通 */
      if(x.close!==c.close || x.due!==c.due || x.dueNext!==c.dueNext){
        x.close=c.close; x.due=c.due; x.dueNext=c.dueNext; ch=true; SW.cyc=1;
      }
      if(x.limit!==c.limit){ x.limit=c.limit; ch=true; SW.lim=1; }
      if(x.adjNext!==c.adjNext || x.adjDate!==c.adjDate){
        x.adjNext=c.adjNext; x.adjDate=c.adjDate; ch=true; SW.adj=1;
      }
      if(x.nbId!==c.nbId || x.nbHint!==c.nbHint){
        x.nbId=c.nbId; x.nbHint=c.nbHint; ch=true; SW.nb=1;
      }
      if(x.nb!==c.nb || x.dep!==c.dep || x.sec!==c.sec || x.auto!==c.auto){
        x.nb=c.nb; x.dep=c.dep; x.sec=c.sec; x.auto=c.auto; ch=true; SW.rel=1;
      }
      if(ch) syncN++;
    }
  }
  if(!c.log) c.log=[];
  save(); closeSheet(); render();
  var what=[];
  if(SW.cyc) what.push('結帳/繳款日');
  if(SW.lim) what.push('額度');
  if(SW.adj) what.push('調額日');
  if(SW.nb)  what.push('網銀資料');
  if(SW.rel) what.push('帳戶關係');
  toast(c.limit<=0 ? '已儲存，但額度是 0，不會計入總額度'
      : (syncN ? (what.join('、')+' 已同步到 '+(bankName(c.code)||'同行')+' 其他 '+syncN+' 張')
               : ('已儲存 · '+c.name+' 額度 '+wan(c.limit))));
}
function delCard(id){
  var c=byId(S.cards,id); if(!c) return;
  var n=0, i;
  for(i=0;i<S.txns.length;i++){ if(S.txns[i].cid===id) n++; }
  if(!confirm('刪除「'+c.name+'」？\n這張卡的 '+n+' 筆消費紀錄也會一起刪除，無法復原。')) return;
  var nt=[], np=[];
  for(i=0;i<S.txns.length;i++){ if(S.txns[i].cid!==id) nt.push(S.txns[i]); else tomb(S.txns[i].id); }
  for(i=0;i<S.pays.length;i++){ if(S.pays[i].cid!==id) np.push(S.pays[i]); else tomb(S.pays[i].id); }
  S.txns=nt; S.pays=np;
  var nc=[]; for(i=0;i<S.cards.length;i++){ if(S.cards[i].id!==id) nc.push(S.cards[i]); }
  S.cards=nc;
  save(); closeSheet(); render(); toast('已刪除');
}

/* ---- 貼上解析 ---- */
function pasteSheet(){
  openSheet('<h3>貼上銀行通知</h3>'
    + '<div class="mut2">LINE、簡訊、Email 的消費通知都可以。長按複製整段貼進來，會自動抓金額、末四碼、日期、商店。</div>'
    + '<textarea id="pz" placeholder="【玉山銀行】您的信用卡末四碼1234 於 01/15 12:30 消費 NT$1,250 商店：全家便利商店"></textarea>'
    + '<button class="btn" onclick="doParse()">解析並填入</button>'
    + '<button class="btn ghost sm" onclick="closeSheet()">取消</button>');
  setTimeout(function(){ if($('pz')) $('pz').focus(); }, 320);
}
function parseNotify(s){
  s = String(s||'').replace(/\u3000/g,' ');
  var r = {a:0, l4:'', d:'', m:''}, mm;

  mm = s.match(/(?:NT\$|NTD|TWD|新臺幣|新台幣|金額|消費|授權)[^\d\-]{0,6}([\d,]+(?:\.\d{1,2})?)/);
  if(!mm) mm = s.match(/([\d,]{2,})\s*元/);
  if(mm) r.a = Number(String(mm[1]).replace(/,/g,'')) || 0;

  mm = s.match(/(?:末\s*[四4]\s*碼|後\s*[四4]\s*碼|尾號|末碼|卡號)[^\d]{0,8}(\d{4})(?!\d)/);
  if(!mm) mm = s.match(/[*x\u2022]{2,}\s*(\d{4})(?!\d)/i);
  if(mm) r.l4 = mm[1];

  var y = today().getFullYear();
  mm = s.match(/(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
  if(mm){ r.d = mm[1]+'-'+p2(+mm[2])+'-'+p2(+mm[3]); }
  else{
    mm = s.match(/(?:^|[^\d])(\d{1,2})[\/\-](\d{1,2})(?![\d\/\-])/);
    if(mm){
      var mo=+mm[1], dy=+mm[2];
      if(mo>=1 && mo<=12 && dy>=1 && dy<=31){
        var cand = new Date(y, mo-1, dy);
        if(cand - today() > 86400000*45) cand = new Date(y-1, mo-1, dy);
        r.d = ds(cand);
      }
    }
  }
  if(!r.d) r.d = ds(today());

  mm = s.match(/(?:商店|特店|店名|消費地點|商店名稱|特約商店)\s*[：:]\s*([^\n\r，,。；;]{1,28})/);
  if(!mm) mm = s.match(/(?:於|在)\s*([A-Za-z0-9\u4e00-\u9fa5][^\n\r，,。；;]{1,24}?)\s*(?:消費|刷卡|授權|使用)/);
  if(mm) r.m = String(mm[1]).replace(/\s+$/,'').replace(/^\s+/,'');

  return r;
}
function doParse(){
  var r = parseNotify($('pz').value);
  if(!r.a){ toast('抓不到金額，請手動填'); }
  DRAFT.a = r.a || '';
  DRAFT.d = r.d;
  DRAFT.m = r.m || '';
  if(r.l4){
    for(var i=0;i<S.cards.length;i++){
      if(S.cards[i].last4 === r.l4){ DRAFT.cid = S.cards[i].id; break; }
    }
  }
  closeSheet(); go('add');
  toast(r.a ? ('抓到 NT$'+fmt(r.a)+(r.l4?' · 末四碼 '+r.l4:'')) : '請確認欄位');
}

/* ============ 行事曆匯出 ============ */
function icsEsc(s){ return String(s).replace(/([\\;,])/g,'\\$1').replace(/\n/g,'\\n'); }
function icsD(dt){ return dt.getFullYear()+p2(dt.getMonth()+1)+p2(dt.getDate()); }
function icsAdd(L, uidS, start, summary, desc, rrule, alarms){
  var e=new Date(start.getFullYear(), start.getMonth(), start.getDate()+1);
  L.push('BEGIN:VEVENT');
  L.push('UID:'+uidS+'@carddesk');
  L.push('DTSTAMP:'+icsD(today())+'T000000Z');
  L.push('DTSTART;VALUE=DATE:'+icsD(start));
  L.push('DTEND;VALUE=DATE:'+icsD(e));
  L.push('SUMMARY:'+icsEsc(summary));
  if(desc) L.push('DESCRIPTION:'+icsEsc(desc));
  if(rrule) L.push('RRULE:'+rrule);
  L.push('TRANSP:TRANSPARENT');
  for(var i=0;i<alarms.length;i++){
    L.push('BEGIN:VALARM');
    L.push('ACTION:DISPLAY');
    L.push('DESCRIPTION:'+icsEsc(summary));
    L.push('TRIGGER'+alarms[i]);
    L.push('END:VALARM');
  }
  L.push('END:VEVENT');
}
function buildICS(){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CardDesk//TW//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:卡務 信用卡提醒'];
  var cs=activeCards(), t=today(), i, j, rd=Math.max(0, Number(S.cfg.remindDays||3));
  var dueAl = [];
  if(rd>=2) dueAl.push(':-P'+(rd-1)+'DT15H');
  dueAl.push(':-PT15H');            /* 前一天 09:00 */
  dueAl.push(';RELATED=START:PT9H'); /* 當天 09:00 */

  for(i=0;i<cs.length;i++){
    var c=cs[i], tag=(c.name||'卡')+' ·'+(c.last4||'');
    var nc = nextClose(c);
    var nd = dueOf(c, lastClose(c));
    if(nd < t) nd = dueOf(c, nc);

    /* 結帳日 */
    if(c.close<=28){
      icsAdd(L, c.id+'-cl', nc, '💳 '+tag+' 結帳日',
        '這期消費到今天為止。額度：'+wan(c.limit), 'FREQ=MONTHLY;BYMONTHDAY='+c.close, [';RELATED=START:PT9H']);
    }else{
      for(j=0;j<24;j++){
        var d1=mk(nc.getFullYear(), nc.getMonth()+j, c.close);
        icsAdd(L, c.id+'-cl'+j, d1, '💳 '+tag+' 結帳日', '這期消費到今天為止。', '', [';RELATED=START:PT9H']);
      }
    }
    /* 繳款截止日 */
    if(c.due<=28){
      icsAdd(L, c.id+'-du', nd, '⚠️ '+tag+' 繳款截止',
        'e-Bill 銷帳編號：'+(c.acct||'未設定')+'\n機構：'+(c.code?c.code+' '+bankName(c.code):'未設定')+'\nhttps://ebill.ba.org.tw/',
        'FREQ=MONTHLY;BYMONTHDAY='+c.due, dueAl);
    }else{
      for(j=0;j<24;j++){
        var d2=mk(nd.getFullYear(), nd.getMonth()+j, c.due);
        icsAdd(L, c.id+'-du'+j, d2, '⚠️ '+tag+' 繳款截止',
          'e-Bill 銷帳編號：'+(c.acct||'未設定'), '', dueAl);
      }
    }
    /* 調額日 */
    if(c.adjNext){
      icsAdd(L, c.id+'-aj', pd(c.adjNext), '📈 '+tag+' 可申請調額',
        '目前額度 '+wan(c.limit), '', [';RELATED=START:PT9H']);
    }
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function exportICS(){
  if(!activeCards().length){ toast('還沒有啟用中的卡片'); return; }
  var ics = buildICS();
  var blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  var fname = 'carddesk-reminders.ics';
  if(navigator.canShare && navigator.share){
    try{
      var f = new File([blob], fname, {type:'text/calendar'});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f], title:'卡務 提醒'}).then(function(){}, function(){});
        toast('選「加入行事曆」或先存到檔案');
        return;
      }
    }catch(e){}
  }
  dl(blob, fname);
  toast('已下載，開啟後加入行事曆');
}
function dl(blob, fname){
  var u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=fname; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 1200);
}

}
function importSheet(){
  openSheet('<h3>匯入備份</h3><div class="mut2">貼上備份檔的 JSON 內容。會整份覆蓋目前資料。</div>'
    + '<textarea id="imp" placeholder=\'{"cards":[...],"txns":[...]}\'></textarea>'
    + '<button class="btn danger" onclick="doImport()">覆蓋匯入</button>'
    + '<button class="btn ghost sm" onclick="closeSheet()">取消</button>');
}
function doImport(){
  try{
    var o=JSON.parse($('imp').value);
    if(!o.cards) throw new Error('格式不對');
    S.cards=o.cards||[]; S.txns=o.txns||[]; S.pays=o.pays||[];
    if(Object.prototype.toString.call(o.catRules)==='[object Array]'){ S.catRules=o.catRules; rulesChanged(); }
    if(o.cfg){ for(var k in o.cfg){ if(o.cfg.hasOwnProperty(k) && k!=='api' && k!=='key') S.cfg[k]=o.cfg[k]; } }
    var gm=stripGmail();
    save(); closeSheet(); go('ov'); toast('匯入完成'+(gm?'（略過 '+gm+' 筆 Gmail 通知記帳）':''));
  }catch(e){ toast('讀不懂這段 JSON'); }
}
function wipe(){
  if(!confirm('清除所有卡片與紀錄？無法復原。')) return;
  if(!confirm('真的確定？建議先「匯出備份」。')) return;
  var i;
  for(i=0;i<S.txns.length;i++) tomb(S.txns[i].id);
  for(i=0;i<S.pays.length;i++) tomb(S.pays[i].id);
  S.cards=[]; S.txns=[]; S.pays=[];
  save(); go('ov'); toast('已清空');
}
function fixCodes(){
  var fixed=0, guessed=0, still=[], i;
  for(i=0;i<S.cards.length;i++){
    var c=S.cards[i], before=String(c.code==null?'':c.code);
    var nc=normCode(c.code);
    if(!nc || !bankName(nc)){
      var g=guessBank(c.name);
      if(g){ c.code=g; guessed++; }
      else { c.code=nc; if(!nc) still.push(c.name); }
    }else{
      c.code=nc;
    }
    c.last4 = padz(c.last4, 4);
    if(String(c.code)!==before) fixed++;
    if(c.code) c.shr=true;
  }
  save(); render();
  var msg = fixed ? (fixed+' 張已修復'+(guessed?'（'+guessed+' 張依卡名判斷）':'')) : '沒有需要修復的代碼';
  if(still.length) msg += '，'+still.length+' 張仍需手動選機構';
  toast(msg);
}
function recalcAdj(){
  for(var i=0;i<S.cards.length;i++){
    var c=S.cards[i];
    if(c.adjDate) c.adjNext = calcAdjNext(c.adjDate);
  }
}
function redetectAll(){
  var n=0, i, hits=[];
  for(i=0;i<S.cards.length;i++){
    var c=S.cards[i], d=detectCard(c.name), ch=[];
    if(d.net && c.net!==d.net){ c.net=d.net; ch.push(d.net); }
    if(d.tier!=='一般卡' && c.tier!==d.tier){ c.tier=d.tier; ch.push(d.tier); }
    if(d.tra!=='無' && c.tra!==d.tra){ c.tra=d.tra; ch.push(d.tra); }
    if(ch.length){ n++; if(hits.length<3) hits.push(c.name+'→'+ch.join('/')); }
  }
  save(); render();
  toast(n ? (n+' 張已更新：'+hits.join('、')+(n>3?' …':'')) : '沒有需要更新的卡片');
}
function acctHintText(){
  return S.cfg.acctLocal
    ? '目前<b style="color:var(--mint)">不上傳</b>，換手機時這三欄要重新輸入。'
    : '目前<b style="color:var(--brass)">會上傳</b>到你自己的 Google 試算表，換手機下載就有。'
      + '存取靠網址加密鑰保護，所以<b>只填自己看得懂的代號，不要填完整卡號或真正的密碼</b>。';
}
function savePay2(){
  S.cfg.pay = {code:$('y_code').value.replace(/\D/g,'').slice(0,3),
               acct:$('y_acct').value.replace(/[^0-9\-]/g,''),
               pid: $('y_pid').value.trim().toUpperCase()};
  save(); toast('付款帳戶已存在本機');
}
function saveSync(){
  S.cfg.api = $('s_api').value.trim();
  S.cfg.key = $('s_key').value.trim();
  save(); toast('已儲存');
  flushRules();
}
/* Apps Script 忙碌時會回 HTML 錯誤頁、逾時，或在轉址時弄丟 POST 內容，自動重試 */
function gasFetch(opt, cb, label, n){
  n = n || 1;
  var url = opt.url, init = opt.init || {};
  fetch(url, init)
    .then(function(r){ return r.text(); })
    .then(function(txt){
      var t = String(txt||'').replace(/^\s+/,'');
      if(t.charAt(0)==='{'){
        var j;
        try{ j = JSON.parse(t); }catch(e){ j = null; }
        if(j && !(j.ok===false && j.err==='POST_LOST')){ cb(j); return; }
        if(j) throw new Error('請求內容在轉址時遺失');
      }
      throw new Error(t.charAt(0)==='<' ? 'Google 回了錯誤頁' : '非預期回應');
    })
    .catch(function(e){
      if(n < 5){
        toast(label+'重試中…（'+(n+1)+'/5）');
        setTimeout(function(){ gasFetch(opt, cb, label, n+1); }, 2500*n*n);
      }else{
        cb({ok:false, err:(e && e.message) || '連線失敗'});
      }
    });
}
/* POST 一律把密鑰也掛在網址上：轉址後 POST 內容會消失，網址上的密鑰還在 */
function gasPost(body, cb, label){
  var api = S.cfg.api;
  body.key = S.cfg.key;
  gasFetch({url: api + (api.indexOf('?')<0?'?':'&') + 'key=' + encodeURIComponent(S.cfg.key), init:{
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  }}, cb, label);
}
function pushCloud(){
  if(!S.cfg.api){ toast('請先填 Apps Script 網址'); return; }
  /* 銷帳編號多為完整卡號，預設剝除後才上傳 */
  var outCards=[], i, k;
  for(i=0;i<S.cards.length;i++){
    var o={}, src=S.cards[i];
    for(k in src){ if(src.hasOwnProperty(k)) o[k]=src[k]; }
    /* 銷帳編號、網銀代號、密碼提示：由設定頁的開關決定要不要上傳 */
    if(S.cfg.acctLocal){ o.acct=''; o.nbId=''; o.nbHint=''; }
    outCards.push(o);
  }
  toast('上傳中…');
  gasPost({action:'push', del:S.del||[],
    data:{cards:outCards, txns:S.txns, pays:S.pays, ovr:S.ovr||{},
          cfg:{remindDays:S.cfg.remindDays, warnPct:S.cfg.warnPct}}},   /* pay 與 api key 永不上傳 */
  function(j){
    if(j.ok){ S.del=[]; save(); toast('已上傳 '+(j.n||'')+' 筆'); flushRules(); }
    else toast('上傳失敗：'+(j.err||'?'));
  }, '上傳');
}
function pullCloud(){
  if(!S.cfg.api){ toast('請先填 Apps Script 網址'); return; }
  if(!confirm('從雲端下載會覆蓋這台裝置的資料，確定？')) return;
  toast('下載中…');
  gasFetch({url:S.cfg.api + (S.cfg.api.indexOf('?')<0?'?':'&') + 'action=pull&key=' + encodeURIComponent(S.cfg.key)},
   function(j){
      if(!j.ok){ toast('下載失敗：'+(j.err||'?')); return; }
      var keep={}, keepNB={}, i;
      for(i=0;i<S.cards.length;i++){
        if(S.cards[i].acct) keep[S.cards[i].id]=S.cards[i].acct;
        if(S.cards[i].nbId || S.cards[i].nbHint)
          keepNB[S.cards[i].id]={id:S.cards[i].nbId, hint:S.cards[i].nbHint};
      }
      S.cards=j.data.cards||[]; S.txns=j.data.txns||[]; S.pays=j.data.pays||[]; S.del=[];
      if(j.data.ovr) S.ovr=j.data.ovr;
      /* 分類規則：雲端為準，本機還沒同步的修改保留下來再送一次 */
      if(j.data.catRules) mergeRules(j.data.catRules);
      rulesChanged();
      for(i=0;i<S.cards.length;i++){
        if(!S.cards[i].acct && keep[S.cards[i].id]) S.cards[i].acct=keep[S.cards[i].id];
        var kn=keepNB[S.cards[i].id];
        if(kn){ if(!S.cards[i].nbId) S.cards[i].nbId=kn.id; if(!S.cards[i].nbHint) S.cards[i].nbHint=kn.hint; }
      }
      /* 雲端可能是舊格式、且試算表會吃掉前導零，下載後一定要重跑正規化 */
      migrate20();
      var gm=stripGmail();
      save(); go('ov');
      toast('已下載 '+S.cards.length+' 張卡 / '+S.txns.length+' 筆'+(gm?'（略過 '+gm+' 筆 Gmail 通知記帳）':''));
      flushRules();
   }, '下載');
}

/* ============ 啟動 ============ */
load();
go('ov');
watchBreakpoint();
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script>
