<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0f1319; --slab:#161c26; --slab2:#1d2531; --line:#2a3444;
  --brass:#d4a24c; --brassd:#7d6030; --mint:#4fd1a5; --rose:#f2607a; --amber:#f0b429;
  --txt:#e8eef7; --dim:#8090a6; --dim2:#5b687d;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
html,body{margin:0;padding:0;background:var(--ink);color:var(--txt);font-family:var(--sans);
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{padding-top:calc(52px + var(--st));padding-bottom:calc(66px + var(--sb))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--txt)}
button{border:0;background:none;cursor:pointer}
a{color:var(--brass)}

/* ---- header ---- */
#hd{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(15,19,25,.92);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding-top:var(--st)}
#hd .row{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px}
#hd .ttl{font-size:16px;font-weight:800;letter-spacing:.14em}
#hd .sub{font-size:10px;color:var(--dim2);letter-spacing:.18em;text-transform:uppercase}
#hd .sp{flex:1}
.ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--slab);border:1px solid var(--line);font-size:15px;color:var(--dim)}
.ico.on{color:var(--brass);border-color:var(--brassd)}

/* ---- tabs ---- */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:rgba(15,19,25,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--sb)}
#tabs button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim2);font-size:10px;letter-spacing:.06em}
#tabs button .g{font-size:19px;line-height:1}
#tabs button.on{color:var(--brass)}

/* ---- layout ---- */
main{padding:14px}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim2);
  margin:22px 0 9px;display:flex;align-items:center;gap:9px}
.eyebrow:first-child{margin-top:2px}
.eyebrow:after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:14px}
.card+.card{margin-top:10px}
.mut{color:var(--dim);font-size:12px}
.mut2{color:var(--dim2);font-size:11px}

/* ---- hero: 額度光譜 ---- */
.hero{background:var(--slab);border:1px solid var(--line);border-radius:16px;padding:16px 15px 14px}
.hero .lab{font-size:10px;letter-spacing:.2em;color:var(--dim2);text-transform:uppercase}
.hero .big{font-size:40px;font-weight:800;line-height:1.05;margin:6px 0 2px;color:var(--mint)}
.hero .big small{font-size:15px;color:var(--dim);font-weight:600;margin-right:5px;letter-spacing:0}
.band{display:flex;height:16px;border-radius:5px;overflow:hidden;background:#111722;margin:14px 0 8px;
  border:1px solid var(--line)}
.band i{display:block;height:100%;border-right:1px solid rgba(15,19,25,.85)}
.band i:last-child{border-right:0}
.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.legend b{color:var(--txt);font-weight:600}
.stat3{display:flex;gap:8px;margin-top:12px}
.stat3>div{flex:1;background:var(--slab2);border-radius:10px;padding:9px 10px}
.stat3 .k{font-size:10px;color:var(--dim2);letter-spacing:.1em}
.stat3 .v{font-size:16px;font-weight:700;margin-top:3px}

/* ---- 卡片列 ---- */
.crow{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;
  position:relative;overflow:hidden}
.crow .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
.crow .top{display:flex;align-items:baseline;gap:8px}
.crow .nm{font-size:14px;font-weight:700}
.crow .l4{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em}
.crow .sp{flex:1}
.crow .amt{font-size:15px;font-weight:700}
.gauge{height:6px;border-radius:3px;background:#111722;margin:9px 0 6px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:3px}
.crow .ln{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}

/* ---- signature: 週期軌 ---- */
.track{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.trk{position:relative;height:22px}
.trk .rail{position:absolute;left:0;right:0;top:9px;height:2px;background:#212a38;border-radius:2px}
.trk .fill{position:absolute;left:0;top:9px;height:2px;background:var(--brassd);border-radius:2px}
.trk .pt{position:absolute;top:4px;width:2px;height:12px;background:#39455a;transform:translateX(-1px)}
.trk .pt.due{background:var(--rose);width:3px}
.trk .now{position:absolute;top:1px;width:9px;height:9px;border-radius:50%;background:var(--brass);
  border:2px solid var(--ink);transform:translateX(-6px);box-shadow:0 0 0 2px rgba(212,162,76,.22)}
.trkl{display:flex;justify-content:space-between;font-size:10px;color:var(--dim2);margin-top:1px}

/* ---- 表單 ---- */
label{display:block;font-size:11px;color:var(--dim);letter-spacing:.08em;margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--slab2);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brassd)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.g2{display:flex;gap:8px}.g2>*{flex:1}
.g3{display:flex;gap:8px}.g3>*{flex:1}
.amtin{font-family:var(--mono);font-size:34px !important;font-weight:700;text-align:right;padding:14px 14px;
  color:var(--brass);letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;background:var(--slab2);border:1px solid var(--line);
  font-size:12.5px;color:var(--dim)}
.chip.on{background:rgba(212,162,76,.13);border-color:var(--brass);color:var(--brass);font-weight:600}
.btn{display:block;width:100%;padding:13px;border-radius:11px;background:var(--brass);color:#191203;
  font-weight:800;font-size:15px;letter-spacing:.04em;margin-top:16px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:600}
.btn.danger{background:transparent;border:1px solid #58303c;color:var(--rose);font-weight:600}
.btn.sm{padding:9px;font-size:13px;margin-top:8px}
.brow{display:flex;gap:8px}.brow>*{flex:1;margin-top:0}

/* ---- 帳單 ---- */
.bill{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}
.bill.due{border-color:#57323f}
.bill.paid{opacity:.55}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.06em}
.pill.a{background:rgba(242,96,122,.15);color:var(--rose)}
.pill.b{background:rgba(240,180,41,.14);color:var(--amber)}
.pill.c{background:rgba(79,209,165,.14);color:var(--mint)}
.pill.d{background:#212a38;color:var(--dim)}

/* ---- 明細 ---- */
.tx{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .cat{width:32px;height:32px;border-radius:9px;background:var(--slab2);display:flex;align-items:center;
  justify-content:center;font-size:15px;flex:none}
.tx .m{font-size:13.5px;font-weight:600}
.tx .d{font-size:11px;color:var(--dim2);margin-top:2px}
.tx .sp{flex:1}
.tx .a{font-size:14px;font-weight:700;white-space:nowrap}

/* ---- sheet ---- */
#bd{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;
  transition:opacity .2s}
#bd.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--slab);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line);max-height:92vh;overflow-y:auto;transform:translateY(102%);
  transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:8px 15px calc(22px + var(--sb));
  -webkit-overflow-scrolling:touch}
#sh.on{transform:translateY(0)}
#sh .grip{width:38px;height:4px;border-radius:2px;background:#334052;margin:6px auto 12px}
#sh h3{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:.02em}

#toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translate(-50%,14px);z-index:60;
  background:#242f3f;border:1px solid var(--line);color:var(--txt);padding:10px 17px;border-radius:11px;
  font-size:13px;opacity:0;pointer-events:none;transition:all .22s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:44px 20px;color:var(--dim2)}
.empty .g{font-size:34px;opacity:.5}
.empty p{font-size:13px;margin:12px 0 0;line-height:1.7}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--dim2);font-weight:600;font-size:10.5px;letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<header id="hd"><div class="row">
  <div>
    <div class="ttl">卡務</div>
    <div class="sub" id="hsub">card desk</div>
  </div>
  <div class="sp"></div>
  <button class="ico" id="btnPriv" onclick="togglePriv()">👁</button>
  <button class="ico" onclick="editCard('')">＋</button>
</div></header>

<main id="app"></main>

<nav id="tabs">
  <button id="t_ov"  onclick="go('ov')"><span class="g">◎</span>總覽</button>
  <button id="t_cd"  onclick="go('cd')"><span class="g">▤</span>卡片</button>
  <button id="t_add" onclick="go('add')"><span class="g">✎</span>記帳</button>
  <button id="t_bl"  onclick="go('bl')"><span class="g">◆</span>帳單</button>
  <button id="t_st"  onclick="go('st')"><span class="g">⚙</span>設定</button>
</nav>

<div id="bd" onclick="closeSheet()"></div>
<div id="sh"><div class="grip"></div><div id="shc"></div></div>
<div id="toast"></div>

<script>
/* ==================================================================
   卡務 Card Desk  v1.0
   單檔 PWA · ES5 · 資料存 localStorage · 雲端同步為選配
   ================================================================== */
var APP_VER = 'v1.1';
var KEY = 'CARDDESK_V1';

var CATS = [
  {k:'食', g:'🍜', n:'餐飲'}, {k:'超', g:'🛒', n:'超市'}, {k:'網', g:'📦', n:'網購'},
  {k:'行', g:'🚗', n:'交通'}, {k:'油', g:'⛽', n:'加油'}, {k:'樂', g:'🎬', n:'娛樂'},
  {k:'旅', g:'✈️', n:'旅遊'}, {k:'醫', g:'🏥', n:'醫療'}, {k:'費', g:'🧾', n:'繳費'},
  {k:'保', g:'🛡', n:'保險'}, {k:'他', g:'▫️', n:'其他'}
];

/* e-Bill 全國繳費網「信用卡機構」代號（參考用，實際以帳單或 e-Bill 選單為準） */
var BANKS = [
  ['004','臺灣銀行'],['005','土地銀行'],['006','合作金庫'],['007','第一銀行'],['008','華南銀行'],
  ['009','彰化銀行'],['011','上海商銀'],['012','台北富邦'],['013','國泰世華'],['016','高雄銀行'],
  ['017','兆豐銀行'],['048','王道銀行'],['050','臺灣企銀'],['052','渣打銀行'],['053','台中銀行'],
  ['054','京城銀行'],['081','匯豐(台灣)'],['103','新光銀行'],['108','陽信銀行'],['118','板信銀行'],
  ['147','三信商銀'],['700','中華郵政'],['803','聯邦銀行'],['805','遠東商銀'],['806','元大銀行'],
  ['807','永豐銀行'],['808','玉山銀行'],['809','凱基銀行'],['810','星展(台灣)'],['812','台新銀行'],
  ['816','安泰銀行'],['822','中國信託'],['823','將來銀行'],['824','LINE Bank'],['826','樂天國際']
];

var PALETTE = ['#d4a24c','#4fd1a5','#6ea8fe','#f2607a','#b98cf0','#f0b429','#5ec8c8','#e08b5a','#9aa8bd','#7fd06b'];

var S = {
  cards: [], txns: [], pays: [], del: [],
  cfg: {api:'', key:'', privacy:false, remindDays:3, warnPct:80, rev:0, groupBank:false, acctLocal:true}
};
var TAB = 'ov';
var DRAFT = {cid:'', cat:'食', d:''};

/* ============ 基礎工具 ============ */
function $(id){ return document.getElementById(id); }
function p2(n){ return n<10 ? '0'+n : ''+n; }
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(n){
  n = Math.round(Number(n)||0);
  var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (n<0?'-':'') + s;
}
function money(n){ return S.cfg.privacy ? '••,•••' : fmt(n); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* 數字輸入防呆：iOS 上 type=number 只要含不合法字元 .value 會回空字串 */
function numVal(id, dflt){
  var e=$(id); if(!e) return dflt||0;
  var v=String(e.value==null?'':e.value).replace(/[^0-9.\-]/g,'');
  if(v==='' || isNaN(Number(v))) return dflt||0;
  return Number(v);
}
function nextColor(){
  var used={}, i;
  for(i=0;i<S.cards.length;i++) used[S.cards[i].color]=1;
  for(i=0;i<PALETTE.length;i++) if(!used[PALETTE[i]]) return PALETTE[i];
  return PALETTE[S.cards.length % PALETTE.length];
}
/* 依發卡機構彙總：同一家銀行的卡合併成一列 */
function byBank(){
  var cs=activeCards(), map={}, order=[], i;
  for(i=0;i<cs.length;i++){
    var c=cs[i], k=c.code || ('?'+(c.name||'未分類').slice(0,3));
    if(!map[k]){
      map[k]={key:k, code:c.code||'', label:(c.code? c.code+' '+bankName(c.code) : '未設定機構'),
              n:0, limit:0, used:0, cards:[]};
    }
    map[k].n++; map[k].limit += Number(c.limit)||0; map[k].used += usedOf(c); map[k].cards.push(c);
  }
  for(i=0;i<order.length;i++){}
  var out=[], kk;
  for(kk in map){ if(map.hasOwnProperty(kk)) out.push(map[kk]); }
  out.sort(function(a,b){ return b.limit-a.limit; });
  return out;
}
function tomb(id){ if(!S.del) S.del=[]; S.del.push(id); if(S.del.length>800) S.del=S.del.slice(-800); }
function dim(y,m){ return new Date(y, m+1, 0).getDate(); }
function mk(y,m,day){ var mm=new Date(y,m,1); return new Date(mm.getFullYear(), mm.getMonth(), Math.min(day, dim(mm.getFullYear(), mm.getMonth()))); }
function ds(dt){ return dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate()); }
function pd(s){ var a=String(s||'').split('-'); return new Date(+a[0], (+a[1]||1)-1, +a[2]||1); }
function today(){ var t=new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function dayDiff(a,b){ return Math.round((b-a)/86400000); }
function md(dt){ return (dt.getMonth()+1)+'/'+dt.getDate(); }
function byId(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; } return null; }
function catOf(k){ for(var i=0;i<CATS.length;i++){ if(CATS[i].k===k) return CATS[i]; } return CATS[CATS.length-1]; }
function bankName(code){ for(var i=0;i<BANKS.length;i++){ if(BANKS[i][0]===code) return BANKS[i][1]; } return ''; }

function toast(msg){
  var t=$('toast'); t.textContent=msg; t.className='on';
  clearTimeout(toast._h); toast._h=setTimeout(function(){ t.className=''; }, 2100);
}

/* ============ 儲存 ============ */
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o.cards) S.cards=o.cards;
      if(o.txns)  S.txns=o.txns;
      if(o.pays)  S.pays=o.pays;
      if(o.del)   S.del=o.del;
      if(o.cfg){ for(var k in o.cfg){ if(o.cfg.hasOwnProperty(k)) S.cfg[k]=o.cfg[k]; } }
    }
  }catch(e){ console.log('load fail', e); }
}
function save(){
  S.cfg.rev = (S.cfg.rev||0) + 1;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('儲存失敗：瀏覽器空間不足'); }
}

/* ============ 週期計算 ============ */
function lastClose(c, ref){
  ref = ref || today();
  var x = mk(ref.getFullYear(), ref.getMonth(), c.close);
  if(x > ref) x = mk(ref.getFullYear(), ref.getMonth()-1, c.close);
  return x;
}
function nextClose(c, ref){
  var l = lastClose(c, ref);
  return mk(l.getFullYear(), l.getMonth()+1, c.close);
}
function prevClose(c, ref){
  var l = lastClose(c, ref);
  return mk(l.getFullYear(), l.getMonth()-1, c.close);
}
function dueOf(c, closeDate){
  var off = c.dueNext ? 1 : 0;
  return mk(closeDate.getFullYear(), closeDate.getMonth()+off, c.due);
}
/* 交易區間 (from, to] */
function sumRange(cid, from, to){
  var s=0;
  for(var i=0;i<S.txns.length;i++){
    var t=S.txns[i];
    if(t.cid!==cid) continue;
    var d=pd(t.d);
    if(d>from && d<=to) s += Number(t.a)||0;
  }
  return s;
}
/* 本期已結帳待繳（上上次結帳 → 上次結帳） */
function stmtAmount(c){ return sumRange(c.id, prevClose(c), lastClose(c)); }
/* 未出帳（上次結帳 → 今天） */
function unbilled(c){ return sumRange(c.id, lastClose(c), today()); }

function cycKey(c){ return ds(lastClose(c)); }
function isPaid(c){
  var k = cycKey(c);
  for(var i=0;i<S.pays.length;i++){ if(S.pays[i].cid===c.id && S.pays[i].cyc===k) return S.pays[i]; }
  return null;
}

/* ============ 額度 ============ */
function usedOf(c){
  var base = Number(c.base)||0;
  var bd = c.baseDate ? pd(c.baseDate) : null;
  var u = base, i, t;
  for(i=0;i<S.txns.length;i++){
    t=S.txns[i];
    if(t.cid!==c.id) continue;
    if(!bd || pd(t.d) > bd) u += Number(t.a)||0;
  }
  for(i=0;i<S.pays.length;i++){
    t=S.pays[i];
    if(t.cid!==c.id) continue;
    if(!bd || pd(t.d) > bd) u -= Number(t.a)||0;
  }
  return u;
}
function activeCards(){
  var a=[]; for(var i=0;i<S.cards.length;i++){ if(!S.cards[i].off) a.push(S.cards[i]); } return a;
}
function totals(){
  var cs=activeCards(), L=0, U=0;
  for(var i=0;i<cs.length;i++){ L += Number(cs[i].limit)||0; U += usedOf(cs[i]); }
  return {limit:L, used:U, avail:L-U, pct: L>0 ? U/L*100 : 0};
}
function pctColor(p){
  if(p>=90) return 'var(--rose)';
  if(p>=Number(S.cfg.warnPct||80)) return 'var(--amber)';
  return 'var(--mint)';
}

/* ============ 導覽 ============ */
function go(tab){
  TAB = tab;
  var ids=['ov','cd','add','bl','st'];
  for(var i=0;i<ids.length;i++){ $('t_'+ids[i]).className = (ids[i]===tab?'on':''); }
  window.scrollTo(0,0);
  render();
}
function render(){
  var h = '';
  if(TAB==='ov')  h = vOverview();
  if(TAB==='cd')  h = vCards();
  if(TAB==='add') h = vAdd();
  if(TAB==='bl')  h = vBills();
  if(TAB==='st')  h = vSettings();
  $('app').innerHTML = h;
  $('btnPriv').className = 'ico' + (S.cfg.privacy?' on':'');
  $('hsub').textContent = S.cards.length ? (activeCards().length + ' cards · ' + APP_VER) : 'card desk';
}
function togglePriv(){ S.cfg.privacy = !S.cfg.privacy; save(); render(); }

/* ============ 視圖：總覽 ============ */
function vOverview(){
  if(!S.cards.length) return emptyState();
  var T = totals(), cs = activeCards(), i, h='';

  /* 額度光譜：每張卡一段，寬度 = 額度佔比，填色深度 = 使用率 */
  var band='';
  for(i=0;i<cs.length;i++){
    var c=cs[i], w = T.limit>0 ? (Number(c.limit)||0)/T.limit*100 : 0;
    var up = (Number(c.limit)>0) ? Math.max(0,Math.min(100, usedOf(c)/c.limit*100)) : 0;
    var col = c.color || PALETTE[i%PALETTE.length];
    band += '<i style="width:'+w.toFixed(3)+'%;background:linear-gradient(90deg,'+col+' '+up.toFixed(1)+'%,#1b2331 '+up.toFixed(1)+'%)" title="'+esc(c.name)+'"></i>';
  }

  h += '<div class="hero">'
    +  '<div class="lab">可用額度合計</div>'
    +  '<div class="big"><small>NT$</small>'+money(T.avail)+'</div>'
    +  '<div class="band">'+band+'</div>'
    +  '<div class="legend"><span>已用 <b>'+money(T.used)+'</b></span>'
    +  '<span style="color:'+pctColor(T.pct)+'">'+T.pct.toFixed(1)+'%</span>'
    +  '<span>總額度 <b>'+money(T.limit)+'</b></span></div>'
    +  '<div class="stat3">'
    +    '<div><div class="k">本月消費</div><div class="v num">'+money(monthSpend(0))+'</div></div>'
    +    '<div><div class="k">上月消費</div><div class="v num" style="color:var(--dim)">'+money(monthSpend(-1))+'</div></div>'
    +    '<div><div class="k">卡片</div><div class="v num">'+cs.length+'<span style="font-size:11px;color:var(--dim2)"> 張</span></div></div>'
    +  '</div></div>';

  /* 依銀行彙總 */
  var bk = byBank();
  if(bk.length){
    h += '<div class="eyebrow">依銀行彙總 · '+bk.length+' 家</div><div class="card" style="padding:4px 13px 10px">'
      +  '<table class="tbl"><tr><th>機構</th><th style="text-align:right">卡</th>'
      +  '<th style="text-align:right">額度</th><th style="text-align:right">可用</th></tr>';
    for(i=0;i<bk.length;i++){
      var b=bk[i], bp = b.limit>0 ? b.used/b.limit*100 : 0;
      h += '<tr><td>'+esc(b.label)+'</td>'
        +  '<td class="num" style="text-align:right;color:var(--dim)">'+b.n+'</td>'
        +  '<td class="num" style="text-align:right">'+money(b.limit)+'</td>'
        +  '<td class="num" style="text-align:right;color:'+pctColor(bp)+'">'+money(b.limit-b.used)+'</td></tr>';
    }
    h += '</table></div>';
  }

  /* 即將到期 */
  var up = upcoming(45);
  h += '<div class="eyebrow">即將到期</div>';
  if(!up.length){
    h += '<div class="card mut">未來 45 天沒有到期的帳單。</div>';
  }else{
    for(i=0;i<up.length && i<6;i++) h += billCard(up[i], true);
  }

  /* 本月分類 */
  var cat = monthByCat();
  if(cat.length){
    h += '<div class="eyebrow">本月分類</div><div class="card">';
    var top = cat[0].v || 1;
    for(i=0;i<cat.length && i<6;i++){
      var it = cat[i], co = catOf(it.k);
      h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">'
        +  '<span style="width:22px">'+co.g+'</span>'
        +  '<span style="width:38px;font-size:12px;color:var(--dim)">'+co.n+'</span>'
        +  '<span style="flex:1"><span class="gauge" style="margin:0"><i style="width:'+(it.v/top*100).toFixed(1)+'%;background:var(--brassd)"></i></span></span>'
        +  '<span class="num" style="font-size:12.5px;width:74px;text-align:right">'+money(it.v)+'</span></div>';
    }
    h += '</div>';
  }

  /* 調額提醒 */
  var adj = adjSoon();
  if(adj.length){
    h += '<div class="eyebrow">可申請調額</div>';
    for(i=0;i<adj.length;i++){
      var a=adj[i], dd=dayDiff(today(), pd(a.adjNext));

function emptyState(){
  return '<div class="empty"><div class="g">▤</div>'

    + '<button class="btn" style="max-width:240px;margin:22px auto 0" onclick="editCard(\'\')">新增第一張卡</button></div>';
}
function monthSpend(off){
  var t=today(), y=t.getFullYear(), m=t.getMonth()+off, s=0;
  var a=new Date(y,m,1), b=new Date(y,m+1,0,23,59,59);
  for(var i=0;i<S.txns.length;i++){ var d=pd(S.txns[i].d); if(d>=a && d<=b) s += Number(S.txns[i].a)||0; }
  return s;
}
function monthByCat(){
  var t=today(), a=new Date(t.getFullYear(),t.getMonth(),1), b=new Date(t.getFullYear(),t.getMonth()+1,0,23,59,59);
  var map={}, i;
  for(i=0;i<S.txns.length;i++){
    var x=S.txns[i], d=pd(x.d);
    if(d<a||d>b) continue;
    var k=x.c||'他'; map[k]=(map[k]||0)+(Number(x.a)||0);
  }
  var arr=[]; for(var k2 in map){ if(map.hasOwnProperty(k2)) arr.push({k:k2, v:map[k2]}); }
  arr.sort(function(p,q){ return q.v-p.v; });
  return arr;
}
function upcoming(days){
  var cs=activeCards(), out=[], t=today();
  for(var i=0;i<cs.length;i++){
    var c=cs[i], amt=stmtAmount(c), due=dueOf(c, lastClose(c)), dd=dayDiff(t, due), paid=isPaid(c);
    if(dd > days) continue;
    if(paid && dd < 0) continue;
    if(!amt && !paid && dd < 0) continue;
    if(!amt && !paid && dd >= 0 && amt===0) { /* 無消費也顯示，但排後面 */ }
    out.push({c:c, amt:amt, due:due, dd:dd, paid:paid});
  }
  out.sort(function(p,q){ if(p.paid&&!q.paid) return 1; if(!p.paid&&q.paid) return -1; return p.dd-q.dd; });
  return out;
}
function adjSoon(){
  var cs=activeCards(), out=[], t=today();
  for(var i=0;i<cs.length;i++){
    var c=cs[i];
    if(!c.adjNext) continue;
    var dd=dayDiff(t, pd(c.adjNext));
    if(dd<=30) out.push(c);
  }
  return out;
}

function vCards(){
  if(!S.cards.length) return emptyState();
  var h = '<div style="display:flex;gap:8px;margin-bottom:10px">'
    + '<input id="q" placeholder="搜尋銀行 / 卡名 / 末四碼" oninput="render()" value="'+esc(vCards._q||'')+'" style="flex:1">'
    + '<button class="ico" style="width:44px;height:44px;font-size:19px" onclick="editCard(\'\')">＋</button></div>'

    + '<button class="chip'+(S.cfg.groupBank?'':' on')+'" onclick="S.cfg.groupBank=false;save();render()">全部卡片</button>'
    + '<button class="chip'+(S.cfg.groupBank?' on':'')+'" onclick="S.cfg.groupBank=true;save();render()">依銀行分組</button>'
    + '</div>';
  var q = ($('q') ? $('q').value : (vCards._q||'')).toLowerCase();
  vCards._q = q;

  var cs = [], i, j;
  for(i=0;i<S.cards.length;i++){
    var c0=S.cards[i];
    if(q){
      var hay = ((c0.name||'')+(c0.last4||'')+(c0.code||'')+bankName(c0.code)+(c0.note||'')).toLowerCase();
      if(hay.indexOf(q)<0) continue;
    }
    cs.push(c0);
  }
  if(!cs.length) return h + '<div class="empty"><p>沒有符合的卡片。<br>換個關鍵字，或按右上 ＋ 新增一張。</p></div>';

  if(!S.cfg.groupBank){
    cs.sort(function(a,b){ return (a.off?1:0)-(b.off?1:0) || (Number(b.limit)||0)-(Number(a.limit)||0); });
    for(i=0;i<cs.length;i++) h += cardRow(cs[i], i);
    return h;
  }

  /* 依銀行分組：每家一個標頭，附該行卡數與額度合計 */
  var map={}, keys=[];
  for(i=0;i<cs.length;i++){
    var c=cs[i], k=c.code || ('?'+(c.name||'未分類').slice(0,3));
    if(!map[k]){ map[k]={label:(c.code? c.code+' '+bankName(c.code) : '未設定機構'), list:[], limit:0, used:0}; keys.push(k); }
    map[k].list.push(c);
    if(!c.off){ map[k].limit += Number(c.limit)||0; map[k].used += usedOf(c); }
  }
  keys.sort(function(a,b){ return map[b].limit - map[a].limit; });
  for(i=0;i<keys.length;i++){
    var g=map[keys[i]], gp = g.limit>0 ? g.used/g.limit*100 : 0;
    h += '<div class="eyebrow" style="margin-top:'+(i?'20px':'2px')+'">'+esc(g.label)+'</div>'
      +  '<div class="card" style="padding:10px 13px;margin-bottom:9px">'
      +  '<div class="legend"><span>'+g.list.length+' 張 · 額度合計 <b class="num">'+money(g.limit)+'</b></span>'
      +  '<span style="color:'+pctColor(gp)+'">可用 '+money(g.limit-g.used)+'</span></div></div>';
    g.list.sort(function(a,b){ return (a.off?1:0)-(b.off?1:0) || (Number(b.limit)||0)-(Number(a.limit)||0); });
    for(j=0;j<g.list.length;j++) h += cardRow(g.list[j], j);
  }
  return h;
}
function cardRow(c, i){
  var lim=Number(c.limit)||0, u=usedOf(c), p = lim>0 ? u/lim*100 : 0;
  var col = c.color || PALETTE[i%PALETTE.length];
  var lc=lastClose(c), nc=nextClose(c), du=dueOf(c,lc), t=today();
  var ub=unbilled(c), st=stmtAmount(c), paid=isPaid(c);

  /* 週期軌：上次結帳 → 下次結帳，繳款截止標紅 */
  var span = dayDiff(lc, nc) || 30;
  var nowP = Math.max(0, Math.min(100, dayDiff(lc, t)/span*100));
  var dueP = dayDiff(lc, du)/span*100;
  var trk = '<div class="trk"><div class="rail"></div>'
    + '<div class="fill" style="width:'+nowP.toFixed(1)+'%;background:'+col+'88"></div>'
    + '<div class="pt" style="left:0"></div><div class="pt" style="left:100%"></div>'
    + (dueP>=0 && dueP<=105 ? '<div class="pt due" style="left:'+Math.min(100,dueP).toFixed(1)+'%"></div>' : '')
    + '<div class="now" style="left:'+nowP.toFixed(1)+'%"></div></div>'
    + '<div class="trkl"><span>結帳 '+md(lc)+'</span>'
    + '<span style="color:var(--rose)">繳款 '+md(du)+(paid?' ✓':'')+'</span>'
    + '<span>結帳 '+md(nc)+'</span></div>';

  return '<div class="crow" onclick="openCard(\''+c.id+'\')">'
    + '<div class="stripe" style="background:'+col+(c.off?';opacity:.3':'')+'"></div>'
    + '<div class="top"><span class="nm">'+esc(c.name||'未命名')+'</span>'
    + '<span class="l4">•'+esc(c.last4||'····')+'</span>'
    + (c.off?'<span class="pill d" style="margin-left:4px">停用</span>':'')
    + '<span class="sp"></span><span class="amt num" style="color:'+pctColor(p)+'">'+money(lim-u)+'</span></div>'
    + '<div class="gauge"><i style="width:'+Math.max(0,Math.min(100,p)).toFixed(1)+'%;background:'+pctColor(p)+'"></i></div>'
    + '<div class="ln"><span>已用 <b class="num" style="color:var(--txt)">'+money(u)+'</b> / '+money(lim)+'</span>'
    + '<span>'+p.toFixed(0)+'%</span></div>'
    + '<div class="track">'+trk
    + '<div class="ln" style="margin-top:8px"><span>本期未出帳 <b class="num" style="color:var(--txt)">'+money(ub)+'</b></span>'
    + '<span>待繳 <b class="num" style="color:'+(paid?'var(--mint)':'var(--txt)')+'">'+money(st)+'</b></span></div>'
    + '</div></div>';
}

  for(i=0;i<S.pays.length;i++){ if(S.pays[i].cid!==id) np.push(S.pays[i]); else tomb(S.pays[i].id); }

function parseNotify(s){
  s = String(s||'').replace(/\u3000/g,' ');
  var r = {a:0, l4:'', d:'', m:''}, mm;

  mm = s.match(/(?:NT\$|NTD|TWD|新臺幣|新台幣|金額|消費|授權)[^\d\-]{0,6}([\d,]+(?:\.\d{1,2})?)/);
  if(!mm) mm = s.match(/([\d,]{2,})\s*元/);
  if(mm) r.a = Number(String(mm[1]).replace(/,/g,'')) || 0;

  mm = s.match(/(?:末\s*[四4]\s*碼|後\s*[四4]\s*碼|尾號|末碼|卡號)[^\d]{0,8}(\d{4})(?!\d)/);
  if(!mm) mm = s.match(/[*x\u2022]{2,}\s*(\d{4})(?!\d)/i);
  if(mm) r.l4 = mm[1];

  var y = today().getFullYear();
  mm = s.match(/(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
  if(mm){ r.d = mm[1]+'-'+p2(+mm[2])+'-'+p2(+mm[3]); }
  else{
    mm = s.match(/(?:^|[^\d])(\d{1,2})[\/\-](\d{1,2})(?![\d\/\-])/);
    if(mm){
      var mo=+mm[1], dy=+mm[2];
      if(mo>=1 && mo<=12 && dy>=1 && dy<=31){
        var cand = new Date(y, mo-1, dy);
        if(cand - today() > 86400000*45) cand = new Date(y-1, mo-1, dy);
        r.d = ds(cand);
      }
    }
  }
  if(!r.d) r.d = ds(today());

  mm = s.match(/(?:商店|特店|店名|消費地點|商店名稱|特約商店)\s*[：:]\s*([^\n\r，,。；;]{1,28})/);
  if(!mm) mm = s.match(/(?:於|在)\s*([A-Za-z0-9\u4e00-\u9fa5][^\n\r，,。；;]{1,24}?)\s*(?:消費|刷卡|授權|使用)/);
  if(mm) r.m = String(mm[1]).replace(/\s+$/,'').replace(/^\s+/,'');

  return r;
}
function doParse(){
  var r = parseNotify($('pz').value);
  if(!r.a){ toast('抓不到金額，請手動填'); }
  DRAFT.a = r.a || '';

  DRAFT.m = r.m || '';
  if(r.l4){
    for(var i=0;i<S.cards.length;i++){
      if(S.cards[i].last4 === r.l4){ DRAFT.cid = S.cards[i].id; break; }
    }
  }
  closeSheet(); go('add');
  toast(r.a ? ('抓到 NT$'+fmt(r.a)+(r.l4?' · 末四碼 '+r.l4:'')) : '請確認欄位');
}

/* ============ 行事曆匯出 ============ */
function icsEsc(s){ return String(s).replace(/([\\;,])/g,'\\$1').replace(/\n/g,'\\n'); }
function icsD(dt){ return dt.getFullYear()+p2(dt.getMonth()+1)+p2(dt.getDate()); }
function icsAdd(L, uidS, start, summary, desc, rrule, alarms){
  var e=new Date(start.getFullYear(), start.getMonth(), start.getDate()+1);
  L.push('BEGIN:VEVENT');
  L.push('UID:'+uidS+'@carddesk');
  L.push('DTSTAMP:'+icsD(today())+'T000000Z');
  L.push('DTSTART;VALUE=DATE:'+icsD(start));
  L.push('DTEND;VALUE=DATE:'+icsD(e));
  L.push('SUMMARY:'+icsEsc(summary));
  if(desc) L.push('DESCRIPTION:'+icsEsc(desc));
  if(rrule) L.push('RRULE:'+rrule);
  L.push('TRANSP:TRANSPARENT');
  for(var i=0;i<alarms.length;i++){
    L.push('BEGIN:VALARM');
    L.push('ACTION:DISPLAY');
    L.push('DESCRIPTION:'+icsEsc(summary));
    L.push('TRIGGER'+alarms[i]);
    L.push('END:VALARM');
  }
  L.push('END:VEVENT');
}
function buildICS(){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CardDesk//TW//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:卡務 信用卡提醒'];
  var cs=activeCards(), t=today(), i, j, rd=Math.max(0, Number(S.cfg.remindDays||3));
  var dueAl = [];
  if(rd>=2) dueAl.push(':-P'+(rd-1)+'DT15H');
  dueAl.push(':-PT15H');            /* 前一天 09:00 */
  dueAl.push(';RELATED=START:PT9H'); /* 當天 09:00 */

  for(i=0;i<cs.length;i++){
    var c=cs[i], tag=(c.name||'卡')+' ·'+(c.last4||'');
    var nc = nextClose(c);
    var nd = dueOf(c, lastClose(c));
    if(nd < t) nd = dueOf(c, nc);

    /* 結帳日 */
    if(c.close<=28){
      icsAdd(L, c.id+'-cl', nc, '💳 '+tag+' 結帳日',
        '這期消費到今天為止。額度：'+fmt(c.limit), 'FREQ=MONTHLY;BYMONTHDAY='+c.close, [';RELATED=START:PT9H']);
    }else{
      for(j=0;j<24;j++){
        var d1=mk(nc.getFullYear(), nc.getMonth()+j, c.close);
        icsAdd(L, c.id+'-cl'+j, d1, '💳 '+tag+' 結帳日', '這期消費到今天為止。', '', [';RELATED=START:PT9H']);
      }
    }
    /* 繳款截止日 */
    if(c.due<=28){
      icsAdd(L, c.id+'-du', nd, '⚠️ '+tag+' 繳款截止',
        'e-Bill 銷帳編號：'+(c.acct||'未設定')+'\n機構：'+(c.code?c.code+' '+bankName(c.code):'未設定')+'\nhttps://ebill.ba.org.tw/',
        'FREQ=MONTHLY;BYMONTHDAY='+c.due, dueAl);
    }else{
      for(j=0;j<24;j++){
        var d2=mk(nd.getFullYear(), nd.getMonth()+j, c.due);
        icsAdd(L, c.id+'-du'+j, d2, '⚠️ '+tag+' 繳款截止',
          'e-Bill 銷帳編號：'+(c.acct||'未設定'), '', dueAl);
      }
    }
    /* 調額日 */
    if(c.adjNext){
      icsAdd(L, c.id+'-aj', pd(c.adjNext), '📈 '+tag+' 可申請調額',
        '目前額度 '+fmt(c.limit), '', [';RELATED=START:PT9H']);
    }
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function exportICS(){
  if(!activeCards().length){ toast('還沒有啟用中的卡片'); return; }
  var ics = buildICS();
  var blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  var fname = 'carddesk-reminders.ics';
  if(navigator.canShare && navigator.share){
    try{
      var f = new File([blob], fname, {type:'text/calendar'});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f], title:'卡務 提醒'}).then(function(){}, function(){});
        toast('選「加入行事曆」或先存到檔案');
        return;
      }
    }catch(e){}
  }
  dl(blob, fname);
  toast('已下載，開啟後加入行事曆');
}
function dl(blob, fname){
  var u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=fname; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 1200);
}

/* ============ 備份 / 同步 ============ */
function exportJSON(){
  var blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
  var fname = 'carddesk-'+ds(today())+'.json';
  if(navigator.canShare && navigator.share){
    try{
      var f=new File([blob], fname, {type:'application/json'});
      if(navigator.canShare({files:[f]})){ navigator.share({files:[f]}); toast('選一個地方存起來'); return; }
    }catch(e){}
  }
  dl(blob, fname); toast('已匯出');
}
function importSheet(){
  openSheet('<h3>匯入備份</h3><div class="mut2">貼上備份檔的 JSON 內容。會整份覆蓋目前資料。</div>'
    + '<textarea id="imp" placeholder=\'{"cards":[...],"txns":[...]}\'></textarea>'
    + '<button class="btn danger" onclick="doImport()">覆蓋匯入</button>'
    + '<button class="btn ghost sm" onclick="closeSheet()">取消</button>');
}
function doImport(){
  try{
    var o=JSON.parse($('imp').value);
    if(!o.cards) throw new Error('格式不對');
    S.cards=o.cards||[]; S.txns=o.txns||[]; S.pays=o.pays||[];
    if(o.cfg){ for(var k in o.cfg){ if(o.cfg.hasOwnProperty(k) && k!=='api' && k!=='key') S.cfg[k]=o.cfg[k]; } }
    save(); closeSheet(); go('ov'); toast('匯入完成');
  }catch(e){ toast('讀不懂這段 JSON'); }
}
function wipe(){
  if(!confirm('清除所有卡片與紀錄？無法復原。')) return;
  if(!confirm('真的確定？建議先「匯出備份」。')) return;
  var i;
  for(i=0;i<S.txns.length;i++) tomb(S.txns[i].id);
  for(i=0;i<S.pays.length;i++) tomb(S.pays[i].id);
  S.cards=[]; S.txns=[]; S.pays=[];
  save(); go('ov'); toast('已清空');
}
function saveSync(){
  S.cfg.api = $('s_api').value.trim();
  S.cfg.key = $('s_key').value.trim();
  save(); toast('已儲存');
}
function pushCloud(){
  if(!S.cfg.api){ toast('請先填 Apps Script 網址'); return; }
  /* 銷帳編號多為完整卡號，預設剝除後才上傳 */
  var outCards=[], i, k;
  for(i=0;i<S.cards.length;i++){
    var o={}, src=S.cards[i];
    for(k in src){ if(src.hasOwnProperty(k)) o[k]=src[k]; }
    if(S.cfg.acctLocal) o.acct='';
    outCards.push(o);
  }
  toast('上傳中…');
  fetch(S.cfg.api, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'push', key:S.cfg.key, del:S.del||[],
      data:{cards:outCards, txns:S.txns, pays:S.pays, cfg:{remindDays:S.cfg.remindDays, warnPct:S.cfg.warnPct}}})
  }).then(function(r){ return r.json(); })
    .then(function(j){
      if(j.ok){ S.del=[]; save(); toast('已上傳 '+(j.n||'')+' 筆'); }
      else toast('失敗：'+(j.err||'?'));
    })
    .catch(function(e){ toast('上傳失敗：'+e.message); });
}
function pullCloud(){
  if(!S.cfg.api){ toast('請先填 Apps Script 網址'); return; }
  if(!confirm('從雲端下載會覆蓋這台裝置的資料，確定？')) return;
  toast('下載中…');
  fetch(S.cfg.api + (S.cfg.api.indexOf('?')<0?'?':'&') + 'action=pull&key=' + encodeURIComponent(S.cfg.key))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok){ toast('失敗：'+(j.err||'?')); return; }
      var keep={}, i;
      for(i=0;i<S.cards.length;i++){ if(S.cards[i].acct) keep[S.cards[i].id]=S.cards[i].acct; }
      S.cards=j.data.cards||[]; S.txns=j.data.txns||[]; S.pays=j.data.pays||[]; S.del=[];
      for(i=0;i<S.cards.length;i++){ if(!S.cards[i].acct && keep[S.cards[i].id]) S.cards[i].acct=keep[S.cards[i].id]; }
      save(); go('ov'); toast('已下載 '+S.cards.length+' 張卡 / '+S.txns.length+' 筆');
    })
    .catch(function(e){ toast('下載失敗：'+e.message); });
}

/* ============ 啟動 ============ */
load();
go('ov');
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script>
