<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0f1319; --slab:#161c26; --slab2:#1d2531; --line:#2a3444; --line2:#222b38;
  --brass:#d4a24c; --brassd:#7d6030; --mint:#4fd1a5; --rose:#f2607a; --amber:#f0b429;
  --txt:#e8eef7; --dim:#8c9bb1; --dim2:#67758b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei UI","Microsoft JhengHei",sans-serif;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --hdh:52px; --side:220px; --wmax:1320px;
}
html,body{margin:0;padding:0;background:var(--ink);color:var(--txt);font-family:var(--sans);
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{font-size:14px;line-height:1.4;padding-top:calc(var(--hdh) + var(--st));padding-bottom:calc(66px + var(--sb))}
/* 中文不加字距；數字用等寬數字對齊，不換字型 */
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--txt);line-height:1.3}
button{border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
a{color:var(--brass)}

/* ---- 頁首 ---- */
#hd{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(15,19,25,.92);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding-top:var(--st)}
#hd .row{height:var(--hdh);display:flex;align-items:center;gap:10px;padding:0 14px}
#hd .brand{display:flex;align-items:baseline;gap:9px;min-width:0}
#hd .ttl{font-size:18px;font-weight:800}
#hd .sub{font-size:12px;color:var(--dim2);white-space:nowrap}
#hd .hin{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#hd .pg{display:none;font-size:19px;font-weight:700}
#hd .sp{flex:1}
.ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--slab);border:1px solid var(--line);font-size:15px;color:var(--dim);flex:none}
.ico.on{color:var(--brass);border-color:var(--brassd)}
.ico.big{width:44px;height:44px;font-size:19px}

/* ---- 分頁列（手機在底部，電腦在左側） ---- */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:rgba(15,19,25,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--sb)}
#tabs button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim2);font-size:11px}
#tabs button .g{font-size:19px;line-height:1}
#tabs button.on{color:var(--brass)}

/* ---- 版面 ---- */
main{padding:14px}
.sec+.sec{margin-top:22px}
.sec>.eyebrow:first-child{margin-top:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--dim);margin:22px 0 9px;display:flex;align-items:center;gap:10px}
.eyebrow:first-child{margin-top:2px}
.eyebrow:after{content:"";flex:1;height:1px;background:var(--line2)}
.eyebrow .ct{font-weight:400;color:var(--dim2);font-size:12px;margin-left:-2px}
.card{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:14px}
.card+.card{margin-top:10px}
.card.tcard{padding:4px 13px 8px}
.card.txl{padding:2px 13px}
.mut{color:var(--dim);font-size:13px}
.mut2{color:var(--dim2);font-size:12px}
.mut2.note{margin-top:10px;line-height:1.7}

/* ---- hero ---- */
.hero{background:var(--slab);border:1px solid var(--line);border-radius:16px;padding:16px 15px 14px}
.hero .lab{font-size:13px;color:var(--dim)}
.hero .big{font-size:40px;font-weight:800;line-height:1.05;margin:6px 0 2px;color:var(--mint)}
.hero .big small{font-size:15px;color:var(--dim);font-weight:600;margin-right:5px}
.band{display:flex;height:16px;border-radius:5px;overflow:hidden;background:#111722;margin:14px 0 8px;
  border:1px solid var(--line)}
.band i{display:block;height:100%;border-right:1px solid rgba(15,19,25,.85)}
.band i:last-child{border-right:0}
.legend{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--dim)}
.legend b{color:var(--txt);font-weight:600}
.stat3{display:flex;gap:8px;margin-top:12px}
.stat3>div{flex:1;min-width:0;background:var(--slab2);border-radius:10px;padding:9px 10px}
.stat3 .k{font-size:12px;color:var(--dim2)}
.stat3 .v{font-size:16px;font-weight:700;margin-top:3px}
.stat3.sum{margin:0 0 10px}

/* ---- 卡片列 ---- */
.cdtop{margin-bottom:12px}
.cdq{display:flex;gap:8px;margin-bottom:10px}
.cdq input{flex:1;min-width:0}
.cgrid>.crow{margin-bottom:9px}
.ghead{margin:-2px 0 10px}
.crow{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;
  position:relative;overflow:hidden;cursor:pointer}
.crow .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
.crow .top{display:flex;align-items:baseline;gap:8px}
.crow .nm{font-size:14.5px;font-weight:700;min-width:0}
.crow .l4{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.crow .sp{flex:1}
.crow .amt{font-size:15px;font-weight:700;white-space:nowrap}
.gauge{display:block;height:6px;border-radius:3px;background:#111722;margin:9px 0 6px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:3px}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim)}

/* ---- 週期軌與月長條 ---- */
.bars{display:flex;align-items:flex-end;gap:3px;height:132px;padding-top:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.bar i{display:block;width:100%;background:#2b3648;border-radius:3px 3px 0 0;transition:height .25s}
.bar.on i{background:var(--brass)}
.bar .bl{font-size:10px;color:var(--dim2);margin-top:4px}
.bar.on .bl{color:var(--brass)}
.bar .bv{position:absolute;top:-14px;font-size:9px;color:var(--dim2);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px}
.tg{font-size:11px;padding:2px 7px;border-radius:5px;background:#1e2635;color:var(--dim);
  border:1px solid var(--line)}
.tg.net{color:var(--txt);border-color:#3a465c}
.tg.hi{color:var(--brass);border-color:var(--brassd);background:rgba(212,162,76,.1)}
.tg.ok{color:var(--mint);border-color:#2c5a4b;background:rgba(79,209,165,.09)}
.tg.warn{color:var(--rose);border-color:#58303c;background:rgba(242,96,122,.1)}
.track{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.trk{position:relative;height:22px}
.trk .rail{position:absolute;left:0;right:0;top:9px;height:2px;background:#212a38;border-radius:2px}
.trk .fill{position:absolute;left:0;top:9px;height:2px;background:var(--brassd);border-radius:2px}
.trk .pt{position:absolute;top:4px;width:2px;height:12px;background:#39455a;transform:translateX(-1px)}
.trk .pt.due{background:var(--rose);width:3px}
.trk .now{position:absolute;top:1px;width:9px;height:9px;border-radius:50%;background:var(--brass);
  border:2px solid var(--ink);transform:translateX(-6px);box-shadow:0 0 0 2px rgba(212,162,76,.22)}
.trkl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim2);margin-top:1px}

/* ---- 分類排行 ---- */
.crank{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.crank .cg{width:22px;flex:none;text-align:center}
.crank .cn{width:74px;flex:none;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crank .cb{flex:1;min-width:0}
.crank .cb .gauge{margin:0}
.crank .cp{width:38px;flex:none;text-align:right;font-size:12px;color:var(--dim)}
.crank .cv{width:78px;flex:none;text-align:right;font-size:13px}

/* ---- 表單 ---- */
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
label.chk{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:13px;color:var(--txt)}
label.chk input{width:19px;height:19px;flex:none}
input,select,textarea{width:100%;background:var(--slab2);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brass)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.g2{display:flex;gap:8px}.g2>*{flex:1;min-width:0}
.g3{display:flex;gap:8px}.g3>*{flex:1;min-width:0}
.amtin{font-size:34px !important;font-weight:700;text-align:right;padding:14px 14px;
  color:var(--brass);font-variant-numeric:tabular-nums}
.fsec .eyebrow{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;background:var(--slab2);border:1px solid var(--line);
  font-size:13px;color:var(--dim);white-space:nowrap;flex:none}
.chip.on{background:rgba(212,162,76,.13);border-color:var(--brass);color:var(--brass);font-weight:600}
.chip .n{margin-left:5px;font-size:11.5px;color:var(--dim2);font-weight:400;font-variant-numeric:tabular-nums}
.chip.on .n{color:var(--brassd)}
.chip.zero{opacity:.45}
/* 手機上篩選按鈕排成一列可橫向滑動，不佔好幾行 */
.chips.scroll{position:relative;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.frow{margin-top:10px}
.flab{font-size:12px;color:var(--dim2);margin-bottom:6px}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--slab2);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.seg button{padding:6px 12px;border-radius:7px;font-size:13px;color:var(--dim)}
.seg button.on{background:var(--slab);color:var(--brass);font-weight:600;box-shadow:0 0 0 1px var(--brassd) inset}
#recs .frow+.card,#recs .frow+.stat3{margin-top:12px}
.fgrow{flex:1;min-width:0}
.fq{margin-bottom:8px}
.rng{display:flex;align-items:center;gap:8px;margin-top:8px}
.rng select{flex:1;min-width:0;padding:8px 10px}
.rng span{color:var(--dim2);font-size:12px;flex:none}
#rBody{margin-top:12px}
.afilt>*+*{margin-top:10px}
.anote{margin:10px 0 0}
.btn{display:block;width:100%;padding:13px;border-radius:11px;background:var(--brass);color:#191203;
  font-weight:800;font-size:15px;margin-top:16px;text-align:center}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:600}
.btn.danger{background:transparent;border:1px solid #58303c;color:var(--rose);font-weight:600}
.btn.sm{padding:9px;font-size:13px;margin-top:8px}
.brow{display:flex;gap:8px}.brow>*{flex:1;margin-top:0}

/* ---- 帳單 ---- */
.bill{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}
.bill.due{border-color:#57323f}
.bill.paid{opacity:.55}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.a{background:rgba(242,96,122,.15);color:var(--rose)}
.pill.b{background:rgba(240,180,41,.14);color:var(--amber)}
.pill.c{background:rgba(79,209,165,.14);color:var(--mint)}
.pill.d{background:#212a38;color:var(--dim)}
/* 帳單卡片裡的明細（點銀行展開） */
.bxt{display:flex;align-items:center;gap:8px;width:100%;margin-top:11px;padding:10px 2px 2px;
  border-top:1px dashed var(--line);font-size:13px;color:var(--dim);text-align:left}
.bxt .sp{flex:1}
.bxt .chev,.bkh .chev{color:var(--dim2);width:14px;text-align:center;flex:none}
.bxl{margin-top:2px}
.bxc{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--brass);
  margin:12px 2px 0;padding-bottom:5px;border-bottom:1px solid var(--line2)}
.bsel{margin-top:8px}
/* 手機版卡片頁：依銀行收合 */
.sec.bk{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin:0 0 9px}
.sec.bk+.sec.bk{margin-top:0}
.sec.bk.open{padding-bottom:3px}
.bkh{display:flex;align-items:center;gap:8px;width:100%;padding:13px 0;text-align:left}
.bkh .bkn{font-size:14.5px;font-weight:700;color:var(--txt)}
.bkh .bkc{font-size:12px;color:var(--dim2);white-space:nowrap}
.bkh .sp{flex:1}
.bkh .bka{font-size:13px;font-weight:600;white-space:nowrap}
.sec.bk .crow{background:var(--slab2)}
/* 記帳：卡片搜尋 */
.cpk{margin-top:8px}
.csel{margin-top:7px}

/* ---- 明細 ---- */
.tx{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line2)}
.tx:last-child{border-bottom:0}
.tx[onclick]{cursor:pointer}
.tx .cat{width:32px;height:32px;border-radius:9px;background:var(--slab2);display:flex;align-items:center;
  justify-content:center;font-size:15px;flex:none}
.tx .tm{min-width:0}
.tx .m{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .d{font-size:12px;color:var(--dim2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .sp{flex:1}
.tx .a{font-size:14.5px;font-weight:700;white-space:nowrap}
.tx .a.neg{color:var(--mint)}

/* ---- 彈出層（手機由下往上，電腦在右側） ---- */
#bd{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;
  transition:opacity .2s}
#bd.on{opacity:1;pointer-events:auto}
body.lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--slab);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line);max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(102%);
  transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:8px 15px calc(22px + var(--sb));
  -webkit-overflow-scrolling:touch}
#sh.on{transform:translateY(0)}
#sh .grip{width:38px;height:4px;border-radius:2px;background:#334052;margin:6px auto 12px}
#sh .shx{position:-webkit-sticky;position:sticky;top:0;float:right;z-index:2;width:32px;height:32px;margin:-4px -4px 6px 10px;
  border-radius:9px;background:var(--slab2);border:1px solid var(--line);color:var(--dim);font-size:14px}
#sh h3{margin:0 0 4px;font-size:18px;font-weight:800;line-height:1.35}

#toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translate(-50%,14px);z-index:60;
  background:#242f3f;border:1px solid var(--line);color:var(--txt);padding:10px 17px;border-radius:11px;
  font-size:13px;opacity:0;pointer-events:none;transition:all .22s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cpb{font-size:11px;padding:3px 8px;border-radius:5px;background:#26303f;border:1px solid var(--line);
  color:var(--brass);white-space:nowrap}
.empty{text-align:center;padding:44px 20px;color:var(--dim2)}
.empty .g{font-size:34px;opacity:.5}
.empty p{font-size:13px;margin:12px 0 0;line-height:1.7}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl th{color:var(--dim2);font-weight:600;font-size:12px}
.tbl .r{text-align:right}

/* ---- 平板：置中，限制寬度 ---- */
@media (min-width:600px){
  main{max-width:780px;margin:0 auto;padding:18px 22px}
  #hd .row{max-width:780px;margin:0 auto;padding:0 22px}
  #tabs{justify-content:center}
  #tabs button{flex:0 1 118px}
  #sh{max-width:640px;margin:0 auto}
  .chips.scroll{margin:0 -22px;padding:0 22px 2px}
  .cgrid,.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
  .cgrid>.crow,.bgrid>.bill{margin-bottom:0}
  .bgrid>.bill.open{grid-column:1/-1}
}

/* ---- 電腦：左側選單＋分欄 ---- */
@media (min-width:1024px){
  body{font-size:14.5px;padding-top:var(--hdh);padding-left:var(--side);padding-bottom:48px}
  #hd .row{max-width:none;margin:0;padding:0}
  #hd .brand{width:var(--side);flex:none;padding-left:24px}
  #hd .hin{max-width:var(--wmax);margin:0 auto;padding:0 32px}
  #hd .pg{display:block}
  #tabs{top:var(--hdh);bottom:0;right:auto;width:var(--side);flex-direction:column;justify-content:flex-start;
    border-top:0;border-right:1px solid var(--line);padding:16px 12px;gap:2px;background:var(--ink)}
  #tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;
    border-radius:10px;font-size:14.5px;color:var(--dim)}
  #tabs button .g{font-size:16px;width:20px;text-align:center}
  #tabs button:hover{background:var(--slab);color:var(--txt)}
  #tabs button.on{background:rgba(212,162,76,.12);color:var(--brass);font-weight:600}
  main{max-width:var(--wmax);margin:0 auto;padding:26px 32px}
  input,select,textarea{font-size:15px;padding:10px 12px}
  .cols{display:grid;gap:24px 28px;align-items:start}
  .cols.c1{grid-template-columns:minmax(0,1fr)}
  .cols.c66{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols.c75{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
  .cols.c84{grid-template-columns:minmax(0,8fr) minmax(0,4fr)}
  .cols.cform{grid-template-columns:minmax(340px,410px) minmax(0,1fr)}
  .cols.cform>.col:first-child{position:-webkit-sticky;position:sticky;top:calc(var(--hdh) + 20px);
    max-height:calc(100vh - var(--hdh) - 40px);overflow-y:auto}
  .sec+.cols,.cols+.sec{margin-top:24px}
  .col>.sec+.sec{margin-top:26px}
  .eyebrow{font-size:13.5px}
  .mut2{font-size:12.5px}
  .hero{padding:20px 22px 18px}
  .hero .big{font-size:46px}
  .bars{height:170px}
  .bar .bl{font-size:11px}
  .bar .bv{font-size:10px}
  .fsec .eyebrow{display:flex}
  .fcard{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:6px 16px 16px}
  .amtin{font-size:30px !important;padding:12px 14px}
  .chips.scroll{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
  .frow{display:flex;align-items:baseline;gap:12px}
  .flab{width:48px;flex:none;margin:0;text-align:right}
  .afilt{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
  .afilt>*+*{margin-top:0}
  .cdtop{display:flex;align-items:center;gap:16px;margin-bottom:18px}
  .cdq{flex:0 1 480px;margin:0}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .bgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .crow:hover,.bill:hover{border-color:#3b475b}
  .tx[onclick]:hover{background:rgba(255,255,255,.03)}
  .tx{padding:10px 6px}
  .tbl{font-size:13.5px}
  #sh{top:0;bottom:0;left:auto;right:0;width:560px;max-width:100%;max-height:none;margin:0;
    border-radius:0;border-top:0;border-left:1px solid var(--line);transform:translateX(102%);
    padding:20px 26px 32px}
  #sh.on{transform:translateX(0)}
  #sh .grip{display:none}
  #toast{bottom:28px;left:calc(50% + var(--side) / 2)}
}
@media (max-width:599.98px){
  .bar .bv{display:none}
  .bar.on .bv{display:block}
}
/* 大螢幕給寬一點 */
@media (min-width:1800px){
  :root{--wmax:1520px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<body>

<header id="hd"><div class="row">
  <div class="brand"><div class="ttl">卡務</div><div class="sub" id="hsub"></div></div>
  <div class="hin">
    <div class="pg" id="hpg"></div>
    <div class="sp"></div>
    <button class="ico" id="btnPriv" onclick="togglePriv()" title="隱私模式：遮住金額" aria-label="隱私模式">👁</button>
    <button class="ico" onclick="editCard('')" title="新增卡片" aria-label="新增卡片">＋</button>
  </div>
</div></header>

<main id="app"></main>

<nav id="tabs" aria-label="主選單">
  <button id="t_ov"  onclick="go('ov')"><span class="g">◎</span><span>總覽</span></button>
  <button id="t_cd"  onclick="go('cd')"><span class="g">▤</span><span>卡片</span></button>
  <button id="t_add" onclick="go('add')"><span class="g">✎</span><span>記帳</span></button>
  <button id="t_bl"  onclick="go('bl')"><span class="g">◆</span><span>帳單</span></button>
  <button id="t_an"  onclick="go('an')"><span class="g">▲</span><span>分析</span></button>
  <button id="t_st"  onclick="go('st')"><span class="g">⚙</span><span>設定</span></button>
</nav>

<div id="bd" onclick="closeSheet()"></div>
<div id="sh" role="dialog" aria-modal="true"><div class="grip"></div><button class="shx" onclick="closeSheet()" aria-label="關閉" title="關閉（Esc）">✕</button><div id="shc"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

/* ==================================================================
   卡務 Card Desk  v3.5
   單檔 PWA · ES5 · 資料存 localStorage · 雲端同步為選配
   v3.5：手機／電腦雙版面、取消 Gmail 逐筆記帳、帳單明細自動分類、紀錄可依銀行篩選
   v3.6：新增「電動車充電」分類；記帳頁可自訂期間（起迄）與搜尋銀行
   v3.7：帳單金額為 0 的銀行不再出現在「即將到期」
   v3.8：機構清單補齊台灣 45 家（未來申請新卡不用改程式）
   v3.9：認得簽帳金融卡（直接扣款，不佔額度、沒有帳單）
   v3.10：顯示各銀行的紅利點數／里程（每期新增與結餘）
   v3.11：卡片詳情可直接停用／恢復（停卡了但想留紀錄時用）
   v3.12：卡片頁依銀行分組時，各家底下直接看得到紅利點數
   v3.13：帳單頁不再列「沒帳單而且推估是 0」的銀行
   v3.14：帳單卡片可以點開看那一期的消費明細；即將到期不再列 0 元帳單
   v3.21：帳單明細改成跟著「印著它的那份帳單」歸期（以前看消費日，結帳後才入帳的會被算回上一期）；
          帳單卡片直接標出明細合計對不對得上帳單金額
   v3.20：已用額度改依帳單算（不再出現負的已用）；0 元帳單不再要你標記已繳、自動扣款過截止日算已扣；
          消費紀錄移到帳單頁（可選期別、點銀行看明細、跨期搜尋）；手機卡片頁依銀行收合；
          記帳的卡片可以搜尋；分析頁預設依帳單期、當月
   v3.19：電腦與手機自動同步：有改動就上傳（只送改了的），打開或切回畫面就抓最新；
          拿掉整份覆蓋的「上傳 ↑」，改成「立即同步」；清除資料只清這台
   v3.18：看得到每次自動匯入的結果（設定頁）；上次失敗或太久沒匯入時總覽會提醒

  var v=String(e.value==null?'':e.value).replace(/[^0-9.\-]/g,'');
  if(v==='' || isNaN(Number(v))) return dflt||0;

/* 額度一律以「元」儲存，只有輸入與顯示換算成「萬」 */
function wan(n){
  if(S.cfg.privacy) return '••萬';
  var v=(Number(n)||0)/10000, s;
  if(Math.abs(v)>=100) s=v.toFixed(0);
  else if(Math.abs(v)>=10) s=v.toFixed(1);
  else s=v.toFixed(2);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  return s+'萬';

function detectCard(name){
  var s=String(name||''), r={net:'',tier:'',tra:'',deb:DEBIT_KW.test(s)}, i;
  for(i=0;i<NET_KW.length;i++) if(NET_KW[i][1].test(s)){ r.net=NET_KW[i][0]; break; }
  for(i=0;i<TIER_KW.length;i++) if(TIER_KW[i][1].test(s)){ r.tier=TIER_KW[i][0]; break; }
  if(!r.tier) r.tier='一般卡';
  for(i=0;i<TRA_KW.length;i++) if(TRA_KW[i][1].test(s)){ r.tra=TRA_KW[i][0]; break; }

/* 共用額度池：同一家銀行且都勾了共用，額度只算一次（取最大值） */
function poolOf(c){
  if(!c || c.off || c.deb || !c.code)
    return {limit:Number(c&&!c.deb?c.limit:0)||0, used:c?usedOf(c):0, n:1, shared:false};
  var cs=creditCards(), L=0, n=0, i, cd=normCode(c.code);
  for(i=0;i<cs.length;i++){
    var x=cs[i];
    if(normCode(x.code)!==cd) continue;
    L=Math.max(L, Number(x.limit)||0); n++;
  }
  return {limit:L, used:useMap().b[cd]||0, n:n, shared:n>1};
}

/* ============ 消費分類 ============ */
var NO_SHOP = /帳單未列商店/;
var _catMemo = {}, _merMemo = {}, _ruleSorted = null;
/* 全形英數轉半形，比對時才不會因為全形字漏掉 */
function halfw(s){
  return String(s==null?'':s).replace(/[\uFF01-\uFF5E]/g, function(ch){
    return String.fromCharCode(ch.charCodeAt(0)-0xFEE0);
  }).replace(/\u3000/g,' ');
}
function normMer(s){
  var k=String(s==null?'':s);

  _merMemo[k]=v;
  return v;
}
/* 規則關鍵字：去頭尾空白、去掉開頭的 = + - @（試算表會當成公式） */
function cleanKw(v){
  return halfw(v).replace(/^[\s=+\-@]+/,'').replace(/\s+/g,' ').replace(/\s+$/,'').slice(0,40);
}
function catValid(k){ for(var i=0;i<CATS.length;i++){ if(CATS[i].k===k) return true; } return false; }
function isNoShop(m){ return !m || NO_SHOP.test(String(m)); }
function userRules(){
  if(_ruleSorted) return _ruleSorted;

    var r=rs[i];
    if(r && r.kw && r.cat && catValid(r.cat)) out.push({kw:r.kw, u:normMer(r.kw), cat:r.cat});
  }
  out.sort(function(a,b){ return b.u.length-a.u.length; });   /* 長的關鍵字比較精準，先比 */
  _ruleSorted = out;

}

/* 回傳 [分類, 依據, 命中的關鍵字]；依據：u＝你的規則、a＝內建判斷、''＝沒有對到 */

  s=halfw(s).replace(/^[A-Z]{1,3}-\s+/,'');              /* 永豐的 MA- / A- 前綴 */

function lastClose(c, ref){

}

}

}
function dueOf(c, closeDate){

}
/* 交易區間 (from, to] */
function sumRange(cid, from, to){

  for(var i=0;i<S.txns.length;i++){

    if(t.cid!==cid) continue;

  }

}
/* ============ 明細屬於哪一期（v3.21） ============
   帳單匯入的明細，歸到「印著它的那份帳單」那一期，不看消費日。
   結帳日當天或前幾天刷、結帳後才入帳的消費，還有沿用原消費日的退款，都印在下一期的帳單上；
   以前只看消費日落在哪個週期，這些會被算回上一期：這期明細少了幾筆，上一期多出來（應繳金額不受影響）。
   期別一律是「結帳日的年月」，跟帳單金額存的那一期同一個標準。
   ① 後端 v3.23 起每筆明細都記了那份帳單的結帳日（bc）→ 直接用。
   ② 舊資料沒有 bc：同一封帳單（src 的 pdf:<信件>）的明細一起看。帳單自己標的月份（cyc）跟結帳月的差，
      同一家是固定的（多半是 0；有的銀行把 2/21 結帳那期叫 1 月份，差 1）。每份帳單投一票（只收 −1～1）：
      沒有 bc 的投「最晚那筆消費落在的週期－標的月份」，有 bc 的投「bc 的月份－標的月份」（準確，算 3 票）；
      這家得票最多的就是差值（一樣多取 0；簽帳金融卡另外算），這份帳單的期別＝標的月份＋差值。
      只有晚入帳消費的那份（例如只有一筆 7/3 的 25 元）也不會被拉回上一期。
      推出來的那期沒有帳單金額、照消費日的那期卻有 → 這份標月份的方式跟同一家其他份不同，退回照消費日。
      推算只是過渡：解析器 --redo 跑過一次，舊明細就都有 bc 了。

var PMAP = null;          /* 明細 id → 期別（結帳日的年月）；資料一變（save）或重畫（render）就清掉 */
function ymOf(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1); }

function closeOn(c, d){

function stmtKey(t){

function bankKey(c){ return normCode(c.code) || ('C'+c.id); }
/* 投票分組：同一家的簽帳金融卡帳單另外算（標月份的方式可能跟信用卡不同） */
function votePool(c){ return bankKey(c) + (c.deb ? '/D' : ''); }
/* 這家「帳單標的月份」跟結帳月差幾個月的一票。只收 −1～1：
   差更多的是個案（只有分期列、沿用好幾個月前的消費日，或標的月份寫錯），不代表這家的叫法，不算票。 */
function perVote(V, bank, dv, w){
  if(dv < -1 || dv > 1) return;
  if(!V[bank]) V[bank]={'-1':0, '0':0, '1':0};
  V[bank][String(dv)] += w;
}
function perMap(){
  if(PMAP) return PMAP;
  var M={}, CM={}, ST={}, SL=[], EX={}, V={}, B={}, BM={}, OV=S.ovr||{}, i, j, t, c, d, ym, lab, bc, k, s, b, at, n0, n1, nm;
  for(i=0;i<S.cards.length;i++) CM[S.cards[i].id]=S.cards[i];
  /* 每家有帳單金額的月份。S.ovr 的鍵是「B<代碼>|…@結帳日」，沒有代碼的卡是「C<卡片 id>@結帳日」 */
  for(k in OV){
    if(!OV.hasOwnProperty(k)) continue;
    at=k.indexOf('@'); if(at<0) continue;
    b=k.charAt(0)==='B' ? k.slice(1, at).split('|')[0] : (k.charAt(0)==='C' ? k.slice(0, at) : '');
    if(!b) continue;
    if(!BM[b]) BM[b]={};
    BM[b][k.slice(at+1, at+8)]=1;
  }
  for(i=0;i<S.txns.length;i++){
    t=S.txns[i]; c=CM[t.cid]; bc=String(t.bc||''); lab=String(t.cyc||'').slice(0,7);
    if(!/^\d{4}-\d{2}$/.test(lab)) lab='';
    if(/^\d{4}-\d{2}-\d{2}/.test(bc)){                                                   /* ① */
      M[t.id]=ymOf(pd(bc));
      /* 有 bc 的帳單直接告訴我們這家「標的月份」跟結帳月差多少：給還沒補 bc 的舊明細當準確的一票 */
      k=stmtKey(t) || ('#'+t.id);
      if(c && lab && !EX[k]) EX[k]={pool:votePool(c), dv:ymDiff(M[t.id], lab)};
      continue;
    }
    if(!c) continue;
    d=pd(t.d);
    if(isNaN(d.getTime())) continue;
    ym=ymOf(closeOn(c, d));
    if(!lab){ M[t.id]=ym; continue; }                                                     /* ③ */
    k=stmtKey(t) || ('#'+t.id);                                                           /* ② */
    s=ST[k];
    if(!s){ s=ST[k]={lab:lab, top:ym, pool:votePool(c), bk:bankKey(c), deb:!!c.deb, ids:[]}; SL.push(s); }
    if(ym > s.top) s.top=ym;
    s.ids.push(t.id);
  }
  for(k in EX){ if(EX.hasOwnProperty(k)) perVote(V, EX[k].pool, EX[k].dv, 3); }
  for(i=0;i<SL.length;i++) perVote(V, SL[i].pool, ymDiff(SL[i].top, SL[i].lab), 1);
  /* 得票最多的；一樣多就取 0（大多數銀行） */
  for(b in V){
    if(!V.hasOwnProperty(b)) continue;
    n0=V[b]['0']; n1=V[b]['1']; nm=V[b]['-1'];
    B[b] = (n1 > n0 && n1 > nm) ? 1 : ((nm > n0 && nm > n1) ? -1 : 0);
  }
  for(i=0;i<SL.length;i++){
    s=SL[i]; ym=ymAdd(s.lab, B[s.pool] || 0);
    /* 推出來的那期沒有帳單金額、照消費日的那期卻有：這份帳單標月份的方式跟同一家其他份不一樣
       （例如主旨沒寫月份、改用結帳日），退回照消費日 */
    if(!s.deb && ym!==s.top && BM[s.bk] && !BM[s.bk][ym] && BM[s.bk][s.top]) ym=s.top;
    for(j=0;j<s.ids.length;j++) M[s.ids[j]]=ym;
  }
  PMAP=M;
  return M;
}
/* 這張卡在 ym 那一期（結帳日的年月）的明細合計 */
function perSum(cid, ym){
  var M=perMap(), s=0, i, t;
  for(i=0;i<S.txns.length;i++){ t=S.txns[i]; if(t.cid===cid && M[t.id]===ym) s += Number(t.a)||0; }
  return s;
}
/* 本期已結帳待繳（上次結帳那一期的明細）。有帳單實際金額時以帳單為準。 */
function ovrKey(c){ return c.id+'|'+cycKey(c); }
function stmtAmount(c){
  if(S.ovr && S.ovr[ovrKey(c)] !== undefined) return Number(S.ovr[ovrKey(c)])||0;
  return stmtEst(c);
}
function stmtEst(c){ return perSum(c.id, ymOf(lastClose(c))); }
function hasOvr(c){ return !!(S.ovr && S.ovr[ovrKey(c)] !== undefined); }
/* 未出帳（上次結帳 → 今天） */
function unbilled(c){ return sumRange(c.id, lastClose(c), today()); }

function cycKey(c){ return ds(lastClose(c)); }
function isPaid(c){
  var k = cycKey(c);
  for(var i=0;i<S.pays.length;i++){ if(S.pays[i].cid===c.id && S.pays[i].cyc===k) return S.pays[i]; }
  return null;
}

/* ============ 額度 ============ */
/* 已用額度以帳單為主（v3.20）：
   ① 最近一期（上次結帳）帳單還沒繳的部分 ＝ 帳單金額（有匯入用帳單，沒有就用明細推估）－ 這期已繳；
      自動扣款的帳單過了截止日視為已經扣款。
   ② 上次結帳之後的新消費（未出帳）。
   以前是「校準金額＋校準日之後的消費－校準日之後的繳款」：帳單匯入的消費常常早於校準日（不算），
   繳款卻在校準日之後（照扣），繳的比刷的多就變負數，可用額度比額度還多。
   手動校準還是可以用，但只在「金額不是 0、而且校準日在這期結帳之後」才算數 —— 代表剛從銀行 App 抄過，
   比帳單新。銀行 App 的已用額度是整個歸戶，所以校準以同一份帳單（同一家銀行）為單位。 */
var UMAP = null;                 /* 這一輪畫面的額度計算結果；資料一變（save）或重畫（render）就清掉 */
function paidSumG(g){
  var s=0, i, j;
  for(i=0;i<S.pays.length;i++){
    var p=S.pays[i];
    if(!sameCyc(p.cyc, g.cyc)) continue;
    for(j=0;j<g.cards.length;j++) if(g.cards[j].id===p.cid){ s += Number(p.a)||0; break; }
  }
  return s;
}
/* 自動扣款、還沒記繳款、已經過了截止日：當作銀行已經扣走了 */
function autoDone(g){ return !!(g.auto && !(g.paidSum > 0) && g.dd < 0 && g.amt > 0); }
function calibCard(g){
  var best=null, bt=0, i;
  for(i=0;i<g.cards.length;i++){
    var c=g.cards[i];
    if(!(Number(c.base) > 0) || !c.baseDate) continue;
    var bd=pd(c.baseDate);
    if(isNaN(bd.getTime()) || bd < g.lc) continue;
    if(!best || bd.getTime() > bt){ best=c; bt=bd.getTime(); }
  }
  return best;
}
function groupUse(g){
  var cb=calibCard(g), per={}, i, j, c, u;
  for(j=0;j<g.cards.length;j++) per[g.cards[j].id]=0;
  if(cb){
    var bd=pd(cb.baseDate);
    u = Number(cb.base)||0; per[cb.id] = u;
    for(i=0;i<S.txns.length;i++){
      var t=S.txns[i];
      if(per[t.cid]===undefined || !(pd(t.d) > bd)) continue;
      per[t.cid] += Number(t.a)||0; u += Number(t.a)||0;
    }
    for(i=0;i<S.pays.length;i++){
      var p=S.pays[i];
      if(per[p.cid]===undefined || !(pd(p.d) > bd)) continue;
      per[p.cid] -= Number(p.a)||0; u -= Number(p.a)||0;
    }
    /* 繳款記在這張、消費在另一張時，單張會算出負數：把正的部分按比例縮到剛好等於整家（加總不變） */
    var pos=0;
    for(j in per){ if(per.hasOwnProperty(j) && per[j] > 0) pos += per[j]; }
    if(u <= 0 || pos <= 0){ for(j in per){ if(per.hasOwnProperty(j)) per[j]=0; } u=0; }
    else{ for(j in per){ if(per.hasOwnProperty(j)) per[j] = per[j] > 0 ? per[j]*u/pos : 0; } }
    return {used:u, owed:0, ub:0, calib:cb, per:per};
  }
  var owed = (g.amt > 0 && !autoDone(g)) ? Math.max(0, g.amt - (g.paidSum||0)) : 0;
  var ub=0, tot=0;
  for(j=0;j<g.cards.length;j++) tot += Math.max(0, stmtEst(g.cards[j]));
  for(j=0;j<g.cards.length;j++){
    c=g.cards[j];
    var x=Math.max(0, unbilled(c));
    ub += x;
    per[c.id] = x + (tot > 0 ? owed*Math.max(0, stmtEst(c))/tot : (c===g.primary ? owed : 0));
  }
  return {used:owed+ub, owed:owed, ub:ub, calib:null, per:per};
}
function useMap(){
  if(UMAP) return UMAP;
  var gs=billGroups(), M={g:{}, c:{}, b:{}}, i, k;
  for(i=0;i<gs.length;i++){
    var u=groupUse(gs[i]), bk=gs[i].code || ('C'+gs[i].primary.id);
    M.g[gs[i].key]=u;
    M.b[bk]=(M.b[bk]||0)+u.used;
    for(k in u.per){ if(u.per.hasOwnProperty(k)) M.c[k]=u.per[k]; }
  }
  UMAP=M;
  return M;
}
/* 單張卡分到的已用：帳單未繳的部分照這期明細比例分給各張卡，加上自己的未出帳 */
function usedOf(c){
  var M=useMap();
  return (c && M.c[c.id]!==undefined) ? M.c[c.id] : 0;
}
function activeCards(){
  var a=[]; for(var i=0;i<S.cards.length;i++){ if(!S.cards[i].off) a.push(S.cards[i]); } return a;
}
/* 算額度、算帳單只看信用卡。簽帳金融卡是從存款扣的，算進去可用額度會憑空少一截。 */
function creditCards(){
  var a=[]; for(var i=0;i<S.cards.length;i++){ if(!S.cards[i].off && !S.cards[i].deb) a.push(S.cards[i]); } return a;
}
function totals(){
  var bk=byBank(), L=0, U=0, i;
  for(i=0;i<bk.length;i++){ L+=bk[i].limit; U+=bk[i].used; }
  return {limit:L, used:U, avail:L-U, pct: L>0 ? U/L*100 : 0};
}
/* 額度光譜的分段：共用池算一段，獨立卡各自一段 */
function pools(){
  var cs=creditCards(), out=[], seen={}, i;
  for(i=0;i<cs.length;i++){
    var c=cs[i];
    if(c.code){
      var k='s:'+c.code; if(seen[k]) continue; seen[k]=1;
      var P=poolOf(c);
      out.push({limit:P.limit, used:P.used, name:(bankName(c.code)||c.code), color:c.color});
    }else{
      out.push({limit:Number(c.limit)||0, used:usedOf(c), name:c.name, color:c.color});
    }
  }
  return out;
}
/* ============ 紅利點數 ============ */
/* 點數是「整家銀行」共用的，不是單張卡，所以用機構代碼查。 */
function ptRows(code){
  var c=normCode(code), out=[], i;
  if(!c) return out;
  for(i=0;i<S.points.length;i++){
    var x=S.points[i];
    if(normCode(x.code)!==c) continue;
    out.push({cyc:String(x.cyc||'').slice(0,7), name:String(x.name||'紅利'),
              unit:String(x.unit||''), prev:Number(x.prev)||0, add:Number(x.add)||0,
              adj:Number(x.adj)||0, used:Number(x.used)||0, bal:Number(x.bal)||0,
              ok:!(x.ok===0||x.ok==='0'||x.ok===false||x.ok==='FALSE')});
  }
  out.sort(function(a,b){ return a.cyc<b.cyc?1:(a.cyc>b.cyc?-1:0); });
  return out;
}
/* 每一種點數（台新Point、亞洲萬里通…）各取最新的那一期 */
function ptLatest(code){
  var rs=ptRows(code), seen={}, out=[], i;
  for(i=0;i<rs.length;i++){
    if(seen[rs[i].name]) continue;
    seen[rs[i].name]=1; out.push(rs[i]);
  }
  return out;
}
function ptNum(n){ return S.cfg.privacy ? '•••' : fmt(n); }
function ptLine(p){
  var d=p.add+p.adj-p.used;
  return '<span>'+esc(p.name)+' <b class="num" style="color:var(--txt)">'+ptNum(p.bal)+'</b>'+esc(p.unit)+'</span>'
    + '<span class="num" style="color:'+(d>0?'var(--mint)':(d<0?'var(--rose)':'var(--dim2)'))+'">'
    + (d>0?'+':'')+ptNum(d)+esc(p.unit)+'（'+esc(p.cyc.replace('-','/'))+'）'
    + (p.ok?'':' <span style="color:var(--amber)" title="上期＋新增＋調整－使用 對不上結餘">?</span>')+'</span>';
}
function pctColor(p){
  if(p>=90) return 'var(--rose)';
  if(p>=Number(S.cfg.warnPct||80)) return 'var(--amber)';
  return 'var(--mint)';
}

/* ============ 繳費群組 ============ */
/**
 * 同一家銀行是一張合併帳單：一個應繳金額、一個截止日、繳一次。
 * 群組鍵包含結帳/繳款日，萬一同行真的有兩種週期才會拆開。
 * 沒有機構代碼的卡各自獨立成一組。
 */
function billGroups(ref){
  var cs=creditCards(), map={}, order=[], i, j;
  for(i=0;i<cs.length;i++){
    var c=cs[i], code=normCode(c.code);
    var k = code ? ('B'+code+'|'+c.close+'|'+c.due+'|'+(c.dueNext?1:0)) : ('C'+c.id);
    if(!map[k]){
      map[k]={key:k, code:code, label: code ? bankLabel(code) : (c.name||'未命名'),
              cards:[], primary:c};
      order.push(k);
    }
    map[k].cards.push(c);
  }
  LIVEKEYS = {};
  for(i=0;i<order.length;i++) LIVEKEYS[order[i]]=1;
  /* ref：指定哪一天，就算「那一天所在的那期」（看以前的帳單用）；不給就是現在這一期 */
  var out=[], t=today();
  for(i=0;i<order.length;i++){
    var g=map[order[i]], p=g.primary;
    g.ref = ref || null;
    g.lc  = lastClose(p, ref);
    g.nc  = nextClose(p, ref);
    g.dueDate = dueOf(p, g.lc);
    g.cyc = ds(g.lc);
    g.dd  = dayDiff(t, g.dueDate);
    g.est = 0; g.unbilled = 0;
    for(j=0;j<g.cards.length;j++){
      var cj=g.cards[j];
      if(ref) g.est += perSum(cj.id, ymOf(lastClose(cj, ref)));
      else{ g.est += stmtAmount(cj); g.unbilled += unbilled(cj); }
    }
    var ov = ovrAmtG(g);
    g.hasOvr = (ov !== undefined);
    g.amt  = g.hasOvr ? ov : g.est;
    g.paid = paidOfG(g);
    g.paidSum = paidSumG(g);
    /* 自動扣款是整個歸戶一起扣的：同一家銀行只要有一張卡設了，整份帳單都會扣。
       以前要求每一張都勾才算，同一家 5 張卡只勾 1 張就不算，跟分析頁對不起來。 */
    g.auto = false;
    for(j=0;j<g.cards.length;j++) if(g.cards[j].auto) g.auto=true;
    /* 銷帳編號取該行第一張有填的卡 */
    g.acct = ''; g.acctCard = p;
    for(j=0;j<g.cards.length;j++){ if(g.cards[j].acct){ g.acct=g.cards[j].acct; g.acctCard=g.cards[j]; break; } }
    out.push(g);
  }
  out.sort(function(a,b){ if(a.paid&&!b.paid) return 1; if(!a.paid&&b.paid) return -1; return a.dd-b.dd; });
  return out;
}
function gByKey(k, ref){
  var gs=billGroups(ref), i;
  for(i=0;i<gs.length;i++) if(gs[i].key===k) return gs[i];
  return null;
}
function ovrKeyG(g){ return g.key+'@'+g.cyc; }
/* 這期的帳單金額。先找正確的鍵；找不到時，同一家銀行、同一個月的其他鍵也算 ——
   卡片的結帳日被帳單改過之後，以前的帳單金額是用舊的群組鍵存的，看以前的期別才找得到。 */
var LIVEKEYS = {};     /* 這一輪 billGroups 算出來、現在有效的群組鍵 */
/* 這期的帳單金額。先找正確的鍵；找不到時才看舊鍵。 */
function ovrAmtG(g){
  if(!S.ovr) return undefined;
  var k=ovrKeyG(g);
  if(S.ovr[k]!==undefined) return Number(S.ovr[k])||0;
  var kk=staleOvrKey(g);
  return kk===null ? undefined : (Number(S.ovr[kk])||0);
}
/* 舊鍵：卡片的結帳日／繳款日被帳單改過之後，以前的帳單金額留在舊的群組鍵底下。
   條件：同一家銀行、同一個月，而且「不是任何一個現存群組的鍵」——
   現存的另一組（同一家、繳款日不同）有自己的帳單金額，不能借來用。
   好幾個舊鍵就取期別日期離這一期最近的。 */
function staleOvrKey(g){
  if(!S.ovr || !g.code) return null;
  var pre='B'+g.code+'|', mon=String(g.cyc).slice(0,7), t0=pd(g.cyc).getTime(), best=null, bd=0, kk, at, d;
  for(kk in S.ovr){
    if(!S.ovr.hasOwnProperty(kk) || kk.indexOf(pre)!==0) continue;
    at=kk.indexOf('@');
    if(at<0 || kk.slice(at+1, at+8)!==mon || LIVEKEYS[kk.slice(0,at)]) continue;
    d=Math.abs(pd(kk.slice(at+1)).getTime()-t0);
    if(best===null || d<bd){ best=kk; bd=d; }
  }
  return best;
}
function hasOvrG(g){ return ovrAmtG(g)!==undefined; }
/* 週期鍵是「結帳日」的完整日期。卡片的結帳日會被帳單更新（v3.14 起），
   一改，舊繳款紀錄的鍵就對不上，已繳的帳單會變回未繳，使用者再按一次
   就多出一筆重複。比對只看年月就穩了 —— 一個月本來就只會結帳一次。 */
function sameCyc(a, b){ return String(a||'').slice(0,7) === String(b||'').slice(0,7); }
function paidOfG(g){
  var i,j;
  for(i=0;i<S.pays.length;i++){
    var p=S.pays[i];
    if(!sameCyc(p.cyc, g.cyc)) continue;
    for(j=0;j<g.cards.length;j++) if(g.cards[j].id===p.cid) return p;
  }
  return null;
}

/* ============ 版面：手機直排、電腦分欄 ============ */
var MQ = window.matchMedia ? window.matchMedia('(min-width: 1024px)') : null;
function isWide(){ return !!(MQ && MQ.matches); }
/* B：各區塊 HTML；mob：手機的排列順序；cols：電腦各欄的區塊；top：電腦版放在分欄上方、佔滿寬度的區塊 */
function lay(B, mob, cols, cls, top){
  var h='', i, j;
  if(!isWide()){
    for(i=0;i<mob.length;i++) h += B[mob[i]]||'';
    return h;
  }
  top = top || [];
  for(i=0;i<top.length;i++) h += B[top[i]]||'';
  var used=[];
  for(i=0;i<cols.length;i++){
    var part='';
    for(j=0;j<cols[i].length;j++) part += B[cols[i][j]]||'';
    if(part) used.push(part);
  }
  if(used.length<2) return h + (used[0] ? '<div class="cols c1"><div class="col">'+used[0]+'</div></div>' : '');
  h += '<div class="cols '+(cls||'c66')+'">';
  for(i=0;i<used.length;i++) h += '<div class="col">'+used[i]+'</div>';
  return h + '</div>';
}
var _wide = null;
function watchBreakpoint(){
  _wide = isWide();
  var fn = function(){
    var w = isWide();
    if(w === _wide) return;
    _wide = w;
    render();
  };
  if(MQ && MQ.addEventListener) MQ.addEventListener('change', fn);
  else if(MQ && MQ.addListener) MQ.addListener(fn);
}
function sec(title, body, cls){
  return '<section class="sec'+(cls?' '+cls:'')+'">'+(title?'<div class="eyebrow">'+title+'</div>':'')+body+'</section>';
}
function keepChips(){
  if(!document.querySelectorAll) return;
  var rows=document.querySelectorAll('.chips.scroll'), i;
  for(i=0;i<rows.length;i++){
    var on=rows[i].querySelector('.on');
    if(on && rows[i].scrollWidth > rows[i].clientWidth) rows[i].scrollLeft = Math.max(0, on.offsetLeft - 40);
  }
}

/* ============ 自動匯入紀錄 ============ */
/* runs 由後端依時間新→舊排好；欄位都是字串（試算表存成純文字） */
var RUN_STALE_DAYS = 8;      // 每週跑一次，超過 8 天沒跑就提醒
function lastRun(){ return S.runs && S.runs.length ? S.runs[0] : null; }
function runAge(r){
  var t = String(r && r.t || ''), d = pd(t.slice(0,10));
  return isNaN(d.getTime()) ? 999 : dayDiff(d, today());
}
function runBad(r){ return !!(r && (String(r.crash||'') || Number(r.upfail) > 0)); }
function runLine(r){
  var ok = !runBad(r);
  return '<div class="ln" style="margin-bottom:4px"><span><b style="color:'
    + (ok ? 'var(--mint)' : 'var(--rose)')+'">'+(ok ? '✓' : '✗')+'</b> '
    + esc(String(r.t||''))+'</span><span class="num mut2">'
    + (String(r.crash||'') ? '中途出錯'
       : (Number(r.bills)||0)+' 份帳單 · 新增 '+(Number(r.added)||0)+' 筆'
         + (Number(r.upfail) ? ' · <span style="color:var(--rose)">'+Number(r.upfail)+' 份沒送成功</span>' : ''))
    + '</span></div>'
    + (String(r.crash||'') ? '<div class="mut2" style="margin:-2px 0 6px 18px;color:var(--rose)">'+esc(String(r.crash))+'</div>' : '')
    + (String(r.note||'') ? '<div class="mut2" style="margin:-2px 0 6px 18px">'+esc(String(r.note))+'</div>' : '');
}
/* 總覽上方的提醒：只有出事或太久沒跑才出現，平常不佔位置 */
function runAlert(){
  var r = lastRun(); if(!r) return '';
  var age = runAge(r), msg = '';
  if(String(r.crash||'')) msg = '上次自動匯入（'+esc(String(r.t))+'）中途出錯，帳單可能沒更新。';
  else if(Number(r.upfail) > 0) msg = '上次自動匯入（'+esc(String(r.t))+'）有 '+Number(r.upfail)+' 份帳單沒送成功。';
  else if(age > RUN_STALE_DAYS) msg = '已經 '+age+' 天沒有自動匯入帳單了（上次是 '+esc(String(r.t))+'）。';
  if(!msg) return '';
  return sec('', '<div class="card" style="border-color:var(--rose)"><div style="color:var(--rose);font-weight:700">'
    + msg+'</div><div class="mut2" style="margin-top:6px">電腦上 logs 資料夾裡的「最近一次.txt」有完整紀錄。'
    + '<a href="#" onclick="go(\'st\');return false">看匯入紀錄 →</a></div></div>');
}

function vOverview(){
  if(!S.cards.length) return emptyState();
  var T = totals(), cs = activeCards(), i, B = {}, h;

  /* 額度光譜：每張卡一段，寬度 = 額度佔比，填色深度 = 使用率 */
  var band='', PL=pools();
  for(i=0;i<PL.length;i++){
    var q=PL[i], w = T.limit>0 ? q.limit/T.limit*100 : 0;
    var up = q.limit>0 ? Math.max(0,Math.min(100, q.used/q.limit*100)) : 0;
    var col = q.color || PALETTE[i%PALETTE.length];
    band += '<i style="width:'+w.toFixed(3)+'%;background:linear-gradient(90deg,'+col+' '+up.toFixed(1)+'%,#1b2331 '+up.toFixed(1)+'%)" title="'+esc(q.name)+'"></i>';
  }
  B.hero = sec('', '<div class="hero">'
    +  '<div class="lab">可用額度合計</div>'
    +  '<div class="big num">'+wan(T.avail)+'</div>'
    +  '<div class="band">'+band+'</div>'
    +  '<div class="legend"><span>已用 <b class="num">'+wan(T.used)+'</b></span>'
    +  '<span class="num" style="color:'+pctColor(T.pct)+'">'+T.pct.toFixed(1)+'%</span>'
    +  '<span>總額度 <b class="num">'+wan(T.limit)+'</b></span></div>'
    +  '<div class="stat3">'
    +    '<div><div class="k">本月消費</div><div class="v num">'+money(monthSpend(0))+'</div></div>'
    +    '<div><div class="k">上月消費</div><div class="v num" style="color:var(--dim)">'+money(monthSpend(-1))+'</div></div>'
    +    '<div><div class="k">卡片</div><div class="v num">'+cs.length+'<span style="font-size:12px;color:var(--dim2)"> 張</span></div></div>'
    +  '</div></div>');

  /* 依銀行彙總 */
  var bk = byBank();
  if(bk.length){
    h = '<div class="card tcard"><table class="tbl"><tr><th>機構</th><th class="r">卡</th>'
      + '<th class="r">額度</th><th class="r">可用</th></tr>';
    for(i=0;i<bk.length;i++){
      var b=bk[i], bp = b.limit>0 ? b.used/b.limit*100 : 0;
      h += '<tr><td>'+esc(b.label)+'</td>'
        +  '<td class="num r" style="color:var(--dim)">'+b.n+'</td>'
        +  '<td class="num r">'+wan(b.limit)+'</td>'
        +  '<td class="num r" style="color:'+pctColor(bp)+'">'+wan(b.limit-b.used)+'</td></tr>';
    }
    B.bank = sec('依銀行彙總<span class="ct">'+bk.length+' 家</span>', h + '</table></div>');
  }

  /* 即將到期 */
  var ups = upcoming(45);
  if(!ups.length){
    h = '<div class="card mut">未來 45 天沒有到期的帳單。</div>';
  }else{
    h = '<div class="bgrid">';
    for(i=0;i<ups.length && i<6;i++) h += billCard(ups[i], true);
    h += '</div>';
  }
  B.up = sec('即將到期<span class="ct">同一家銀行合併成一張</span>', h);

  /* 本月分類 */
  var cat = monthByCat();
  if(cat.length){
    h = '<div class="card">';
    var top = cat[0].v || 1;
    for(i=0;i<cat.length && i<6;i++){
      var it = cat[i], co = catOf(it.k);
      h += '<div class="crank"><span class="cg">'+co.g+'</span><span class="cn">'+co.n+'</span>'
        +  '<span class="cb"><span class="gauge"><i style="width:'+Math.max(0,Math.min(100,it.v/top*100)).toFixed(1)+'%;background:var(--brassd)"></i></span></span>'
        +  '<span class="cv num">'+money(it.v)+'</span></div>';
    }
    B.cat = sec('本月分類', h + '</div>');
  }

  /* 調額提醒 */
  var adj = adjSoon();
  if(adj.length){
    h = '';
    for(i=0;i<adj.length;i++){
      var a=adj[i], dd=dayDiff(today(), pd(a.adjNext));
      h += '<div class="card" style="display:flex;align-items:center;gap:10px">'
        + '<div><div style="font-size:14px;font-weight:700">'+esc(a.name)+'</div>'
        + '<div class="mut2">目前額度 '+wan(a.limit)+(a.adjDate?' · 上次申請 '+esc(a.adjDate):'')+'</div></div><div style="flex:1"></div>'
        + '<span class="pill '+(dd<=0?'c':'d')+'">'+(dd<=0?'現在可申請':dd+' 天後')+'</span></div>';
    }
    B.adj = sec('可申請調額', h);
  }
  B.run = runAlert();
  return lay(B, ['run','hero','bank','up','cat','adj'], [['hero','up','cat'],['bank','adj']], 'c75', ['run']);
}
function emptyState(){
  return '<div class="empty"><div class="g">▤</div>'
    + '<p>還沒有卡片。<br>先加一張，填額度、結帳日、繳款截止日，<br>其他都會自己算。</p>'
    + '<button class="btn" style="max-width:240px;margin:22px auto 0" onclick="editCard(\'\')">新增第一張卡</button></div>';
}
function cardMonth(c){
  var t=today(), a=new Date(t.getFullYear(),t.getMonth(),1),
      b=new Date(t.getFullYear(),t.getMonth()+1,0,23,59,59), s=0, i;
  for(i=0;i<S.txns.length;i++){
    var x=S.txns[i];
    if(x.cid!==c.id) continue;
    var d=pd(x.d);
    if(d>=a && d<=b) s += Number(x.a)||0;
  }
  return s;
}
function monthSpend(off){
  var t=today(), y=t.getFullYear(), m=t.getMonth()+off, s=0;
  var a=new Date(y,m,1), b=new Date(y,m+1,0,23,59,59);
  for(var i=0;i<S.txns.length;i++){ var d=pd(S.txns[i].d); if(d>=a && d<=b) s += Number(S.txns[i].a)||0; }
  return s;
}
function monthByCat(){
  var t=today(), a=new Date(t.getFullYear(),t.getMonth(),1), b=new Date(t.getFullYear(),t.getMonth()+1,0,23,59,59);
  var map={}, i;
  for(i=0;i<S.txns.length;i++){
    var x=S.txns[i], d=pd(x.d);
    if(d<a||d>b) continue;
    var k=txCat(x); map[k]=(map[k]||0)+(Number(x.a)||0);
  }
  var arr=[]; for(var k2 in map){ if(map.hasOwnProperty(k2)) arr.push({k:k2, v:map[k2]}); }
  arr.sort(function(p,q){ return q.v-p.v; });
  return arr;
}
function upcoming(days){
  var gs=billGroups(), out=[], i;
  for(i=0;i<gs.length;i++){
    var g=gs[i];
    if(g.dd > days) continue;
    /* 0 元就是沒東西要繳，不必提醒 —— 帳單就是 0、或這期根本沒消費，都一樣。
       （帳單頁仍然看得到「帳單金額 0」那種，用來確認帳單收到了） */
    if(!g.amt) continue;
    if(g.paid && g.dd < 0) continue;
    if(autoDone(g)) continue;          /* 自動扣款、過了截止日：銀行已經扣了 */
    out.push(g);
  }
  return out;
}
function adjSoon(){
  var cs=activeCards(), out=[], t=today();
  for(var i=0;i<cs.length;i++){
    var c=cs[i];
    if(!c.adjNext) continue;
    var dd=dayDiff(t, pd(c.adjNext));
    if(dd<=30) out.push(c);
  }
  return out;
}

function vCards(){
  if(!S.cards.length) return emptyState();
  /* 手機一律依銀行收合（同一家卡多時才不會一路滑不完），電腦才有「全部／依銀行」切換 */
  return '<div class="cdtop"><div class="cdq">'
    + '<input id="q" placeholder="搜尋銀行 / 卡名 / 末四碼" oninput="onSearch()" value="'+esc(vCards._q||'')+'">'
    + '<button class="ico big" onclick="editCard(\'\')" title="新增卡片" aria-label="新增卡片">＋</button></div>'
    + (isWide() ? '<div class="chips" id="cdchips">'+chipsHTML()+'</div>' : '')+'</div>'
    + '<div id="cdlist">'+cardListHTML()+'</div>';
}
function chipsHTML(){
  return '<button class="chip'+(S.cfg.groupBank?'':' on')+'" onclick="setGroup(0)">全部卡片</button>'
    +  '<button class="chip'+(S.cfg.groupBank?' on':'')+'" onclick="setGroup(1)">依銀行分組</button>';
}
/* 只重畫列表，不動輸入框 —— 整頁 innerHTML 會讓輸入框失焦、鍵盤收起 */
function onSearch(){
  var e=$('q'); if(!e) return;
  vCards._q = String(e.value||'').toLowerCase();
  var box=$('cdlist'); if(box) box.innerHTML = cardListHTML();
}
function setGroup(v){
  S.cfg.groupBank = !!v; save();
  var c=$('cdchips'); if(c) c.innerHTML = chipsHTML();
  var box=$('cdlist'); if(box) box.innerHTML = cardListHTML();
}
var CDOPEN = {};               /* 手機版卡片頁：展開了哪幾家銀行（只記在這次打開的畫面） */
function toggleBank(k){
  CDOPEN[k] = !CDOPEN[k];
  var box=$('cdlist'); if(box) box.innerHTML = cardListHTML();
}
function cardListHTML(){
  var h='', q=String(vCards._q||'').toLowerCase(), acc=!isWide();
  var cs = [], i, j;
  for(i=0;i<S.cards.length;i++){
    var c0=S.cards[i];
    if(q){
      var hay = ((c0.name||'')+(c0.last4||'')+(c0.code||'')+bankName(c0.code)+(c0.note||'')).toLowerCase();
      if(hay.indexOf(q)<0) continue;
    }
    cs.push(c0);
  }
  if(!cs.length) return '<div class="empty"><p>沒有符合的卡片。<br>換個關鍵字，或按 ＋ 新增一張。</p></div>';

  if(!acc && !S.cfg.groupBank){
    cs.sort(function(a,b){ return (a.off?1:0)-(b.off?1:0) || (Number(b.limit)||0)-(Number(a.limit)||0); });
    h = '<div class="cgrid">';
    for(i=0;i<cs.length;i++) h += cardRow(cs[i], i, true);
    /* 不分組時看不到銀行標頭，就把各家點數收在列表下方一塊 */
    return h + '</div>' + ptSummary(cs);
  }

  /* 依銀行分組：每家一個標頭，附該行卡數與額度合計 */
  var map={}, keys=[];
  for(i=0;i<cs.length;i++){
    var c=cs[i], k=c.code || ('?'+(c.name||'未分類').slice(0,3));
    if(!map[k]){ map[k]={label:bankLabel(c.code), list:[], limit:0, max:0, ind:0, used:0}; keys.push(k); }
    map[k].list.push(c);
    if(!c.off){
      /* 與總覽同一套規則：同行取最大值，未設機構的卡各自獨立 */
      if(normCode(c.code)) map[k].max = Math.max(map[k].max, Number(c.limit)||0);
      else map[k].ind += Number(c.limit)||0;
      map[k].used += usedOf(c);
    }
  }
  for(i=0;i<keys.length;i++){ map[keys[i]].limit = map[keys[i]].max + map[keys[i]].ind; }
  keys.sort(function(a,b){ return map[b].limit - map[a].limit; });
  for(i=0;i<keys.length;i++){
    var g=map[keys[i]], gp = g.limit>0 ? g.used/g.limit*100 : 0;
    /* 點數是整家銀行共用的，所以放在銀行標頭下、卡片之上 */
    var pts='', gpts = ptLatest(keys[i]), gk;
    for(gk=0;gk<gpts.length;gk++)
      pts += '<div class="ln" style="margin:'+(gk?'3px':'2px')+' 2px 7px">'+ptLine(gpts[gk])+'</div>';
    g.list.sort(function(a,b){ return (a.off?1:0)-(b.off?1:0) || (Number(b.limit)||0)-(Number(a.limit)||0); });
    var rows = '<div class="cgrid">';
    for(j=0;j<g.list.length;j++) rows += cardRow(g.list[j], j);
    rows += '</div>';
    if(acc){
      /* 搜尋時把有符合的銀行都打開，不然看不到結果 */
      var open = q ? true : !!CDOPEN[keys[i]];
      h += '<section class="sec bk'+(open?' open':'')+'">'
        +  '<button class="bkh" onclick="toggleBank(\''+jsq(keys[i])+'\')" aria-expanded="'+(open?'true':'false')+'">'
        +  '<span class="bkn">'+esc(g.label)+'</span><span class="bkc">'+g.list.length+' 張</span><span class="sp"></span>'
        +  '<span class="bka num" style="color:'+pctColor(gp)+'">可用 '+wan(g.limit-g.used)+'</span>'
        +  '<span class="chev">'+(open?'▾':'▸')+'</span></button>'
        +  (open ? pts + rows : '') + '</section>';
    }else{
      h += sec(esc(g.label), '<div class="ghead legend"><span>'+g.list.length+' 張 · 額度 <b class="num">'+wan(g.limit)+'</b></span>'
        +  '<span style="color:'+pctColor(gp)+'">可用 '+wan(g.limit-g.used)+'</span></div>' + pts + rows);
    }
  }
  return h;
}
function cardRow(c, i, full){
  var P=poolOf(c), lim=P.limit, u=P.used, p = lim>0 ? u/lim*100 : 0, mine=usedOf(c);
  var col = c.color || PALETTE[i%PALETTE.length];
  var lc=lastClose(c), nc=nextClose(c), du=dueOf(c,lc), t=today();
  var ub=unbilled(c), st=stmtAmount(c), paid=isPaid(c);

  /* 週期軌：上次結帳 → 下次結帳，繳款截止標紅 */
  var span = dayDiff(lc, nc) || 30;
  var nowP = Math.max(0, Math.min(100, dayDiff(lc, t)/span*100));
  var dueP = dayDiff(lc, du)/span*100;
  var trk = '<div class="trk"><div class="rail"></div>'
    + '<div class="fill" style="width:'+nowP.toFixed(1)+'%;background:'+col+'88"></div>'
    + '<div class="pt" style="left:0"></div><div class="pt" style="left:100%"></div>'
    + (dueP>=0 && dueP<=105 ? '<div class="pt due" style="left:'+Math.min(100,dueP).toFixed(1)+'%"></div>' : '')
    + '<div class="now" style="left:'+nowP.toFixed(1)+'%"></div></div>'
    + '<div class="trkl"><span>結帳 '+md(lc)+'</span>'
    + '<span style="color:var(--rose)">繳款 '+md(du)+(paid?' ✓':'')+'</span>'
    + '<span>結帳 '+md(nc)+'</span></div>';

  return '<div class="crow" onclick="openCard(\''+c.id+'\')">'
    + '<div class="stripe" style="background:'+col+(c.off?';opacity:.3':'')+'"></div>'
    + '<div class="top"><span class="nm">'+esc(full ? cardTitle(c) : (c.name||'未命名'))+'</span>'
    + '<span class="l4">•'+esc(c.last4||'····')+'</span>'
    + (c.off?'<span class="pill d" style="margin-left:4px" title="不計入總額度，紀錄仍保留">停用</span>':'')
    + '<span class="sp"></span>'
    + (c.deb ? '<span class="amt num" style="color:var(--dim)" title="簽帳金融卡不佔信用額度">簽帳</span>'
             : (c.off ? '<span class="amt num" style="color:var(--dim)" title="停用的卡不計入總額度">停用</span>'
                      : '<span class="amt num" style="color:'+pctColor(p)+'">'+wan(lim-u)+'</span>')) + '</div>'
    + '<div class="tags">'
    + (c.net?'<span class="tg net">'+esc(c.net)+'</span>':'')
    + (c.tier&&c.tier!=='一般卡'?'<span class="tg hi">'+esc(c.tier)+'</span>':'')
    + (c.tra&&c.tra!=='無'?'<span class="tg'+(c.traOn?' ok':'')+'">'+esc(c.tra)+(c.traOn?' 已啟用':' 未啟用')+'</span>':'')
    + (c.deb?'<span class="tg hi">簽帳金融卡</span>':'')
    + (c.auto&&!c.deb?'<span class="tg ok">自動扣款</span>':'')
    + (c.exp?'<span class="tg'+(expSoon(c)?' warn':'')+'">'+esc(expIn(c.exp))+' 到期</span>':'')
    + '</div>'
    /* 簽帳金融卡沒有額度也沒有帳單週期，那些欄位對它沒有意義 */
    + (c.deb
      ? '<div class="ln" style="margin-top:9px"><span>本月消費 <b class="num" style="color:var(--txt)">'
        + money(cardMonth(c))+'</b></span><span>刷卡直接從存款帳戶扣款</span></div>'
      : '<div class="gauge"><i style="width:'+Math.max(0,Math.min(100,p)).toFixed(1)+'%;background:'+pctColor(p)+'"></i></div>'
        + '<div class="ln"><span>已用 <b class="num" style="color:var(--txt)">'+wan(u)+'</b> / '+wan(lim)+'</span>'
        + '<span>'+p.toFixed(0)+'%</span></div>'
        + (P.shared?'<div class="ln" style="margin-top:3px;color:var(--dim2)"><span>本卡已用 '+money(mine)+'</span><span>同行 '+P.n+' 張</span></div>':'')
        + '<div class="track">'+trk
        + '<div class="ln" style="margin-top:8px"><span>本期未出帳 <b class="num" style="color:var(--txt)">'+money(ub)+'</b></span>'
        + '<span>本卡本期 <b class="num" style="color:'+(paid?'var(--mint)':'var(--txt)')+'">'+money(st)+'</b></span></div>'
        + '</div>')
    + '</div>';
}

/* ============ 視圖：記帳 ============ */

/* 常用的卡排前面：手動記過的權重大，帳單明細多的次之 */
function pickOrder(cs){
  var w={}, i, t;
  for(i=0;i<S.txns.length;i++){
    t=S.txns[i];
    w[t.cid]=(w[t.cid]||0) + (t.src ? 1 : 5);
  }
  var arr=cs.slice(0);
  arr.sort(function(a,b){ return (w[b.id]||0)-(w[a.id]||0) || (Number(b.limit)||0)-(Number(a.limit)||0); });
  return arr;
}
function cardHay(c){
  return (String(c.name||'')+' '+String(c.last4||'')+' '+normCode(c.code)+' '+bankLabel(c.code)+' '+String(c.note||'')).toUpperCase();
}
function cardPickHTML(){
  var cs=activeCards(), q=String(DRAFT.cq||'').toUpperCase().replace(/^\s+|\s+$/g,''), list=[], i, h='';
  var sel=byId(S.cards, DRAFT.cid);
  if(q){
    var parts=q.split(/\s+/);
    for(i=0;i<cs.length;i++){
      var hay=cardHay(cs[i]), ok=true, j;
      for(j=0;j<parts.length;j++) if(hay.indexOf(parts[j])<0){ ok=false; break; }
      if(ok) list.push(cs[i]);
    }
  }else{
    list = pickOrder(cs).slice(0, 8);
    if(sel && list.indexOf(sel)<0) list.unshift(sel);
  }
  if(sel) h += '<div class="mut2 csel">已選：<b style="color:var(--brass)">'+esc(cardTitle(sel))+'</b> ·'+esc(sel.last4||'····')+'</div>';
  h += '<div class="chips cpk">';
  for(i=0;i<list.length && i<24;i++){
    var c=list[i];
    h += '<button class="chip'+(sel && c.id===sel.id?' on':'')+'" onclick="pickCard(\''+jsq(c.id)+'\')">'
      +  esc(cardTitle(c))+'<span class="n">'+esc(c.last4||'')+'</span></button>';
  }
  h += '</div>';
  if(q && !list.length) h += '<div class="mut2" style="margin-top:6px">沒有符合「'+esc(DRAFT.cq)+'」的卡片。</div>';
  else if(!q && cs.length > list.length) h += '<div class="mut2" style="margin-top:6px">常用的 '+list.length+' 張；其他 '+(cs.length-list.length)+' 張打字搜尋。</div>';
  return h;
}
/* 只重畫卡片清單，不動輸入框（注音打到一半才不會被打斷） */
function pickQ(v){ DRAFT.cq=v; var b=$('a_clist'); if(b) b.innerHTML=cardPickHTML(); }
function pickCard(id){

function manualRecentHTML(){

function pickCat(k, el){ DRAFT.cat=k; markChip(el); }
function srcTag(t){

/* ============ 視圖：帳單 ============ */
var BILLV = {per:'', q:'', open:{}};   /* 帳單頁：per＝期別（空＝本期；'2026-09'＝那個月結帳的那期）、q＝搜尋、open＝展開明細的銀行 */
function perRef(per){ return per ? cycRef(per) : null; }
/* 有資料的帳單期（帳單金額、帳單明細、繳款紀錄），新的在前，只到這個月 */
function billMonths(){
  var set={}, k, i, out=[], m, cur=ds(today()).slice(0,7), PM=perMap();
  for(k in S.ovr){
    if(!S.ovr.hasOwnProperty(k)) continue;
    var at=k.indexOf('@'); if(at<0) continue;
    m=k.slice(at+1, at+8); if(/^\d{4}-\d{2}$/.test(m)) set[m]=1;
  }
  /* 帳單匯入的明細（有 cyc 或 bc）照它歸到的那一期；手動記帳不產生期別 */
  for(i=0;i<S.txns.length;i++){
    if(!S.txns[i].cyc && !S.txns[i].bc) continue;
    m=String(PM[S.txns[i].id]||''); if(/^\d{4}-\d{2}$/.test(m)) set[m]=1;
  }
  for(i=0;i<S.pays.length;i++){ m=String(S.pays[i].cyc||'').slice(0,7); if(/^\d{4}-\d{2}$/.test(m)) set[m]=1; }
  for(k in set){ if(set.hasOwnProperty(k) && k<=cur) out.push(k); }
  out.sort(); out.reverse();
  return out;
}

function billBodyHTML(){
  if(String(BILLV.q||'').replace(/\s/g,'')) return billSearchHTML();
  var per=BILLV.per, all=billGroups(perRef(per)), list=[], quiet=0, quietNames=[], notYet=0, B={}, i, h;
  var td=today();
  for(i=0;i<all.length;i++){
    /* 看當月時，結帳日還沒到的那家，這一期還沒出帳單 —— 不是 0 元，也不要把它算進來 */
    if(per && all[i].lc > td){ notYet++; continue; }
    /* 這期沒收到帳單、推估也是 0 → 沒東西可看也沒東西要繳，收起來。
       帳單真的出來、金額是 0 的要留著，那是用來確認「帳單收到了、這期不用繳」。 */
    if(!all[i].amt && !all[i].hasOvr && !all[i].paid){ quiet++; quietNames.push(all[i].label); continue; }
    list.push(all[i]);
  }
  if(!list.length){
    B.list = sec('', '<div class="empty"><p>'+(per ? cycLabel(per)+' 期沒有任何帳單。' : '這期還沒有任何帳單。')+'<br>'
      + (quiet ? quiet+' 家這期沒有消費紀錄。' : '匯入後會自動同步過來。')

  }else{

    for(i=0;i<list.length;i++){

      /* 已繳的也要算 —— 以前只數未繳的，所以越標記已繳、自動扣款家數就越少 */

        +  '<div class="legend" style="margin-top:10px"><span>本期 '+list.length+' 家有帳單'
        +  (autoN?' · 其中 '+autoN+' 家自動扣款':'')+'</span>'
        +  '<span><a href="'+PAY_DEFAULT+'" target="_blank" rel="noopener">開啟 e-Bill 繳信用卡費 ↗</a></span></div></div>');
    }else{
      B.hero = sec('', '<div class="hero"><div class="lab">'+esc(cycLabel(per))+' 期帳單合計</div>'
        +  '<div class="big num" style="color:var(--brass)"><small>NT$</small>'+money(tot)+'</div>'
        +  '<div class="legend" style="margin-top:10px"><span>'+list.length+' 家有帳單'
        +  (autoN?' · 其中 '+autoN+' 家自動扣款':'')+'</span>'
        +  '<span>'+(unpaid ? '還沒繳 NT$'+money(unpaid) : '都處理完了')+'</span></div></div>');
    }
    h = '<div class="bgrid">';
    for(i=0;i<list.length;i++) h += billCard(list[i], false);
    B.list = sec('各行帳單<span class="ct">'+list.length+' 家</span>', h + '</div>'
      + (quiet ? '<div class="mut2" style="margin-top:8px">另有 '+quiet
         +' 家這期沒有帳單也沒有消費，已收起來：'+esc(quietNames.join('、'))+'</div>' : '')
      + (notYet ? '<div class="mut2" style="margin-top:8px">另有 '+notYet+' 家這個月還沒結帳，帳單出來後才會列在這裡。</div>' : ''));
  }
  B.pays = paysHTML(per);

/* 跨所有帳單期找消費：商店、備註、卡名、末四碼、銀行都比對，空白分開的每個字都要符合 */
function billSearchHTML(){
  var q=String(BILLV.q||'').toUpperCase().replace(/^\s+|\s+$/g,''), parts=q.split(/\s+/), out=[], CM={}, i, j, sum=0;
  for(i=0;i<S.cards.length;i++) CM[S.cards[i].id]=S.cards[i];
  for(i=0;i<S.txns.length;i++){
    var t=S.txns[i], c=CM[t.cid], ok=true;
    var hay=(String(t.m||'')+' '+String(t.n||'')+' '+(c ? cardHay(c) : '')).toUpperCase();
    for(j=0;j<parts.length;j++) if(hay.indexOf(parts[j])<0){ ok=false; break; }
    if(ok){ out.push(t); sum += Number(t.a)||0; }
  }
  out.sort(function(a,b){ return a.d<b.d?1:(a.d>b.d?-1:(a.id<b.id?1:-1)); });
  var h='<div class="stat3 sum"><div><div class="k">符合</div><div class="v num">'+out.length+' 筆</div></div>'
    + '<div><div class="k">合計</div><div class="v num" style="color:var(--brass)">'+money(sum)+'</div></div></div>'
    + '<div class="card txl">';
  if(!out.length) h += '<div class="mut2" style="padding:14px 0">沒有符合「'+esc(BILLV.q)+'」的消費。</div>';
  for(i=0;i<out.length && i<200;i++) h += txRow(out[i]);
  h += '</div>';
  if(out.length>200) h += '<div class="mut2" style="margin-top:8px">只列最近 200 筆（共 '+out.length+' 筆），關鍵字打長一點可以縮小範圍。</div>';
  return sec('搜尋結果', h);
}

  var o=[], i;
  for(i=0;i<S.pays.length;i++) if(!(Number(S.pays[i].a) > 0)) o.push(S.pays[i]);

}

      +  '它不影響額度，但會把那一期標成已繳。</div>'

        + '<div class="sp"></div><div class="a num" style="color:'+(zero?'var(--amber)':'var(--mint)')+'">-'+money(p.a)+'</div>'
        + '<button class="ico" style="width:28px;height:28px;font-size:13px;margin-left:8px" onclick="event.stopPropagation();delPay(\''+jsq(p.id)+'\')" aria-label="刪除這筆繳款">✕</button></div>';
    }
    h += '</div>';

    h += '<div class="mut2">'+esc(cycLabel(per))+' 期沒有繳款紀錄。</div>';

/* 0 元繳款紀錄要怎麼處理：那期帳單有金額 → 改成帳單金額（當作那期繳清）；帳單 0 元 → 刪掉 */
function zeroPlan(p, claimed){
  var c=byId(S.cards,p.cid), g0=c ? groupOfCard(c.id) : null, ref=cycRef(p.cyc), gs, g=null, i, gk;
  if(!g0 || !ref) return {act:'keep', why:'找不到對應的帳單，先不動'};
  gs=billGroups(ref);
  for(i=0;i<gs.length;i++) if(gs[i].key===g0.key) g=gs[i];
  if(!g) return {act:'keep', why:'找不到對應的帳單，先不動'};
  /* 帳單還沒匯入：金額只能猜。刪了的話帳單進來後那期會變回「未繳」，改了金額又是猜的，所以先不動 */
  if(!g.hasOvr) return {act:'keep', why:'那期帳單還沒匯入，先不動'};
  if(g.amt <= 0) return {act:'del', why:'那期帳單 0 元，不需要繳款紀錄'};
  gk = g.key+'@'+g.cyc;
  /* 那期已經有真的繳款（或同一期另一筆 0 元的已經要改成帳單金額了）：這筆是多的，改了就變成繳兩次 */
  if(g.paidSum > 0 || (claimed && claimed[gk]))
    return {act:'del', gk:gk, why:'那期已經有繳款紀錄，這筆 0 元的是多的'};
  return {act:'set', gk:gk, a:Math.round(g.amt), why:'那期帳單 NT$'+fmt(Math.round(g.amt))};
}
/* 全部 0 元紀錄的整理計畫（同一期有好幾筆 0 元的，只改第一筆，其餘刪掉） */
function zeroPlans(){
  var zs=zeroPays(), claimed={}, out=[], i, pl;
  for(i=0;i<zs.length;i++){
    pl=zeroPlan(zs[i], claimed);
    if(pl.act==='set') claimed[pl.gk]=1;
    out.push({p:zs[i], pl:pl});
  }
  return out;
}
function zeroSheet(){
  var plans=zeroPlans(), i, nSet=0, nDel=0;
  var h='<h3>整理 0 元的繳款紀錄</h3>'
    + '<div class="mut2" style="line-height:1.7">帳單有金額、那期還沒有繳款紀錄的，改成那期的帳單金額（當作那期繳清了）；'
    + '帳單本來就是 0 元的、或那期已經有別筆繳款的，直接刪掉；帳單還沒匯入的先不動。整理完還是可以一筆一筆改或刪。</div>'

      +  '<div class="a num" style="color:'+(pl.act==='set'?'var(--mint)':(pl.act==='del'?'var(--rose)':'var(--dim)'))+'">'
      +  (pl.act==='set' ? '改成 '+fmt(pl.a) : (pl.act==='del' ? '刪除' : '不動'))+'</div></div>';

function fixZeroPays(){
  var plans=zeroPlans(), keep=[], drop={}, i, nSet=0, nDel=0;
  for(i=0;i<plans.length;i++){
    var p=plans[i].p, pl=plans[i].pl;
    if(pl.act==='set'){ p.a=pl.a; p.n=(p.n ? p.n+' · ' : '')+'金額依帳單補上'; nSet++; }
    else if(pl.act==='del'){ drop[p.id]=1; nDel++; }
  }
  for(i=0;i<S.pays.length;i++){ if(drop[S.pays[i].id]) tomb(S.pays[i].id); else keep.push(S.pays[i]); }
  S.pays=keep; save(); closeSheet(); render();
  toast('已整理：改 '+nSet+' 筆、刪 '+nDel+' 筆');
}
/* 2026-09-05 → 2026/09。帳單上的「期別」就用結帳日的年月，一個月一期。 */

function billCard(g, compact){

      var pts = ptLatest(g.code), pi;

           : '')

    h += '<div class="brow" style="margin-top:10px"><button class="btn sm ghost" onclick="ebillG(\''+gk+'\','+g.amt+')">去繳費 ↗</button>'
      +  (g.paid?'':'<button class="btn sm" onclick="payNowG(\''+gk+'\','+g.amt+')">標記已繳</button>')+'</div>';
  }
  return h+'</div>';

/* 帳單卡片裡展開的明細：同一家有好幾張卡就逐卡分開，各附小計 */
function billTxHTML(g, ts, tsum){
  var h='<div class="bxl">', i, j;
  if(!ts.length)
    return h + '<div class="mut2" style="padding:10px 2px">這一期沒有消費明細。'+(g.ref?'':'帳單匯入後會自動出現。')+'</div></div>';
  if(g.hasOvr && Math.round(tsum)!==Math.round(g.amt))
    h += '<div class="mut2" style="margin:6px 2px 0;color:var(--amber)">明細合計跟帳單差 '+money(g.amt-tsum)
      +  '（帳單另有分期、循環利息、年費或外幣匯差時會有落差）</div>';
  if(g.cards.length>1){
    for(j=0;j<g.cards.length;j++){
      var cc=g.cards[j], sub=[], s=0;
      for(i=0;i<ts.length;i++) if(ts[i].cid===cc.id){ sub.push(ts[i]); s+=Number(ts[i].a)||0; }
      if(!sub.length) continue;
      h += '<div class="bxc"><span>'+esc(cc.name)+' <span class="num">•'+esc(cc.last4||'····')+'</span></span>'
        +  '<span class="num">'+sub.length+' 筆 · '+money(s)+'</span></div>';
      for(i=0;i<sub.length;i++) h += txRow(sub[i]);
    }
  }else{
    for(i=0;i<ts.length;i++) h += txRow(ts[i]);
  }
  return h+'</div>';
}

/* ============ 視圖：分析 ============ */
var ANV = {y:0, m:null, byCyc:true};  /* 分析頁：預設當月、依帳單期（v3.20）；m=-1 看整年 */
function setAnY(yy){
  var t=today();
  ANV.y=yy;
  if(yy===t.getFullYear() && ANV.m > t.getMonth()) ANV.m=t.getMonth();
  render();
}

/* 這筆屬於哪一期：依帳單期（銀行結帳週期）或依消費日 */
function txKey(t){
  /* 依帳單期時只認「從電子帳單匯入」的資料。手動記的帳沒有帳單期，
     以前會退回用消費日，結果混進帳單期的桶子裡，金額就比帳單多。 */
  if(ANV.byCyc) return String(t.cyc||'').slice(0,7);
  return String(t.d||'').slice(0,7);
}
function txAgg(ym1, ym2){
  var out={total:0, n:0, spend:0, refund:0, rebate:0, cat:{}, card:{}}, i;
  for(i=0;i<S.txns.length;i++){
    var t=S.txns[i], k=txKey(t);
    if(!k || k<ym1 || k>ym2) continue;
    var a=Number(t.a)||0, ck=txCat(t);
    out.total+=a; out.n++;
    if(a>=0) out.spend+=a;
    else if(t.kind==='回饋') out.rebate+=a;
    else out.refund+=a;
    out.cat[ck]=(out.cat[ck]||0)+a;
    out.card[t.cid]=(out.card[t.cid]||0)+a;
  }
  return out;
}
function ym(y,m){ return y+'-'+p2(m+1); }
function rank(obj){
  var arr=[], k;
  for(k in obj){ if(obj.hasOwnProperty(k)) arr.push({k:k, v:obj[k]}); }
  arr.sort(function(a,b){ return b.v-a.v; });
  return arr;
}
function vAnalysis(){
  if(!S.txns.length && !S.cards.length) return emptyState();
  var t=today(), i, B={}, h;
  if(!ANV.y) ANV.y=t.getFullYear();
  if(ANV.m===null) ANV.m=t.getMonth();
  /* 今年只列到這個月；以前的年份 12 個月都列 */
  var lastM = (ANV.y===t.getFullYear()) ? t.getMonth() : 11;
  var y=ANV.y, m=ANV.m;

  /* 年度區間 vs 單月區間 */
  var from = (m<0) ? ym(y,0)  : ym(y,m);
  var to   = (m<0) ? ym(y,11) : ym(y,m);
  var A = txAgg(from, to);

  /* 年份切換：沒有帳單期的紀錄（手動記帳）不產生空白的年份按鈕 */
  var years={}, yl=[];
  for(i=0;i<S.txns.length;i++){
    var yy=txKey(S.txns[i]).slice(0,4);
    if(/^\d{4}$/.test(yy)) years[yy]=1;
  }
  years[String(t.getFullYear())]=1;
  for(var k in years){ if(years.hasOwnProperty(k)) yl.push(k); }
  yl.sort(function(a,b){ return b-a; });

  h = '<div class="afilt"><div class="chips">';
  for(i=0;i<yl.length;i++)
    h += '<button class="chip'+(String(y)===yl[i]?' on':'')+'" onclick="setAnY('+yl[i]+')">'+yl[i]+'</button>';
  h += '</div><div class="seg">'
    +  '<button class="'+(ANV.byCyc?'on':'')+'" onclick="ANV.byCyc=true;render()">依帳單期</button>'
    +  '<button class="'+(ANV.byCyc?'':'on')+'" onclick="ANV.byCyc=false;render()">依消費日</button>'
    +  '</div><div class="chips scroll">';
  /* 月份由近到遠（10月 9月 8月…），整年放最後 */
  for(i=lastM;i>=0;i--)
    h += '<button class="chip'+(m===i?' on':'')+'" onclick="ANV.m='+i+';render()">'+(i+1)+'月</button>';
  h += '<button class="chip'+(m<0?' on':'')+'" onclick="ANV.m=-1;render()">整年</button>';
  h += '</div></div><div class="mut2 anote">'
    +  (ANV.byCyc ? '每筆掛在它所屬的那期帳單，金額應與電子帳單的本期應繳一致。'
                  : '用實際消費日分月。同一期帳單常跨兩個月，所以跟帳單金額不會一樣。')
    +  '</div>';
  B.filt = '<section class="sec">'+h+'</section>';

  /* 主數字 */
  var lastA = (m<0) ? txAgg(ym(y-1,0), ym(y-1,11))
                    : (m===0 ? txAgg(ym(y-1,11), ym(y-1,11)) : txAgg(ym(y,m-1), ym(y,m-1)));
  var diff = A.total - lastA.total;
  var heroLab = ANV.byCyc ? (m<0 ? y+' 年帳單合計' : y+'/'+p2(m+1)+' 期帳單')
                          : (m<0 ? y+' 年度累積刷卡' : y+' 年 '+(m+1)+' 月刷卡');
  var curCyc = ANV.byCyc && m===t.getMonth() && y===t.getFullYear();     /* 這個月的帳單還在陸續出 */
  var emptyNow = curCyc && !A.n;
  var notYetN = 0;
  if(curCyc){
    var gsn=billGroups(cycRef(ym(y,m)));
    for(i=0;i<gsn.length;i++) if(gsn[i].lc > t) notYetN++;
  }
  B.hero = sec('', '<div class="hero"><div class="lab">'+heroLab+'</div>'
    +  '<div class="big num" style="color:var(--brass)"><small>NT$</small>'+money(A.total)+'</div>'
    +  '<div class="legend" style="margin-top:8px"><span>'+A.n+' 筆</span>'
    +  '<span style="color:'+(diff>0?'var(--rose)':'var(--mint)')+'">'
    +  (lastA.total && !curCyc ? (diff>=0?'▲ ':'▼ ')+money(Math.abs(diff))+'（'+(m<0?'較去年':'較上月')+'）' : '—')+'</span>'
    +  '<span>平均 '+money(A.n?A.total/A.n:0)+' /筆</span></div>'
    +  (emptyNow ? '<div class="mut2" style="margin-top:8px">這個月結帳的帳單還沒出來，帳單匯入後就會有數字；看上個月點「'+(m||12)+'月」。</div>'
        : (curCyc && notYetN ? '<div class="mut2" style="margin-top:8px">還有 '+notYetN+' 家這個月還沒結帳，數字會再增加，所以先不跟上月比。</div>' : ''))
    +  ((A.refund || A.rebate) ? '<div class="stat3" style="margin-top:10px">'
        + '<div><div class="k">消費</div><div class="v num">'+money(A.spend)+'</div></div>'
        + (A.rebate ? '<div><div class="k">回饋/折抵</div><div class="v num" style="color:var(--mint)">'+money(A.rebate)+'</div></div>' : '')
        + (A.refund ? '<div><div class="k">退款</div><div class="v num" style="color:var(--mint)">'+money(A.refund)+'</div></div>' : '')
        + '<div><div class="k">淨額</div><div class="v num" style="color:var(--brass)">'+money(A.total)+'</div></div></div>' : '')
    +  '</div>');

  /* 月趨勢 */
  var mv=[], mx=0;
  for(i=0;i<12;i++){
    var v=txAgg(ym(y,i), ym(y,i)).total;
    mv.push(v); if(v>mx) mx=v;
  }
  h = '<div class="card"><div class="bars">';

      +  '<i style="height:'+hp.toFixed(1)+'%"></i><span class="bl">'+(i+1)+'</span></div>';
  }
  B.bars = sec(y+' 年月支出', h + '</div></div>');

  /* 分類佔比 */
  var cr = rank(A.cat);
  if(cr.length > 1){        /* 只有一類就不必顯示 */
    h = '<div class="card">';
    var other = 0;
    for(i=0;i<cr.length;i++){
      var co=catOf(cr[i].k), pc = A.total>0 ? cr[i].v/A.total*100 : 0;
      if(cr[i].k==='他') other = pc;
      h += '<div class="crank"><span class="cg">'+co.g+'</span><span class="cn">'+co.n+'</span>'
        +  '<span class="cb"><span class="gauge"><i style="width:'+Math.max(0,Math.min(100,pc)).toFixed(1)+'%;background:var(--brassd)"></i></span></span>'
        +  '<span class="cp num">'+pc.toFixed(0)+'%</span>'
        +  '<span class="cv num">'+money(cr[i].v)+'</span></div>';
    }
    if(other >= 15) h += '<div class="mut2" style="margin-top:4px">「其他」佔 '+other.toFixed(0)+'%。到記帳頁點一筆改分類，會存成規則，同名商店以後都照這個分。</div>';
    B.cat = sec('分類佔比', h + '</div>');

  /* 各銀行帳單對帳 */
  if(ANV.byCyc){
    var bsum={}, bcnt={}, i2;
    for(i2=0;i2<S.txns.length;i2++){
      var t2=S.txns[i2], k3=txKey(t2);
      if(!k3 || k3<from || k3>to) continue;
      var cd3=byId(S.cards,t2.cid);
      var bc3=cd3 ? (normCode(cd3.code) || ('?'+(cd3.name||'').slice(0,3))) : '?';
      bsum[bc3]=(bsum[bc3]||0)+(Number(t2.a)||0);

      h = '<div class="mut2" style="margin:-2px 0 8px">這裡的金額應該等於該銀行同一期電子帳單的本期應繳。</div>'
        + '<div class="card tcard"><table class="tbl">'
        + '<tr><th>銀行</th><th class="r">筆數</th><th class="r">明細加總</th></tr>';
      for(i2=0;i2<br.length;i2++){

      }
      h += '<tr><td>'+esc(cardTitle(cd))+'</td>'
        +  '<td class="num r" style="color:var(--dim)">'+cn+'</td>'
        +  '<td class="num r">'+money(kr[i].v)+'</td></tr>';
    }
    B.rank = sec('卡片使用排行', h + '</table></div>');
  }

  /* 卡片組成 */
  var cs=activeCards();
  if(cs.length){
    var byNet={}, byTier={}, nTra=0, nExp=0;
    var bankSet={}, bankAuto={}, bkey;
    for(i=0;i<cs.length;i++){
      var c=cs[i];
      byNet[c.net||'未設定']=(byNet[c.net||'未設定']||0)+1;
      byTier[c.tier||'一般卡']=(byTier[c.tier||'一般卡']||0)+1;
      /* 自動扣款是整家銀行一起扣，所以用銀行家數統計才有意義 */
      bkey=normCode(c.code) || ('?'+(c.name||'').slice(0,3));
      /* 簽帳金融卡是直接從存款扣，沒有帳單可以設自動扣款，不算進來 */
      if(!c.deb){ bankSet[bkey]=1; if(c.auto) bankAuto[bkey]=1; }
      if(c.tra && c.tra!=='無') nTra++;
      if(expSoon(c)) nExp++;
    }
    var nBank=0, nBankAuto=0;
    for(bkey in bankSet){ if(bankSet.hasOwnProperty(bkey)) nBank++; }
    for(bkey in bankAuto){ if(bankAuto.hasOwnProperty(bkey)) nBankAuto++; }
    h = '<div class="card">'
      +  '<div class="mut2" style="margin-bottom:7px">卡別</div><div class="chips" style="margin-bottom:13px">';
    var nr=rank(byNet);
    for(i=0;i<nr.length;i++) h += '<span class="chip">'+esc(nr[i].k)+' <b style="color:var(--brass)">'+nr[i].v+'</b></span>';
    h += '</div><div class="mut2" style="margin-bottom:7px">等級</div><div class="chips" style="margin-bottom:13px">';
    var tr2=rank(byTier);
    for(i=0;i<tr2.length;i++) h += '<span class="chip">'+esc(tr2[i].k)+' <b style="color:var(--brass)">'+tr2[i].v+'</b></span>';
    h += '</div><table class="tbl">'
      +  '<tr><td>已設自動扣款<div class="mut2">全部信用卡銀行（不論這期有沒有帳單）</div></td>'
      +  '<td class="num r" style="color:'
      +  (nBankAuto===nBank?'var(--mint)':'var(--txt)')+'">'+nBankAuto+' / '+nBank+' 家銀行</td></tr>'
      +  '<tr><td>綁行動票證</td><td class="num r">'+nTra+'</td></tr>'
      +  '<tr><td>4 個月內到期</td><td class="num r" style="color:'+(nExp?'var(--rose)':'var(--dim)')+'">'+nExp+'</td></tr>'
      +  '</table></div>';
    B.comp = sec('卡片組成<span class="ct">'+cs.length+' 張 · '+nBank+' 家銀行</span>', h);
  }
  /* 紅利點數 */
  var pb = ptBlock();
  if(pb) B.pts = sec('紅利點數 / 里程', pb);

  var cols = B.recon ? [['hero','recon','comp'],['bars','cat','rank','pts']]
                     : [['hero','cat','comp'],['bars','rank','pts']];
  return lay(B, ['filt','hero','bars','cat','recon','rank','pts','comp'], cols, 'c66', ['filt']);
}

/* 分析頁的紅利點數：每家銀行一列，點開看每期變化 */
var PTOPEN = '';
function togglePt(k){ PTOPEN = (PTOPEN===k ? '' : k); render(); }
function ptBlock(){
  if(!S.points.length) return '';
  var seen={}, banks=[], i;
  for(i=0;i<S.points.length;i++){
    var bc=normCode(S.points[i].code);
    if(!bc || seen[bc]) continue;
    seen[bc]=1; banks.push(bc);
  }
  if(!banks.length) return '';
  banks.sort();
  var h='<div class="card tcard"><table class="tbl">'
    + '<tr><th>銀行</th><th>項目</th><th class="r">本期增減</th><th class="r">目前結餘</th><th class="r">期別</th></tr>';
  for(i=0;i<banks.length;i++){
    var ps=ptLatest(banks[i]), k;
    for(k=0;k<ps.length;k++){
      var p=ps[k], d=p.add+p.adj-p.used, key=banks[i]+'|'+p.name;
      h += '<tr onclick="togglePt(\''+jsq(key)+'\')" style="cursor:pointer">'
        +  '<td>'+esc(k?'':bankLabel(banks[i]))+'</td><td>'+esc(p.name)+(p.ok?'':' <span style="color:var(--amber)">?</span>')+'</td>'
        +  '<td class="num r" style="color:'+(d>0?'var(--mint)':(d<0?'var(--rose)':'var(--dim2)'))+'">'+(d>0?'+':'')+ptNum(d)+'</td>'
        +  '<td class="num r"><b>'+ptNum(p.bal)+'</b>'+esc(p.unit)+'</td>'
        +  '<td class="num r mut2">'+esc(p.cyc.replace('-','/'))+'</td></tr>';
      if(PTOPEN===key){
        var all=ptRows(banks[i]), j;
        for(j=0;j<all.length && j<14;j++){
          if(all[j].name!==p.name) continue;
          var dd=all[j].add+all[j].adj-all[j].used;
          h += '<tr style="background:rgba(255,255,255,.02)"><td></td>'
            +  '<td class="mut2">'+esc(all[j].cyc.replace('-','/'))+'</td>'
            +  '<td class="num r mut2">'+(dd>0?'+':'')+ptNum(dd)+'</td>'
            +  '<td class="num r mut2">'+ptNum(all[j].bal)+'</td><td></td></tr>';
        }
      }
    }
  }
  h += '</table></div><div class="mut2" style="margin-top:8px">'
    + '點一列看每期變化。標 <span style="color:var(--amber)">?</span> 的表示「上期＋新增＋調整－使用」對不上結餘，數字僅供參考。</div>';
  return h;
}

/* 不分組的卡片列表下方：有卡片的銀行，各列一行點數 */
function ptSummary(cs){
  if(!S.points.length) return '';
  var seen={}, rows='', i, k;
  for(i=0;i<cs.length;i++){
    var bc=normCode(cs[i].code);
    if(!bc || seen[bc]) continue;
    seen[bc]=1;
    var ps=ptLatest(bc);
    for(k=0;k<ps.length;k++)
      rows += '<div class="ln" style="margin-bottom:5px"><span>'+esc(bankLabel(bc))+'　</span>'
        +  '<span style="flex:1"></span>'+ptLine(ps[k])+'</div>';
  }
  if(!rows) return '';
  return sec('紅利點數 / 里程', '<div class="card">'+rows+'</div>');
}

/* 停卡了但消費紀錄要留著：停用比刪除安全，額度與帳單都不再計入。 */
function toggleOff(id){
  var c = byId(S.cards, id); if(!c) return;
  if(!c.off && !confirm('停用「'+c.name+'」？\n\n' +
     '· 不再計入總額度與即將到期\n· 過去的消費紀錄都會留著\n· 隨時可以恢復'))
    return;

}

/* 彈出層開啟時鎖住背景捲動：iOS 上不鎖的話手指會捲到後面的頁面 */
var _sy = 0;
function openSheet(html){
  var wasOpen = $('sh').className === 'on';
  if(!wasOpen){
    _sy = window.pageYOffset || document.documentElement.scrollTop || 0;
    document.body.className = 'lock';
    document.body.style.top = (-_sy) + 'px';
  }
  $('shc').innerHTML = html;
  $('sh').scrollTop = 0;
  $('bd').className = 'on';
  $('sh').className = 'on';
}
function closeSheet(){
  if($('sh').className === 'on'){
    document.body.className = '';
    document.body.style.top = '';
    window.scrollTo(0, _sy);
  }
  $('bd').className = '';
  $('sh').className = '';
}

function autoDetect(force){
  var n=$('c_name'), e=$('c_det'); if(!n||!e) return;
  var d=detectCard(n.value), hit=[];
  if(d.net){ if($('c_net')) $('c_net').value=d.net; hit.push(d.net); }
  if($('c_tier')){ $('c_tier').value=d.tier; if(d.tier!=='一般卡') hit.push(d.tier); }

                           : '打完名稱會自動判斷卡別、等級與行動票證。';
}
function onBankPick(){
  if($('c_id') && $('c_id').value) return;
  var code=$('c_code')?$('c_code').value:''; if(!code) return;
  var src=null, i;
  for(i=0;i<S.cards.length;i++){ if(S.cards[i].code===code && !S.cards[i].off){ src=S.cards[i]; break; } }
  if($('c_site') && !$('c_site').value && BANK_SITE[code]) $('c_site').placeholder=BANK_SITE[code];
  if(!src) return;
  if($('c_limit')) $('c_limit').value = toWanIn(src.limit);
  if($('c_close')) $('c_close').value = src.close;
  if($('c_due'))   $('c_due').value   = src.due;
  if($('c_dnext')) $('c_dnext').value = src.dueNext ? '1' : '0';
  if($('c_shr'))   $('c_shr').checked = true;
  hintWan();
  toast('已帶入 '+(bankName(code)||code)+' 的額度 '+wan(src.limit)+'、結帳 '+src.close+' 號、繳款 '+src.due+' 號');
}
function pickColor(el, col){
